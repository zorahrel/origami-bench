<!DOCTYPE html><html><head><meta charset="utf-8"><title>Clockwork</title><style>html,body{margin:0;height:100%;background:#0b0d12;overflow:hidden}canvas{display:block}</style></head><body><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.1;
document.body.appendChild(R.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b0d12);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,200);

// fake environment: gradient + softboxes painted on a canvas, then prefiltered
const c=document.createElement('canvas');c.width=512;c.height=256;
const g=c.getContext('2d');
const gr=g.createLinearGradient(0,0,0,256);
gr.addColorStop(0,'#bcd0ff');gr.addColorStop(.5,'#3a3f4a');gr.addColorStop(1,'#14100a');
g.fillStyle=gr;g.fillRect(0,0,512,256);
g.fillStyle='#fff';g.fillRect(60,40,90,50);
g.fillStyle='#ffd9a0';g.fillRect(300,60,120,40);
g.fillStyle='#9fc0ff';g.fillRect(430,90,50,60);
g.fillStyle='#fff';g.fillRect(200,20,60,30);
const tex=new THREE.CanvasTexture(c);
tex.mapping=THREE.EquirectangularReflectionMapping;tex.colorSpace=THREE.SRGBColorSpace;
const pm=new THREE.PMREMGenerator(R);
scene.environment=pm.fromEquirectangular(tex).texture;

scene.add(new THREE.HemisphereLight(0xaabbff,0x331a08,.5));
const key=new THREE.DirectionalLight(0xfff0d0,2.2);key.position.set(10,20,30);scene.add(key);
const pl1=new THREE.PointLight(0x6fa0ff,800,60);pl1.position.set(-20,-10,15);scene.add(pl1);
const pl2=new THREE.PointLight(0xffa050,800,60);pl2.position.set(20,10,10);scene.add(pl2);

const mat=(col,rough)=>new THREE.MeshStandardMaterial({color:col,metalness:.92,roughness:rough});
const mats=[mat(0xc8a24a,.3),mat(0x9aa3ad,.25),mat(0xb87333,.35)];
const dark=mat(0x23262e,.5);

const back=new THREE.Mesh(new THREE.PlaneGeometry(80,50),new THREE.MeshStandardMaterial({color:0x1a1c22,metalness:.6,roughness:.55}));
back.position.set(2,0,-1.8);scene.add(back);

const m=.2,TH=.3;
function gearGeo(n){
  const r=m*n/2,p=2*Math.PI/n,ro=r+m,rr=r-1.25*m;
  const s=new THREE.Shape();let first=true;
  const pt=(rad,a)=>{const x=rad*Math.cos(a),y=rad*Math.sin(a);first?s.moveTo(x,y):s.lineTo(x,y);first=false;};
  for(let k=0;k<n;k++){const a=k*p;
    pt(rr,a-.28*p);pt(ro,a-.15*p);pt(ro,a+.15*p);pt(rr,a+.28*p);pt(rr,a+.5*p);}
  if(n>=24){
    for(let i=0;i<5;i++){const a=i/5*Math.PI*2,h=new THREE.Path();
      h.absarc(.55*r*Math.cos(a),.55*r*Math.sin(a),.17*r,0,Math.PI*2,true);s.holes.push(h);}
  }
  const geo=new THREE.ExtrudeGeometry(s,{depth:TH,bevelEnabled:true,bevelThickness:.03,bevelSize:.03,bevelSegments:1,curveSegments:10});
  geo.translate(0,0,-TH/2);return geo;
}

// p = meshing parent, a = direction from parent (deg), co = coaxial with another gear
const defs=[
 {n:40,x:0,y:0,z:0},
 {n:20,p:0,a:30,z:0},
 {n:30,co:1,z:.6},
 {n:15,p:2,a:80,z:.6},
 {n:36,co:3,z:1.2},
 {n:18,p:4,a:170,z:1.2},
 {n:28,p:0,a:200,z:0},
 {n:16,co:6,z:-.6},
 {n:24,p:7,a:250,z:-.6},
 {n:12,p:8,a:330,z:-.6}];
defs.forEach((d,i)=>{
  d.r=m*d.n/2;
  if(d.co!==undefined){const o=defs[d.co];d.x=o.x;d.y=o.y;}
  else if(d.p!==undefined){const P=defs[d.p],t=d.a*Math.PI/180;
    d.th=t;d.x=P.x+(P.r+d.r)*Math.cos(t);d.y=P.y+(P.r+d.r)*Math.sin(t);}
  const mesh=new THREE.Mesh(gearGeo(d.n),mats[i%3]);
  mesh.position.set(d.x,d.y,d.z);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.45,.45,TH+.15,24),mats[(i+1)%3]);
  hub.rotation.x=Math.PI/2;mesh.add(hub);
  const ax=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,1.1,12),mats[1]);
  ax.rotation.x=Math.PI/2;mesh.add(ax);
  d.mesh=mesh;scene.add(mesh);
});
// stand-off pins to the back plate
defs.forEach(d=>{
  if(d.co!==undefined)return;
  const pin=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,2.4,10),mats[1]);
  pin.rotation.x=Math.PI/2;pin.position.set(d.x,d.y,-.9);scene.add(pin);
});

// dial with ticking second hand
const dial=new THREE.Group();dial.position.set(13,5.5,.2);scene.add(dial);
const face=new THREE.Mesh(new THREE.CylinderGeometry(2.8,2.8,.2,64),dark);
face.rotation.x=Math.PI/2;dial.add(face);
const bez=new THREE.Mesh(new THREE.TorusGeometry(2.8,.13,12,64),mats[0]);dial.add(bez);
for(let i=0;i<60;i++){
  const big=i%5===0,a=-i/60*Math.PI*2;
  const tk=new THREE.Mesh(new THREE.BoxGeometry(big?.09:.05,big?.4:.2,.05),mats[1]);
  const rad=2.45;tk.position.set(Math.sin(-a)*rad,Math.cos(-a)*rad,.12);tk.rotation.z=a;dial.add(tk);
}
const hand=new THREE.Group();hand.position.z=.2;dial.add(hand);
const hm=new THREE.MeshStandardMaterial({color:0xd8332a,metalness:.6,roughness:.35,emissive:0x330806});
const hb=new THREE.Mesh(new THREE.BoxGeometry(.06,2.3,.04),hm);hb.position.y=.9;hand.add(hb);
const ht=new THREE.Mesh(new THREE.BoxGeometry(.1,.6,.04),hm);ht.position.y=-.4;hand.add(ht);
const cap=new THREE.Mesh(new THREE.SphereGeometry(.14,16,12),mats[0]);cap.position.z=.05;hand.add(cap);

// pendulum
const pend=new THREE.Group();pend.position.set(12,1.5,.2);scene.add(pend);
const rod=new THREE.Mesh(new THREE.BoxGeometry(.1,8,.1),mats[1]);rod.position.y=-4;pend.add(rod);
const bob=new THREE.Mesh(new THREE.CylinderGeometry(.9,.9,.3,40),mats[0]);
bob.rotation.x=Math.PI/2;bob.position.y=-8;pend.add(bob);
const bob2=new THREE.Mesh(new THREE.SphereGeometry(.35,20,14),mats[2]);bob2.position.set(0,-8,.2);pend.add(bob2);
const pv=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.5,20),mats[2]);
pv.rotation.x=Math.PI/2;pend.add(pv);

addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();});

const TAU=Math.PI*2;
function loop(ms){
  const t=ms/1000,fl=Math.floor(t),fr=t-fl;
  // spring-like tick: overshoots then settles; pendulum crosses centre on every tick
  const s=1-Math.exp(-fr*14)*Math.cos(fr*30);
  const tick=fl+s;
  hand.rotation.z=-tick*TAU/60;
  pend.rotation.z=.4*Math.sin(Math.PI*t);
  defs[0].rot=tick*.12;
  defs.forEach((d,i)=>{
    if(i>0){
      if(d.co!==undefined)d.rot=defs[d.co].rot;
      else{const P=defs[d.p],p=TAU/d.n;
        d.rot=-(P.n/d.n)*(P.rot-d.th)+d.th+Math.PI-p/2;}
    }
    d.mesh.rotation.z=d.rot;
  });
  const asp=innerWidth/innerHeight;
  cam.position.set(2+Math.sin(t*.15)*5,-1+Math.cos(t*.11)*3,(36+Math.sin(t*.07)*2)*Math.max(1,1.5/asp));
  cam.lookAt(2,-.5,0);
  pl2.position.x=20*Math.cos(t*.3);pl2.position.y=10*Math.sin(t*.3);
  R.render(scene,cam);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
