<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SDF Raymarch</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias: false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const frag = `
precision highp float;
uniform vec2 uRes;
uniform float uTime;

float smin(float a, float b, float k){
  float h = clamp(0.5 + 0.5*(b-a)/k, 0.0, 1.0);
  return mix(b, a, h) - k*h*(1.0-h);
}

float sdBlob(vec3 p, float t){
  float d = length(p) - 0.9;
  for(int i = 0; i < 4; i++){
    float fi = float(i);
    vec3 c = 0.9 * vec3(
      sin(t*0.7 + fi*1.7),
      cos(t*0.9 + fi*2.3),
      sin(t*0.5 + fi*3.1 + 1.0));
    d = smin(d, length(p - c) - (0.45 + 0.1*sin(t + fi)), 0.6);
  }
  d += 0.04*sin(6.0*p.x + t*2.0)*sin(6.0*p.y + t*1.7)*sin(6.0*p.z + t*2.3);
  return d;
}

float map(vec3 p){
  float blob = sdBlob(p - vec3(0.0, 1.4, 0.0), uTime);
  // repeating floor with bumpy tiles
  vec2 q = mod(p.xz + 2.0, 4.0) - 2.0;
  float bumps = 0.15*smoothstep(0.0, 1.0, 1.0 - length(q)*0.5);
  float floorD = p.y + 0.2 - bumps;
  return min(blob, floorD);
}

vec3 calcNormal(vec3 p){
  vec2 e = vec2(0.002, 0.0);
  return normalize(vec3(
    map(p + e.xyy) - map(p - e.xyy),
    map(p + e.yxy) - map(p - e.yxy),
    map(p + e.yyx) - map(p - e.yyx)));
}

float softShadow(vec3 ro, vec3 rd){
  float res = 1.0;
  float t = 0.05;
  for(int i = 0; i < 40; i++){
    float h = map(ro + rd*t);
    res = min(res, 10.0*h/t);
    t += clamp(h, 0.02, 0.4);
    if(res < 0.001 || t > 12.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

float calcAO(vec3 p, vec3 n){
  float occ = 0.0;
  float sca = 1.0;
  for(int i = 0; i < 5; i++){
    float h = 0.02 + 0.12*float(i);
    float d = map(p + n*h);
    occ += (h - d)*sca;
    sca *= 0.85;
  }
  return clamp(1.0 - 2.0*occ, 0.0, 1.0);
}

vec3 sky(vec3 rd){
  vec3 col = mix(vec3(0.05, 0.07, 0.15), vec3(0.35, 0.45, 0.7), clamp(rd.y*1.2 + 0.3, 0.0, 1.0));
  return col;
}

void main(){
  vec2 uv = (2.0*gl_FragCoord.xy - uRes) / uRes.y;
  float t = uTime;

  // moving camera orbiting the object and drifting forward
  float ang = t*0.25;
  vec3 ro = vec3(5.0*sin(ang), 2.2 + 0.8*sin(t*0.3), 5.0*cos(ang) + t*0.3);
  vec3 ta = vec3(0.0, 1.2, t*0.3);
  vec3 ww = normalize(ta - ro);
  vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));
  vec3 vv = cross(uu, ww);
  vec3 rd = normalize(uv.x*uu + uv.y*vv + 1.8*ww);

  // keep blob near target as camera drifts: shift world instead
  ro.z -= t*0.3;
  ta.z -= t*0.3;
  // floor pattern still scrolls via offset below
  vec3 off = vec3(0.0, 0.0, t*0.3);

  float dist = 0.0;
  bool hit = false;
  vec3 p;
  for(int i = 0; i < 100; i++){
    p = ro + rd*dist;
    float d = map(p + off);
    if(d < 0.001){ hit = true; break; }
    dist += d;
    if(dist > 40.0) break;
  }

  vec3 col = sky(rd);
  if(hit){
    vec3 pw = p + off;
    // blob lives at world origin region; offset only affects floor tiling via map's p
    vec3 n = calcNormal(pw);
    vec3 lig = normalize(vec3(0.6, 0.8, -0.4));
    float dif = clamp(dot(n, lig), 0.0, 1.0);
    float sh = softShadow(pw + n*0.01, lig);
    float ao = calcAO(pw, n);
    float fre = pow(clamp(1.0 + dot(n, rd), 0.0, 1.0), 3.0);

    bool isFloor = pw.y < -0.05 + 0.2 && (pw.y + 0.2) < 0.2 && abs(map(pw) - (pw.y + 0.2)) < 0.25 && length(pw - vec3(0.0,1.4,0.0)) > 2.2;
    vec3 base;
    if(isFloor){
      vec2 g = floor((pw.xz)*1.0);
      float chk = mod(g.x + g.y, 2.0);
      base = mix(vec3(0.12, 0.13, 0.18), vec3(0.45, 0.47, 0.55), chk);
    } else {
      base = 0.5 + 0.5*cos(6.2831*(vec3(0.0, 0.33, 0.67) + pw.y*0.3 + t*0.1));
    }

    vec3 amb = vec3(0.25, 0.3, 0.45) * (0.5 + 0.5*n.y) * ao;
    col = base*(amb + vec3(1.0, 0.9, 0.75)*dif*sh*1.3);
    // specular
    vec3 h = normalize(lig - rd);
    col += pow(clamp(dot(n, h), 0.0, 1.0), 40.0) * sh * 0.6;
    // fresnel glow
    col += fre * vec3(0.3, 0.6, 1.0) * (isFloor ? 0.15 : 0.9) * ao;
    // distance fog
    col = mix(col, sky(rd), 1.0 - exp(-0.003*dist*dist));
  }

  col = pow(col, vec3(0.4545));
  col *= 1.0 - 0.25*dot(uv*0.5, uv*0.5);
  gl_FragColor = vec4(col, 1.0);
}
`;

const vert = `
void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }
`;

const material = new THREE.ShaderMaterial({
  vertexShader: vert,
  fragmentShader: frag,
  uniforms: {
    uRes: {value: new THREE.Vector2(1, 1)},
    uTime: {value: 0}
  },
  depthTest: false,
  depthWrite: false
});

scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  const pr = renderer.getPixelRatio();
  material.uniforms.uRes.value.set(w*pr, h*pr);
}
window.addEventListener('resize', resize);
resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  material.uniforms.uTime.value = clock.getElapsedTime();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
