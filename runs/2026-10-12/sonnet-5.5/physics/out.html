<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sphere Sandbox</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f1a}
canvas{display:block}
</style>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0f1a);
scene.fog = new THREE.Fog(0x0b0f1a, 25, 60);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);

scene.add(new THREE.HemisphereLight(0xbcd4ff, 0x202030, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(8,16,6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
const sc = sun.shadow.camera;
sc.left=-12; sc.right=12; sc.top=12; sc.bottom=-12; sc.near=1; sc.far=50;
sun.shadow.bias = -0.0005;
scene.add(sun);

// ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80,80),
  new THREE.MeshStandardMaterial({color:0x151a2a, roughness:0.9})
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.6;
ground.receiveShadow = true;
scene.add(ground);

// box (glass-like), centered at origin in its own local frame; shaken via offset
const H = 3;            // half width (x,z)
const WALL_H = 6;       // wall height
const boxGroup = new THREE.Group();
scene.add(boxGroup);
const glass = new THREE.MeshPhysicalMaterial({
  color:0x9fd4ff, transparent:true, opacity:0.18, roughness:0.05,
  metalness:0, side:THREE.DoubleSide, depthWrite:false
});
const floor = new THREE.Mesh(new THREE.BoxGeometry(H*2+0.4,0.4,H*2+0.4),
  new THREE.MeshStandardMaterial({color:0x2a3350, roughness:0.4}));
floor.position.y = -0.2;
floor.receiveShadow = true;
boxGroup.add(floor);
for(const [x,z,w,d] of [[H,0,0.1,H*2],[-H,0,0.1,H*2],[0,H,H*2,0.1],[0,-H,H*2,0.1]]){
  const w_ = new THREE.Mesh(new THREE.BoxGeometry(w,WALL_H,d), glass);
  w_.position.set(x,WALL_H/2,z);
  boxGroup.add(w_);
}
const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(H*2,WALL_H,H*2)),
  new THREE.LineBasicMaterial({color:0xcfe8ff, transparent:true, opacity:0.5}));
edges.position.y = WALL_H/2;
boxGroup.add(edges);

// spheres
const N = 220;
const geo = new THREE.SphereGeometry(1,24,16);
const mat = new THREE.MeshStandardMaterial({roughness:0.35, metalness:0.1});
const mesh = new THREE.InstancedMesh(geo, mat, N);
mesh.castShadow = true;
mesh.receiveShadow = true;
mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(mesh);

const pos = new Float32Array(N*3), vel = new Float32Array(N*3), rad = new Float32Array(N);
const active = new Uint8Array(N);
const col = new THREE.Color();
for(let i=0;i<N;i++){
  rad[i] = 0.18 + Math.random()*0.27;
  col.setHSL(Math.random(), 0.7, 0.55);
  mesh.setColorAt(i, col);
  pos[i*3+1] = -100; // parked off-screen until dropped
}
mesh.instanceColor.needsUpdate = true;

let spawned = 0, spawnTimer = 0;
function spawn(){
  const i = spawned % N;
  const r = rad[i];
  pos[i*3]   = (Math.random()-0.5)*(H*2-1.5);
  pos[i*3+1] = WALL_H + 2 + Math.random()*2;
  pos[i*3+2] = (Math.random()-0.5)*(H*2-1.5);
  vel[i*3] = (Math.random()-0.5)*1; vel[i*3+1] = -1; vel[i*3+2] = (Math.random()-0.5)*1;
  active[i] = 1;
  spawned++;
}

// spatial hash for collisions
const CELL = 1.0, grid = new Map();
const key = (x,y,z)=> (x*73856093 ^ y*19349663 ^ z*83492791);

const G = -14, REST = 0.45, FRIC = 0.25, SUB = 3;
let shake = 0, shakeT = 0, nextShake = 6;
let boxOff = new THREE.Vector3(), boxVel = new THREE.Vector3();

function step(dt){
  // box shake: kinematic offset, spheres feel it through wall velocity
  const prev = boxOff.clone();
  if(shake>0){
    shakeT += dt;
    const a = shake;
    boxOff.set(Math.sin(shakeT*28)*0.25*a, Math.abs(Math.sin(shakeT*19))*0.15*a, Math.cos(shakeT*23)*0.25*a);
    shake = Math.max(0, shake - dt*0.6);
  } else boxOff.multiplyScalar(0.8);
  boxVel.copy(boxOff).sub(prev).divideScalar(dt);

  for(let i=0;i<N;i++){
    if(!active[i]) continue;
    vel[i*3+1] += G*dt;
    pos[i*3]   += vel[i*3]*dt;
    pos[i*3+1] += vel[i*3+1]*dt;
    pos[i*3+2] += vel[i*3+2]*dt;
  }

  // build grid
  grid.clear();
  for(let i=0;i<N;i++){
    if(!active[i]) continue;
    const k = key(Math.floor(pos[i*3]/CELL), Math.floor(pos[i*3+1]/CELL), Math.floor(pos[i*3+2]/CELL));
    let c = grid.get(k); if(!c){c=[];grid.set(k,c);} c.push(i);
  }

  // sphere-sphere
  for(let i=0;i<N;i++){
    if(!active[i]) continue;
    const ix=pos[i*3], iy=pos[i*3+1], iz=pos[i*3+2];
    const cx=Math.floor(ix/CELL), cy=Math.floor(iy/CELL), cz=Math.floor(iz/CELL);
    for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(let dz=-1;dz<=1;dz++){
      const c = grid.get(key(cx+dx,cy+dy,cz+dz)); if(!c) continue;
      for(const j of c){
        if(j<=i) continue;
        let nx=pos[j*3]-pos[i*3], ny=pos[j*3+1]-pos[i*3+1], nz=pos[j*3+2]-pos[i*3+2];
        const rr = rad[i]+rad[j];
        const d2 = nx*nx+ny*ny+nz*nz;
        if(d2>=rr*rr || d2<1e-10) continue;
        const d = Math.sqrt(d2); nx/=d; ny/=d; nz/=d;
        const pen = rr-d;
        const mi = rad[i]**3, mj = rad[j]**3, ms = mi+mj;
        const wi = mj/ms, wj = mi/ms;
        pos[i*3]-=nx*pen*wi; pos[i*3+1]-=ny*pen*wi; pos[i*3+2]-=nz*pen*wi;
        pos[j*3]+=nx*pen*wj; pos[j*3+1]+=ny*pen*wj; pos[j*3+2]+=nz*pen*wj;
        const rvx=vel[j*3]-vel[i*3], rvy=vel[j*3+1]-vel[i*3+1], rvz=vel[j*3+2]-vel[i*3+2];
        const vn = rvx*nx+rvy*ny+rvz*nz;
        if(vn>=0) continue;
        const jn = -(1+REST)*vn/(1/mi+1/mj);
        vel[i*3]-=jn*nx/mi; vel[i*3+1]-=jn*ny/mi; vel[i*3+2]-=jn*nz/mi;
        vel[j*3]+=jn*nx/mj; vel[j*3+1]+=jn*ny/mj; vel[j*3+2]+=jn*nz/mj;
        // tangential friction
        const tx=rvx-vn*nx, ty=rvy-vn*ny, tz=rvz-vn*nz;
        const tl=Math.hypot(tx,ty,tz);
        if(tl>1e-5){
          const jt = Math.min(FRIC*Math.abs(jn), tl/(1/mi+1/mj));
          const ux=tx/tl, uy=ty/tl, uz=tz/tl;
          vel[i*3]+=jt*ux/mi; vel[i*3+1]+=jt*uy/mi; vel[i*3+2]+=jt*uz/mi;
          vel[j*3]-=jt*ux/mj; vel[j*3+1]-=jt*uy/mj; vel[j*3+2]-=jt*uz/mj;
        }
      }
    }
  }

  // walls and floor (in box frame, box velocity added to relative motion)
  for(let i=0;i<N;i++){
    if(!active[i]) continue;
    const r = rad[i];
    const lx = pos[i*3]-boxOff.x, ly = pos[i*3+1]-boxOff.y, lz = pos[i*3+2]-boxOff.z;
    const inside = ly < WALL_H + 1;
    // floor
    if(ly < r){
      pos[i*3+1] += r-ly;
      const rv = vel[i*3+1]-boxVel.y;
      if(rv<0) vel[i*3+1] += -(1+REST)*rv;
      const f = 1 - FRIC*0.15;
      vel[i*3] = boxVel.x + (vel[i*3]-boxVel.x)*f;
      vel[i*3+2] = boxVel.z + (vel[i*3+2]-boxVel.z)*f;
    }
    if(!inside) continue;
    const lim = H - 0.05 - r;
    const axes = [[0,boxOff.x,boxVel.x],[2,boxOff.z,boxVel.z]];
    for(const [a,off,bv] of axes){
      const l = pos[i*3+a]-off;
      if(l>lim){ pos[i*3+a]=off+lim; const rv=vel[i*3+a]-bv; if(rv>0) vel[i*3+a]-= (1+REST)*rv; }
      else if(l<-lim){ pos[i*3+a]=off-lim; const rv=vel[i*3+a]-bv; if(rv<0) vel[i*3+a]-= (1+REST)*rv; }
    }
    // light damping so the pile settles
    vel[i*3]*=0.9995; vel[i*3+2]*=0.9995;
  }
}

const dummy = new THREE.Object3D();
function render(){
  for(let i=0;i<N;i++){
    dummy.position.set(pos[i*3],pos[i*3+1],pos[i*3+2]);
    const s = active[i]?rad[i]:0.0001;
    dummy.scale.setScalar(s);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;
  boxGroup.position.copy(boxOff);
}

let last = performance.now()/1000, t = 0;
function loop(){
  requestAnimationFrame(loop);
  const now = performance.now()/1000;
  let frame = Math.min(now-last, 0.05); last = now;
  t += frame;

  spawnTimer += frame;
  while(spawnTimer > 0.06){ spawnTimer -= 0.06; spawn(); }

  if(t > nextShake){ shake = 1; shakeT = 0; nextShake = t + 7; }

  const dt = frame/SUB;
  for(let s=0;s<SUB;s++) step(dt);
  render();

  const ang = t*0.15;
  camera.position.set(Math.cos(ang)*13, 7.5+Math.sin(t*0.1)*1.5, Math.sin(ang)*13);
  camera.lookAt(0,2.6,0);
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
// pre-drop a batch so the box isn't empty at first frame
for(let i=0;i<60;i++){ spawn(); pos[(spawned-1)*3+1] = 1 + i*0.35; }
loop();
</script>
</body>
</html>
