<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Walking in Place</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#19212b}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x19212b);
scene.fog = new THREE.Fog(0x19212b, 9, 26);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc4ddff, 0x34333b, 1.35));

const sun = new THREE.DirectionalLight(0xffe5c5, 3.2);
sun.position.set(-4, 8, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -5;
sun.shadow.camera.right = 5;
sun.shadow.camera.top = 6;
sun.shadow.camera.bottom = -4;
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 20;
sun.shadow.bias = -0.0002;
sun.shadow.normalBias = 0.025;
sun.shadow.radius = 4;
sun.target.position.set(0, 1.1, 0);
scene.add(sun, sun.target);

const pointLight = new THREE.PointLight(0x48c9ff, 24, 11, 2);
pointLight.position.set(2.4, 2.8, 2);
scene.add(pointLight);

const floorCanvas = document.createElement('canvas');
floorCanvas.width = floorCanvas.height = 512;
const ctx = floorCanvas.getContext('2d');
for (let y = 0; y < 8; y++) {
  for (let x = 0; x < 8; x++) {
    ctx.fillStyle = (x + y) % 2 ? '#727d89' : '#c8c9c1';
    ctx.fillRect(x * 64, y * 64, 64, 64);
  }
}
const floorTexture = new THREE.CanvasTexture(floorCanvas);
floorTexture.colorSpace = THREE.SRGBColorSpace;
floorTexture.wrapS = floorTexture.wrapT = THREE.RepeatWrapping;
floorTexture.repeat.set(10, 10);
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({map:floorTexture, roughness:0.94})
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const mat = (color, roughness=0.78, metalness=0) =>
  new THREE.MeshStandardMaterial({color, roughness, metalness});
const jacket = mat(0x235c68);
const jacketDark = mat(0x19434e);
const pants = mat(0x34465f);
const skin = mat(0xc98767);
const hair = mat(0x28232b);
const shoe = mat(0x252b34, 0.52);
const sole = mat(0xd49a49, 0.65);
const shirt = mat(0xe5d8bd);
const eyeWhite = mat(0xf4eee3, 0.38);
const eyeDark = mat(0x26252b, 0.35);
const buttonMat = mat(0xe5b75d, 0.42, 0.15);

function mesh(geometry, material, parent, position, scale) {
  const object = new THREE.Mesh(geometry, material);
  object.position.set(...position);
  if (scale) object.scale.set(...scale);
  object.castShadow = true;
  object.receiveShadow = true;
  parent.add(object);
  return object;
}
function cylinder(parent, top, bottom, length, material, position) {
  return mesh(new THREE.CylinderGeometry(top, bottom, length, 14), material, parent, position);
}
function ball(parent, radius, material, position, scale=[1,1,1]) {
  return mesh(new THREE.SphereGeometry(radius, 16, 12), material, parent, position, scale);
}

const character = new THREE.Group();
scene.add(character);

const pelvis = new THREE.Group();
character.add(pelvis);
pelvis.position.y = 1.08;
ball(pelvis, 0.34, pants, [0,0,0], [1,0.62,0.72]);

const torso = new THREE.Group();
torso.position.y = 0.08;
pelvis.add(torso);
cylinder(torso, 0.29, 0.37, 0.84, jacket, [0,0.46,0]);
ball(torso, 0.15, jacket, [0,0.79,0], [2.5,0.9,1.3]);
mesh(new THREE.BoxGeometry(0.105,0.57,0.025), shirt, torso, [0,0.48,0.302]);
for (const y of [0.69,0.49,0.29]) {
  ball(torso, 0.027, buttonMat, [0,y,0.324], [1,1,0.55]);
}
cylinder(torso, 0.11, 0.13, 0.22, skin, [0,0.10,0]);

const head = new THREE.Group();
head.position.y = 0.88;
torso.add(head);
ball(head, 0.24, skin, [0,0.30,0], [0.94,1.08,0.91]);
mesh(
  new THREE.SphereGeometry(0.247, 20, 14, 0, Math.PI*2, 0, Math.PI*0.58),
  hair, head, [0,0.32,0], [1,1,0.98]
);
for (const side of [-1,1]) {
  ball(head, 0.055, skin, [side*0.224,0.29,0.01], [0.62,0.9,0.72]);
  ball(head, 0.036, eyeWhite, [side*0.078,0.32,0.204], [1,1,0.55]);
  ball(head, 0.018, eyeDark, [side*0.078,0.32,0.224], [1,1,0.5]);
}
ball(head, 0.043, skin, [0,0.27,0.224], [0.8,1.15,0.78]);
mesh(new THREE.BoxGeometry(0.075,0.012,0.014), hair, head, [0,0.19,0.216]);

const legs = [];
for (const side of [-1,1]) {
  const hip = new THREE.Group();
  hip.position.set(side*0.21, -0.015, 0);
  pelvis.add(hip);

  cylinder(hip, 0.16, 0.12, 0.52, pants, [0,-0.26,0]);
  const knee = new THREE.Group();
  knee.position.y = -0.52;
  hip.add(knee);
  ball(knee, 0.125, pants, [0,0,0], [1,1,0.95]);
  cylinder(knee, 0.115, 0.078, 0.47, pants, [0,-0.235,0]);

  const ankle = new THREE.Group();
  ankle.position.y = -0.47;
  knee.add(ankle);
  mesh( new THREE.BoxGeometry(0.27,0.035,0.44), sole, ankle, [0,-0.075,0.105] );
  mesh( new THREE.BoxGeometry(0.25,0.13,0.42), shoe, ankle, [0,-0.015,0.11] );
  ball(ankle, 0.09, shoe, [0,-0.035,0.22], [1,0.72,0.9]);

  legs.push({hip, knee, ankle, side});
}

const arms = [];
for (const side of [-1,1]) {
  const shoulder = new THREE.Group();
  shoulder.position.set(side*0.39, 0.78, 0);
  torso.add(shoulder);
  ball(shoulder, 0.145, jacket, [0,0,0], [1,1,0.95]);
  cylinder(shoulder, 0.125, 0.095, 0.50, jacket, [0,-0.25,0]);

  const elbow = new THREE.Group();
  elbow.position.y = -0.50;
  shoulder.add(elbow);
  ball(elbow, 0.102, jacketDark, [0,0,0]);
  cylinder(elbow, 0.098, 0.072, 0.44, jacket, [0,-0.22,0]);
  cylinder(elbow, 0.078, 0.078, 0.075, buttonMat, [0,-0.39,0]);

  const hand = new THREE.Group();
  hand.position.y = -0.44;
  elbow.add(hand);
  ball(hand, 0.085, skin, [0,-0.055,0], [0.88,1.15,0.72]);
  for (let i = 0; i < 4; i++) {
    mesh(new THREE.BoxGeometry(0.032,0.12,0.035), skin, hand,
      [(i-1.5)*0.038,-0.16,0.012]);
  }
  const thumb = mesh(new THREE.BoxGeometry(0.04,0.105,0.04), skin, hand,
    [side*0.085,-0.07,0.015]);
  thumb.rotation.z = -side*0.48;

  arms.push({shoulder, elbow, hand, side});
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const phase = t * 5.0;
  const stride = Math.sin(phase);

  pelvis.position.y = 1.08 + 0.015 + 0.018*(1 + Math.cos(phase*2));
  pelvis.rotation.y = 0.018 * stride;
  torso.rotation.x = -0.035 + 0.014*Math.sin(phase*2);
  torso.rotation.y = 0.045 * stride;

  for (const leg of legs) {
    const swing = leg.side === -1 ? stride : -stride;
    leg.hip.rotation.x = swing * 0.46;
    leg.hip.rotation.z = leg.side * 0.012;
    leg.knee.rotation.x = 0.04 + 0.78*Math.max(0,-swing) + 0.06*Math.max(0,swing);
    leg.ankle.rotation.x = -0.48*leg.knee.rotation.x - 0.16*swing;
  }
  for (const arm of arms) {
    const swing = arm.side === -1 ? -stride : stride;
    arm.shoulder.rotation.x = swing * 0.34;
    arm.shoulder.rotation.z = arm.side * 0.025;
    arm.elbow.rotation.x = 0.10 + 0.22*Math.max(0,-swing);
    arm.hand.rotation.x = -0.08*Math.sin(phase + arm.side);
  }

  head.rotation.y = -torso.rotation.y * 0.45;
  head.rotation.z = 0.012*Math.sin(phase*0.5);
  pointLight.position.set(2.4*Math.cos(t*0.28), 2.8, 1.8 + 1.1*Math.sin(t*0.28));

  const orbit = t * 0.20;
  camera.position.set(Math.sin(orbit)*7.2, 2.85 + 0.12*Math.sin(orbit*0.7), Math.cos(orbit)*7.2);
  camera.lookAt(0,1.38,0);
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
