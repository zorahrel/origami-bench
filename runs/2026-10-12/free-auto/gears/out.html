<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Clockwork</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050302;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050302, 0.035);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 28);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffedd0, 0.4);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xfff5e6, 1.5);
        mainLight.position.set(10, 15, 20);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x90b0ff, 0.6);
        fillLight.position.set(-15, -10, 10);
        scene.add(fillLight);

        const backLight = new THREE.PointLight(0xffaa33, 2, 30);
        backLight.position.set(0, 0, -5);
        scene.add(backLight);

        // Materials
        const brassMaterial = new THREE.MeshStandardMaterial({
            color: 0xd4af37,
            metalness: 0.85,
            roughness: 0.25,
        });

        const copperMaterial = new THREE.MeshStandardMaterial({
            color: 0xb87333,
            metalness: 0.9,
            roughness: 0.3,
        });

        const steelMaterial = new THREE.MeshStandardMaterial({
            color: 0xaaaaaa,
            metalness: 0.95,
            roughness: 0.2,
        });

        const darkIronMaterial = new THREE.MeshStandardMaterial({
            color: 0x222225,
            metalness: 0.8,
            roughness: 0.4,
        });

        // Procedural Gear Geometry Generator
        function createGearGeometry(teeth, moduleSize = 0.4, width = 0.4) {
            const shape = new THREE.Shape();
            const radius = (teeth * moduleSize) / 2;
            const addendum = moduleSize * 0.8;
            const dedendum = moduleSize * 1.0;
            const outerRadius = radius + addendum;
            const rootRadius = radius - dedendum;
            const holeRadius = radius * 0.25;

            // Outer teeth profile
            const angleStep = (Math.PI * 2) / teeth;
            for (let i = 0; i < teeth; i++) {
                const theta = i * angleStep;
                
                const a = theta - angleStep * 0.25;
                const b = theta - angleStep * 0.12;
                const c = theta + angleStep * 0.12;
                const d = theta + angleStep * 0.25;

                const p1 = { x: Math.cos(a) * rootRadius, y: Math.sin(a) * rootRadius };
                const p2 = { x: Math.cos(b) * outerRadius, y: Math.sin(b) * outerRadius };
                const p3 = { x: Math.cos(c) * outerRadius, y: Math.sin(c) * outerRadius };
                const p4 = { x: Math.cos(d) * rootRadius, y: Math.sin(d) * rootRadius };

                if (i === 0) {
                    shape.moveTo(p1.x, p1.y);
                } else {
                    shape.lineTo(p1.x, p1.y);
                }
                shape.lineTo(p2.x, p2.y);
                shape.lineTo(p3.x, p3.y);
                shape.lineTo(p4.x, p4.y);
            }

            // Center hole for axis
            const holePath = new THREE.Path();
            holePath.absarc(0, 0, holeRadius, 0, Math.PI * 2, true);
            shape.holes.push(holePath);

            // Spokes for larger gears
            if (teeth > 14) {
                const spokeCount = 4;
                const spokeWidth = moduleSize * 0.6;
                for (let s = 0; s < spokeCount; s++) {
                    const angle = (s / spokeCount) * Math.PI * 2;
                    const innerHoleR = holeRadius * 1.3;
                    const outerR = rootRadius * 0.75;
                    
                    // Create cutout holes instead of full geometry modification
                    const cutoutPath = new THREE.Path();
                    const cutWidth = (Math.PI * 2 / spokeCount) * 0.3;
                    const cutAngle = angle + Math.PI / spokeCount;
                    
                    // We can just add interior holes to the shape to make spokes
                    // Let's create arc-based holes between inner and outer radii
                    const r1 = innerHoleR;
                    const r2 = outerR;
                    const a1 = angle + 0.1;
                    const a2 = angle + (Math.PI * 2 / spokeCount) - 0.1;
                    
                    // Using simple polygon holes for spokes
                    const cutShape = new THREE.Path();
                    const steps = 6;
                    for(let st=0; st<=steps; st++) {
                        const ta = a1 + (st/steps)*(a2-a1);
                        const x = Math.cos(ta) * r1;
                        const y = Math.sin(ta) * r1;
                        if(st===0) cutShape.moveTo(x,y); else cutShape.lineTo(x,y);
                    }
                    for(let st=0; st<=steps; st++) {
                        const ta = a2 - (st/steps)*(a2-a1);
                        const x = Math.cos(ta) * r2;
                        const y = Math.sin(ta) * r2;
                        cutShape.lineTo(x,y);
                    }
                    shape.holes.push(cutShape);
                }
            }

            const extrudeSettings = {
                steps: 1,
                depth: width,
                bevelEnabled: true,
                bevelThickness: 0.03,
                bevelSize: 0.03,
                bevelSegments: 2
            };

            const geom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            geom.center();
            return { geom, radius };
        }

        // Machine Assembly Data
        // We'll define a network of gears that mesh correctly.
        // Gear structure: [teeth, x, y, z, material, speedMultiplier, parentIndex]
        // Distance between gear 1 and 2 = (teeth1 + teeth2) * module / 2
        const moduleVal = 0.4;
        
        const gearConfigs = [
            { teeth: 32, x: 0,    y: 0,    z: 0.0, mat: brassMaterial,   speed: 1,      id: 0 },   // Master center
            { teeth: 16, x: -3.6, y: 0,    z: 0.4, mat: copperMaterial,  speed: -2,     id: 1 },   // Meshes with 0
            { teeth: 24, x: -3.6, y: -4.4, z: -0.2,mat: steelMaterial,   speed: 1.333,  id: 2 },   // Meshes with 1
            { teeth: 12, x: 2.8,  y: 0,    z: 0.8, mat: steelMaterial,   speed: -2.666, id: 3 },   // Meshes with 0
            { teeth: 28, x: 2.8,  y: 4.0,  z: 0.2, mat: copperMaterial,  speed: 1.142,  id: 4 },   // Meshes with 3
            { teeth: 20, x: -7.0, y: 1.5,  z: 0.6, mat: brassMaterial,   speed: 1.6,    id: 5 },   // Meshes with 1
            { teeth: 14, x: -7.0, y: -2.5, z: 1.0, mat: steelMaterial,   speed: -2.285, id: 6 },   // Meshes with 5
            { teeth: 36, x: 0,    y: -6.0, z: -0.5,mat: brassMaterial,   speed: -0.888, id: 7 },   // Meshes with 2
            { teeth: 16, x: 5.5,  y: -2.0, z: 0.5, mat: copperMaterial,  speed: -2,     id: 8 },   // Meshes with 3
        ];

        const gears = [];
        const clockGroup = new THREE.Group();
        scene.add(clockGroup);

        // Build gears and axles
        gearConfigs.forEach(cfg => {
            const { geom, radius } = createGearGeometry(cfg.teeth, moduleVal, 0.35);
            const mesh = new THREE.Mesh(geom, cfg.mat);
            mesh.position.set(cfg.x, cfg.y, cfg.z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            clockGroup.add(mesh);

            // Add central shaft/axis
            const axleGeom = new THREE.CylinderGeometry(0.15, 0.15, 1.2, 16);
            axleGeom.rotateX(Math.PI / 2);
            const axle = new THREE.Mesh(axleGeom, darkIronMaterial);
            axle.position.set(cfg.x, cfg.y, cfg.z - 0.2);
            clockGroup.add(axle);

            // Add center nut
            const nutGeom = new THREE.CylinderGeometry(0.25, 0.25, 0.15, 6);
            nutGeom.rotateX(Math.PI / 2);
            const nut = new THREE.Mesh(nutGeom, cfg.mat);
            nut.position.set(cfg.x, cfg.y, cfg.z + 0.22);
            clockGroup.add(nut);

            gears.push({
                mesh: mesh,
                speed: cfg.speed,
                baseRotation: Math.random() * Math.PI * 2
            });
        });

        // Add structural backplate and pillars
        const plateGeom = new THREE.BoxGeometry(14, 16, 0.3);
        const plateMesh = new THREE.Mesh(plateGeom, darkIronMaterial);
        plateMesh.position.set(0, 0, -1.2);
        plateMesh.receiveShadow = true;
        clockGroup.add(plateMesh);

        // Corner decorative pillars
        const pillarPositions = [
            [-6.5, 7.5, -0.6], [6.5, 7.5, -0.6],
            [-6.5, -7.5, -0.6], [6.5, -7.5, -0.6]
        ];
        pillarPositions.forEach(pos => {
            const pillarGeom = new THREE.CylinderGeometry(0.2, 0.2, 2.0, 12);
            pillarGeom.rotateX(Math.PI / 2);
            const pillar = new THREE.Mesh(pillarGeom, brassMaterial);
            pillar.position.set(...pos);
            pillar.castShadow = true;
            clockGroup.add(pillar);

            const capGeom = new THREE.CylinderGeometry(0.35, 0.3, 0.3, 12);
            capGeom.rotateX(Math.PI / 2);
            const cap1 = new THREE.Mesh(capGeom, darkIronMaterial);
            cap1.position.set(pos[0], pos[1], pos[2] - 1.0);
            clockGroup.add(cap1);

            const cap2 = cap1.clone();
            cap2.position.set(pos[0], pos[1], pos[2] + 1.0);
            clockGroup.add(cap2);
        });

        // Pendulum setup (attached to gear 7 or bottom area)
        const pendulumGroup = new THREE.Group();
        pendulumGroup.position.set(0, -6.0, -0.5);
        clockGroup.add(pendulumGroup);

        const rodGeom = new THREE.CylinderGeometry(0.05, 0.05, 8.0, 8);
        rodGeom.translate(0, -4.0, 0);
        const rod = new THREE.Mesh(rodGeom, steelMaterial);
        rod.castShadow = true;
        pendulumGroup.add(rod);

        const bobGeom = new THREE.SphereGeometry(0.8, 32, 32);
        bobGeom.scale(1, 1.5, 0.6);
        const bob = new THREE.Mesh(bobGeom, brassMaterial);
        bob.position.set(0, -8.0, 0);
        bob.castShadow = true;
        pendulumGroup.add(bob);

        // Escapement anchor (visual detail rocking back and forth near top/center)
        const anchorGroup = new THREE.Group();
        anchorGroup.position.set(0, 3.5, 0.5);
        clockGroup.add(anchorGroup);

        const anchorGeom = new THREE.BoxGeometry(2.0, 0.2, 0.3);
        const anchor = new THREE.Mesh(anchorGeom, steelMaterial);
        anchorGroup.add(anchor);

        // Clock hands (ticking second hand + smooth minute/hour hands)
        const handsGroup = new THREE.Group();
        handsGroup.position.set(0, 0, 1.2);
        clockGroup.add(handsGroup);

        // Dial ring
        const ringShape = new THREE.Shape();
        ringShape.absarc(0, 0, 5.5, 0, Math.PI * 2, false);
        const holeR = new THREE.Shape();
        holeR.absarc(0, 0, 5.2, 0, Math.PI * 2, true);
        ringShape.holes.push(holeR);
        const ringGeom = new THREE.ExtrudeGeometry(ringShape, { depth: 0.1, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02 });
        const ringMesh = new THREE.Mesh(ringGeom, brassMaterial);
        ringMesh.receiveShadow = true;
        ringMesh.castShadow = true;
        handsGroup.add(ringMesh);

        // Hour ticks
        for (let i = 0; i < 12; i++) {
            const angle = (i / 12) * Math.PI * 2;
            const tickGeom = new THREE.BoxGeometry(0.12, 0.5, 0.05);
            const tick = new THREE.Mesh(tickGeom, darkIronMaterial);
            tick.position.set(Math.sin(angle) * 4.8, Math.cos(angle) * 4.8, 0.05);
            tick.rotation.z = -angle;
            handsGroup.add(tick);
        }

        // Hour hand
        const hourHandGeom = new THREE.BoxGeometry(0.2, 3.0, 0.08);
        hourHandGeom.translate(0, 1.5, 0);
        const hourHand = new THREE.Mesh(hourHandGeom, brassMaterial);
        hourHand.castShadow = true;
        handsGroup.add(hourHand);

        // Minute hand
        const minHandGeom = new THREE.BoxGeometry(0.15, 4.5, 0.06);
        minHandGeom.translate(0, 2.25, 0);
        const minuteHand = new THREE.Mesh(minHandGeom, brassMaterial);
        minuteHand.castShadow = true;
        handsGroup.add(minuteHand);

        // Second hand (ticking)
        const secHandGeom = new THREE.BoxGeometry(0.06, 5.2, 0.04);
        secHandGeom.translate(0, 2.1, 0);
        const secondHand = new THREE.Mesh(secHandGeom, copperMaterial);
        secondHand.castShadow = true;
        handsGroup.add(secondHand);

        // Center cap for hands
        const handCapGeom = new THREE.CylinderGeometry(0.2, 0.2, 0.2, 16);
        handCapGeom.rotateX(Math.PI / 2);
        const handCap = new THREE.Mesh(handCapGeom, copperMaterial);
        handsGroup.add(handCap);

        // Animation state variables
        const clock = new THREE.Clock();
        let accumulatedTime = 0;

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            accumulatedTime += delta;

            const time = accumulatedTime;

            // Rotate gears with correct relative ratios
            const masterSpeed = 0.6;
            gears.forEach((gear) => {
                gear.mesh.rotation.z = gear.baseRotation + (time * gear.speed * masterSpeed);
            });

            // Pendulum physics simulation (harmonic oscillation)
            const pendulumAngle = Math.sin(time * 3.0) * 0.35;
            pendulumGroup.rotation.z = pendulumAngle;

            // Anchor rocks in sync with pendulum
            anchorGroup.rotation.z = Math.sin(time * 3.0) * 0.15;

            // Clock hands movement
            // Hour hand moves very slowly
            hourHand.rotation.z = -time * 0.02;
            // Minute hand
            minuteHand.rotation.z = -time * 0.24;
            
            // Ticking second hand (steps every 1 second)
            const tickProgress = Math.floor(time * 1.0) + Math.pow((time * 1.0) % 1.0, 4); // slight easing for snap tick
            secondHand.rotation.z = -tickProgress * (Math.PI / 30);

            // Subtle cinematic camera drift
            camera.position.x = Math.sin(time * 0.2) * 1.5;
            camera.position.y = Math.cos(time * 0.15) * 1.0;
            camera.lookAt(0, 0, 0);

            // Subtle lighting pulsation / warm flicker
            backLight.intensity = 2.0 + Math.sin(time * 5.0) * 0.2 + Math.cos(time * 13.0) * 0.1;

            renderer.render(scene, camera);
        }

        animate();

    </script>
</body>
</html>
