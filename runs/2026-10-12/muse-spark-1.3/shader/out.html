<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raymarched Blobs</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#05060a}
canvas{display:block;width:100vw;height:100vh}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const uniforms = { uTime:{value:0}, uRes:{value:new THREE.Vector2(window.innerWidth, window.innerHeight)} };
const mat = new THREE.ShaderMaterial({
uniforms,
vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
fragmentShader: `
varying vec2 vUv;
uniform float uTime;
uniform vec2 uRes;
float smin(float a,float b,float k){ float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0); return mix(b,a,h)-k*h*(1.0-h); }
float sdRoundBox(vec3 p, vec3 b, float r){ vec3 q=abs(p)-b; return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0)-r; }
vec2 map(vec3 p){
 float t=uTime;
 vec3 c=vec3(0.0,0.45,0.0);
 vec3 o1=c+vec3(0.75*sin(t*0.9),0.38*sin(t*1.2),0.75*cos(t*0.8));
 vec3 o2=c+vec3(0.75*sin(t*0.9+2.1),0.38*sin(t*1.1+1.3),0.75*cos(t*0.7+2.1));
 vec3 o3=c+vec3(0.75*sin(t*0.8+4.2),0.38*sin(t*1.3+4.0),0.75*cos(t*0.9+4.2));
 float d1=length(p-o1)-0.78;
 float d2=length(p-o2)-0.66;
 float d3=length(p-o3)-0.60;
 float d=smin(smin(d1,d2,0.75),d3,0.75);
 float disp=sin(p.x*2.8+t*1.2)*sin(p.y*3.1+t*1.5)*sin(p.z*2.9+t*0.9);
 d+=disp*0.12;
 float dPlane=p.y+1.0;
 vec3 fp=p;
 fp.xz=mod(fp.xz+1.5,3.0)-1.5;
 float dTile=sdRoundBox(fp-vec3(0.0,-0.95,0.0),vec3(0.62,0.12,0.62),0.06);
 float dFloor=min(dPlane,dTile);
 float dm=1.0;
 float df=dFloor;
 float dfm=2.0;
 if(dTile<0.35 && abs(dTile-dFloor)<0.001) dfm=3.0;
 vec2 res;
 if(d<df){ res=vec2(d,1.0); } else { res=vec2(df,dfm); }
 return res;
}
vec3 calcNormal(vec3 p){
 vec2 e=vec2(0.0015,0.0);
 return normalize(vec3(
  map(p+e.xyy).x-map(p-e.xyy).x,
  map(p+e.yxy).x-map(p-e.yxy).x,
  map(p+e.yyx).x-map(p-e.yyx).x));
}
float softshadow(vec3 ro, vec3 rd, float mint, float maxt, float k){
 float res=1.0;
 float t=mint;
 for(int i=0;i<32;i++){
  if(t>maxt) break;
  float h=map(ro+rd*t).x;
  if(h<0.001) return 0.0;
  res=min(res,k*h/t);
  t+=clamp(h,0.02,0.5);
 }
 return clamp(res,0.0,1.0);
}
float calcAO(vec3 p, vec3 n){
 float occ=0.0;
 float sca=1.0;
 for(int i=1;i<=5;i++){
  float h=0.01+0.12*float(i)/5.0;
  float d=map(p+n*h).x;
  occ+=(h-d)*sca;
  sca*=0.92;
 }
 return clamp(1.0-3.0*occ,0.0,1.0);
}
void main(){
 vec2 uv=vUv*2.0-1.0;
 uv.x*=uRes.x/uRes.y;
 float t=uTime;
 float ca=t*0.25;
 vec3 ro=vec3(4.4*sin(ca),1.7+0.6*sin(t*0.23),4.4*cos(ca));
 vec3 ta=vec3(0.0,0.25,0.0);
 vec3 fw=normalize(ta-ro);
 vec3 rt=normalize(cross(fw,vec3(0.0,1.0,0.0)));
 vec3 up=cross(rt,fw);
 vec3 rd=normalize(uv.x*rt+uv.y*up+1.9*fw);
 float dist=0.0;
 float m=-1.0;
 for(int i=0;i<128;i++){
  vec3 pos=ro+rd*dist;
  vec2 h=map(pos);
  if(h.x<0.0012*dist+0.0008||dist>42.0){ m=h.y; break; }
  dist+=h.x;
  m=h.y;
  if(dist>42.0) break;
 }
 vec3 bg=mix(vec3(0.02,0.03,0.08),vec3(0.06,0.02,0.10),0.5+0.5*uv.y);
 bg+=0.18*vec3(0.2,0.5,1.0)*exp(-abs(uv.y*2.0))* (0.6+0.4*sin(t*0.6));
 if(dist>42.0||m<0.0){ gl_FragColor=vec4(pow(bg,vec3(0.9)),1.0); return; }
 vec3 pos=ro+rd*dist;
 vec3 n=calcNormal(pos);
 vec3 lig=normalize(vec3(0.7*sin(t*0.4),0.95,0.7*cos(t*0.4)));
 float sh=softshadow(pos+n*0.03,lig,0.03,9.0,14.0);
 float ao=calcAO(pos,n);
 vec3 V=-rd;
 float dif=clamp(dot(n,lig),0.0,1.0)*sh;
 float sky=0.5+0.5*n.y;
 vec3 hv=normalize(lig+V);
 float spec=pow(clamp(dot(n,hv),0.0,1.0),36.0)*sh;
 float fres=pow(1.0-clamp(dot(n,V),0.0,1.0),3.0);
 vec3 albedo;
 vec3 emis=vec3(0.0);
 if(m<1.5){
  albedo=vec3(0.85,0.25,0.55);
  albedo=mix(albedo,vec3(0.25,0.6,1.0),0.5+0.5*sin(t*0.8+pos.y*4.0));
  emis=vec3(0.9,0.2,0.6)*fres*1.2;
 } else if(m<2.5){
  float ch=mod(floor(pos.x/1.5)+floor(pos.z/1.5),2.0);
  albedo=mix(vec3(0.10,0.11,0.16),vec3(0.16,0.17,0.24),ch);
  float gx=abs(fract(pos.x/3.0+0.5)-0.5);
  float gz=abs(fract(pos.z/3.0+0.5)-0.5);
  float line=smoothstep(0.485,0.5,max(gx,gz));
  emis+=vec3(0.1,0.7,1.0)*line*(0.6+0.4*sin(t*2.0))*0.9;
  emis+=vec3(0.9,0.2,0.8)*fres*0.35;
 } else {
  albedo=vec3(0.12,0.75,0.85);
  emis=vec3(0.1,0.8,1.0)*0.45;
 }
 vec3 col=albedo*(0.22+0.25*ao*sky+1.15*dif*vec3(1.0,0.9,0.8));
 col+=spec*vec3(1.0,0.95,0.9)*0.9;
 col+=emis*(0.4+0.6*ao);
 col+=fres*vec3(0.3,0.7,1.0)*0.45*ao;
 float fog=1.0-exp(-0.0016*dist*dist);
 col=mix(col,bg,clamp(fog,0.0,1.0));
 col=pow(clamp(col,0.0,1.0),vec3(0.4545));
 gl_FragColor=vec4(col,1.0);
}`
});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
window.addEventListener('resize', () => {
renderer.setSize(window.innerWidth, window.innerHeight);
uniforms.uRes.value.set(window.innerWidth, window.innerHeight);
});
const clock = new THREE.Clock();
function tick(){
uniforms.uTime.value = clock.getElapsedTime();
renderer.render(scene, cam);
requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
