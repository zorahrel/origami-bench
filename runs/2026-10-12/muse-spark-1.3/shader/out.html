<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raymarched Blob</title>
<style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#05060a}canvas{display:block;width:100vw;height:100vh}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const uniforms = { u_time:{value:0}, u_res:{value:new THREE.Vector2(window.innerWidth, window.innerHeight)} };
const mat = new THREE.ShaderMaterial({
uniforms,
vertexShader:`void main(){gl_Position=vec4(position.xy,0.0,1.0);}`,
fragmentShader:`
precision highp float;
uniform float u_time;
uniform vec2 u_res;
#define MAXD 30.0
float sdSphere(vec3 p,float r){return length(p)-r;}
float sdBox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0);}
float smin(float a,float b,float k){float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0);return mix(b,a,h)-k*h*(1.0-h);}
vec2 map(vec3 p){
  float t=u_time;
  vec3 c=vec3(0.0,0.55+0.25*sin(t*0.9),0.0);
  vec3 q1=p-c;
  float w=0.28*sin(2.6*q1.x+t*1.2)*sin(2.4*q1.y+t*1.6)*sin(2.8*q1.z+t*1.0);
  float d1=length(q1)-(0.95+0.18*sin(t*0.7))+w;
  vec3 c2=c+vec3(0.9*sin(t*0.8),0.45*sin(t*1.1+1.7),0.9*cos(t*0.8));
  float d2=length(p-c2)-(0.42+0.12*sin(t*1.3));
  float blob=smin(d1,d2,0.55);
  float floorD=p.y+1.0;
  vec2 cell=mod(p.xz+2.0,4.0)-2.0;
  float bx=0.42+0.08*sin(t+p.x*0.2+p.z*0.2);
  float bd=sdBox(vec3(cell.x,p.y+0.72,cell.y),vec3(bx,0.28,bx));
  float m=blob;
  float id=1.0;
  if(floorD<m){m=floorD;id=2.0;}
  if(bd<m){m=bd;id=3.0;}
  return vec2(m,id);
}
vec3 calcN(vec3 p){
  vec2 e=vec2(0.0015,0.0);
  return normalize(vec3(
    map(p+e.xyy).x-map(p-e.xyy).x,
    map(p+e.yxy).x-map(p-e.yxy).x,
    map(p+e.yyx).x-map(p-e.yyx).x));
}
float softShadow(vec3 ro,vec3 rd,float mint,float maxt,float k){
  float res=1.0;float t=mint;
  for(int i=0;i<24;i++){
    float h=map(ro+rd*t).x;
    if(h<0.001) return 0.0;
    res=min(res,k*h/t);
    t+=clamp(h,0.02,0.5);
    if(t>maxt) break;
  }
  return clamp(res,0.0,1.0);
}
float calcAO(vec3 p,vec3 n){
  float occ=0.0;float sca=1.0;
  for(int i=1;i<=5;i++){
    float h=0.02+0.12*float(i)/5.0;
    float d=map(p+n*h).x;
    occ+=(h-d)*sca;sca*=0.9;
  }
  return clamp(1.0-2.2*occ,0.0,1.0);
}
void main(){
  vec2 uv=(2.0*gl_FragCoord.xy-u_res)/u_res.y;
  float t=u_time;
  float ca=0.55+t*0.25;
  float ce=0.42+0.22*sin(t*0.23);
  float cr=5.2+0.8*sin(t*0.15);
  vec3 ro=vec3(cr*cos(ca)*cos(ce),cr*sin(ce)+0.4,cr*sin(ca)*cos(ce));
  vec3 ta=vec3(0.0,0.1,0.0);
  vec3 fw=normalize(ta-ro);
  vec3 rt=normalize(cross(fw,vec3(0.0,1.0,0.0)));
  vec3 up=normalize(cross(rt,fw));
  vec3 rd=normalize(uv.x*rt+uv.y*up+1.7*fw);
  vec3 col=vec3(0.0);
  vec3 bg=mix(vec3(0.015,0.03,0.07),vec3(0.05,0.10,0.20),0.5+0.5*rd.y);
  bg+=vec3(0.35,0.15,0.55)*pow(max(0.0,dot(rd,normalize(vec3(-0.5,0.4,-0.6)))),8.0)*0.6;
  float td=0.0;vec2 h;float id=-1.0;vec3 p;
  bool hit=false;
  for(int i=0;i<110;i++){
    p=ro+rd*td;
    h=map(p);
    if(h.x<0.0012){hit=true;id=h.y;break;}
    td+=h.x*0.9;
    if(td>MAXD) break;
  }
  if(hit){
    vec3 n=calcN(p);
    vec3 V=-rd;
    vec3 L=normalize(vec3(-0.55+0.3*sin(t*0.4),0.8, -0.55+0.3*cos(t*0.33)));
    vec3 H=normalize(L+V);
    float dif=max(dot(n,L),0.0);
    float sh=softShadow(p+n*0.02,L,0.03,8.0,9.0);
    float ao=calcAO(p,n);
    float fres=pow(1.0-max(dot(n,V),0.0),3.0);
    vec3 base;
    if(id<1.5) base=vec3(0.95,0.30,0.55);
    else if(id<2.5){
      vec2 g=floor(p.xz*0.9);
      float ch=mod(g.x+g.y,2.0);
      vec3 a=vec3(0.10,0.12,0.18);vec3 b=vec3(0.75,0.78,0.85);
      base=mix(a,b,ch);
      float fade=exp(-0.06*td);
      base=mix(vec3(0.06,0.08,0.14),base,fade);
    } else base=vec3(0.15,0.75,0.85);
    float spec=pow(max(dot(n,H),0.0),42.0)*0.9;
    vec3 amb=vec3(0.25,0.35,0.55)*(0.4+0.6*n.y*0.5+0.5);
    vec3 c=base*(amb*ao+dif*sh*vec3(1.1,0.95,0.85));
    c+=spec*sh*(id>1.5&&id<2.5?0.35:1.0);
    vec3 glowC=mix(vec3(1.0,0.25,0.6),vec3(0.25,0.8,1.0),0.5+0.5*sin(t*0.8+n.y*2.0));
    c+=glowC*fres*(0.55+0.45*ao)*1.4;
    c+=glowC*0.12*(0.5+0.5*sin(t*1.5+p.y*4.0));
    float fog=1.0-exp(-0.028*td*td*0.12-td*0.012);
    c=mix(c,bg,clamp(fog,0.0,1.0));
    col=c;
  } else {
    col=bg;
    vec2 g2=rd.xz/(abs(rd.y)+0.25);
    float grid=exp(-8.0*abs(fract(g2.x*0.6+t*0.02)-0.5))*0.02;
    col+=grid*max(0.0,-rd.y);
  }
  col=col/(1.0+0.35*dot(col,col));
  col=pow(max(col,0.0),vec3(0.4545));
  gl_FragColor=vec4(col,1.0);
}
`});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), mat));
window.addEventListener('resize', ()=>{
  renderer.setSize(window.innerWidth, window.innerHeight);
  uniforms.u_res.value.set(window.innerWidth, window.innerHeight);
});
const clock=new THREE.Clock();
function tick(){
  uniforms.u_time.value=clock.getElapsedTime();
  renderer.render(scene,cam);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
