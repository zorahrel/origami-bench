<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Procedural Clockwork</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0e14}
canvas{display:block;width:100%;height:100%}
#v{position:fixed;left:12px;bottom:10px;color:#8fa0b8;font:12px/1.4 system-ui,sans-serif;opacity:.7;pointer-events:none;letter-spacing:.04em}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head>
<body>
<div id="v">CLOCKWORK · 8 GEARS · PENDULUM · TICK</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b0e14);
scene.fog=new THREE.Fog(0x0b0e14,16,34);
function makeEnv(){
  const c=document.createElement('canvas');c.width=256;c.height=128;
  const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,128);
  gr.addColorStop(0,'#3a4a63');gr.addColorStop(0.45,'#141a26');gr.addColorStop(0.55,'#0b0d13');gr.addColorStop(1,'#05060a');
  g.fillStyle=gr;g.fillRect(0,0,256,128);
  g.fillStyle='rgba(255,240,210,0.95)';g.fillRect(20,18,52,22);g.fillRect(185,16,48,20);
  g.fillStyle='rgba(150,200,255,0.7)';g.fillRect(95,22,60,14);g.fillRect(30,80,180,10);
  g.fillStyle='rgba(255,255,255,0.9)';g.fillRect(110,86,36,5);
  const t=new THREE.CanvasTexture(c);
  t.mapping=THREE.EquirectangularReflectionMapping;
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
scene.environment=makeEnv();
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
document.body.appendChild(renderer.domElement);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,100);
camera.position.set(0,0.6,13.5);
scene.add(new THREE.HemisphereLight(0xbfd4ff,0x2a1f12,0.55));
scene.add(new THREE.AmbientLight(0x223044,0.6));
const key=new THREE.DirectionalLight(0xffe6bd,2.2);key.position.set(5,7,8);scene.add(key);
const rim=new THREE.DirectionalLight(0x6fb7ff,1.4);rim.position.set(-6,3,-4);scene.add(rim);
const fill=new THREE.DirectionalLight(0xffffff,0.5);fill.position.set(-4,-5,6);scene.add(fill);
const warm=new THREE.PointLight(0xff9a3c,18,20,2);warm.position.set(4,-2,3);scene.add(warm);
const cool=new THREE.PointLight(0x3c8cff,14,20,2);cool.position.set(-4,2,3.5);scene.add(cool);
const brass=new THREE.MeshStandardMaterial({color:0xc9973f,metalness:0.92,roughness:0.32,envMapIntensity:1.1});
const brassD=new THREE.MeshStandardMaterial({color:0x9a6f2a,metalness:0.9,roughness:0.42,envMapIntensity:0.9});
const steel=new THREE.MeshStandardMaterial({color:0xb9c2cf,metalness:0.95,roughness:0.28,envMapIntensity:1.1});
const darkM=new THREE.MeshStandardMaterial({color:0x3a4150,metalness:0.9,roughness:0.45,envMapIntensity:0.7});
const plateM=new THREE.MeshStandardMaterial({color:0x1a2230,metalness:0.75,roughness:0.55,envMapIntensity:0.5});
const redM=new THREE.MeshStandardMaterial({color:0xb3312a,metalness:0.6,roughness:0.4});
function circlePath(x,y,r){const p=new THREE.Path();p.absarc(x,y,r,0,Math.PI*2,true);return p;}
function gearGeo(T,mod,th){
  const rp=mod*T/2, ro=rp+mod*0.85, rr=Math.max(rp-mod*1.0,0.2);
  const s=new THREE.Shape();const da=Math.PI*2/T;
  for(let i=0;i<T;i++){
    const a=i*da;
    const pts=[[a,rr],[a+da*0.22,rr],[a+da*0.32,ro],[a+da*0.52,ro],[a+da*0.62,rr],[a+da,rr]];
    for(const [ang,r] of pts){const x=Math.cos(ang)*r,y=Math.sin(ang)*r;if(i===0&&ang===a&&r===rr&&s.curves.length===0&&s.currentPoint===undefined){} }
    for(let k=0;k<pts.length;k++){
      const x=Math.cos(pts[k][0])*pts[k][1],y=Math.sin(pts[k][0])*pts[k][1];
      if(i===0&&k===0)s.moveTo(x,y);else s.lineTo(x,y);
    }
  }
  s.closePath();
  s.holes.push(circlePath(0,0,0.13));
  if(rp>0.95){
    const n=rp>1.6?6:5, ring=rp*0.55, hr=Math.min(rp*0.18,ring-0.35,rr-ring-0.12);
    if(hr>0.12){for(let k=0;k<n;k++){const a=k/n*Math.PI*2;s.holes.push(circlePath(Math.cos(a)*ring,Math.sin(a)*ring,hr));}}
  }
  const g=new THREE.ExtrudeGeometry(s,{depth:th,bevelEnabled:true,bevelThickness:0.02,bevelSize:0.02,bevelSegments:1,curveSegments:5});
  g.translate(0,0,-th/2);g.computeVertexNormals();return g;
}
const teeth=[48,28,36,18,32,22,40,16];
const mod=0.09, TH=0.5;
const rp=teeth.map(t=>mod*t/2);
const dirs=[0,2.1,-0.55,2.55,0.45,2.0,-1.15];
const pos=[{x:-0.4,y:0.9,z:0}];
for(let i=1;i<8;i++){
  const d=rp[i-1]+rp[i]+0.025, a=dirs[i-1], p=pos[i-1];
  pos.push({x:p.x+Math.cos(a)*d,y:p.y+Math.sin(a)*d,z:(i%2)*0.35});
}
const w0=0.35, w=[], base=[0];
for(let i=0;i<8;i++)w.push(w0*(teeth[0]/teeth[i])*(i%2?-1:1));
for(let i=1;i<8;i++){
  const p=pos[i-1],c=pos[i],ang=Math.atan2(c.y-p.y,c.x-p.x);
  base.push(ang+Math.PI-(Math.PI-teeth[i-1]*(ang-base[i-1]))/teeth[i]);
}
const gears=[];
const mats=[brass,steel,brassD,steel,brass,steel,brassD,steel];
for(let i=0;i<8;i++){
  const m=new THREE.Mesh(gearGeo(teeth[i],mod,TH),mats[i%8]);
  m.position.set(pos[i].x,pos[i].y,pos[i].z);
  m.rotation.z=base[i];scene.add(m);gears.push(m);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,TH+0.22,20),darkM);
  hub.rotation.x=Math.PI/2;hub.position.copy(m.position);scene.add(hub);
  const ax=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,2.4,14),darkM);
  ax.rotation.x=Math.PI/2;ax.position.set(pos[i].x,pos[i].y,0.05);scene.add(ax);
  const cap=new THREE.Mesh(new THREE.SphereGeometry(0.11,14,10),redM);
  cap.position.set(pos[i].x,pos[i].y,1.0);scene.add(cap);
}
const plate=new THREE.Mesh(new THREE.BoxGeometry(13,10,0.3),plateM);
plate.position.set(0.4,-0.2,-1.05);scene.add(plate);
const plate2=new THREE.Mesh(new THREE.BoxGeometry(13,10,0.15),new THREE.MeshStandardMaterial({color:0x0e141f,metalness:0.6,roughness:0.7}));
plate2.position.set(0.4,-0.2,-1.28);scene.add(plate2);
for(const [sx,sy] of [[-5.6,3.9],[6.4,3.9],[-5.6,-4.4],[6.4,-4.4]]){
  const pil=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,1.6,12),brassD);
  pil.rotation.x=Math.PI/2;pil.position.set(sx,sy,-0.25);scene.add(pil);
}
// pendulum
const pend=new THREE.Group();pend.position.set(-3.6,3.4,0.55);scene.add(pend);
const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,4.8,10),steel);
rod.position.y=-2.4;pend.add(rod);
const anchor=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.3,14),brass);
anchor.rotation.x=Math.PI/2;pend.add(anchor);
const bob=new THREE.Mesh(new THREE.CylinderGeometry(0.62,0.62,0.18,32),brass);
bob.rotation.x=Math.PI/2;bob.position.y=-4.8;pend.add(bob);
const bobIn=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.2,32),redM);
bobIn.rotation.x=Math.PI/2;bobIn.position.y=-4.8;pend.add(bobIn);
// second-hand dial (ticking)
const dialC=new THREE.Vector3(3.6,-2.7,0.9);
const face=new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.05,0.12,40),new THREE.MeshStandardMaterial({color:0xf0e6cf,metalness:0.2,roughness:0.5}));
face.rotation.x=Math.PI/2;face.position.copy(dialC);scene.add(face);
const bez=new THREE.Mesh(new THREE.TorusGeometry(1.05,0.09,12,48),brass);
bez.position.copy(dialC);scene.add(bez);
for(let i=0;i<12;i++){
  const a=i/12*Math.PI*2;
  const tick=new THREE.Mesh(new THREE.BoxGeometry(i%3===0?0.09:0.04,i%3===0?0.22:0.12,0.02),new THREE.MeshStandardMaterial({color:0x1a1a1a}));
  tick.position.set(dialC.x+Math.cos(a)*0.86,dialC.y+Math.sin(a)*0.86,dialC.z+0.07);
  tick.rotation.z=a+Math.PI/2;scene.add(tick);
}
const hand=new THREE.Group();hand.position.set(dialC.x,dialC.y,dialC.z+0.14);scene.add(hand);
const needle=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.92,0.02),redM);needle.position.y=0.32;hand.add(needle);
const tail=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.28,0.02),redM);tail.position.y=-0.2;hand.add(tail);
const pin=new THREE.Mesh(new THREE.SphereGeometry(0.07,12,10),darkM);pin.position.z=0.02;hand.add(pin);
function easeOutBack(x){const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);}
const clock=new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const e=clock.getElapsedTime();
  for(let i=0;i<8;i++)gears[i].rotation.z=base[i]+w[i]*e;
  pend.rotation.z=0.32*Math.sin(Math.PI*e);
  const s=Math.floor(e),f=e-s;
  const k=f<0.22?easeOutBack(f/0.22):1;
  hand.rotation.z=-((s+k)/60)*Math.PI*2+Math.PI/2*0+Math.PI/2;
  // subtle camera drift
  camera.position.set(Math.sin(e*0.11)*1.1,0.6+Math.sin(e*0.13)*0.7,13.5+Math.sin(e*0.07)*0.9);
  camera.lookAt(0.3,-0.3,0);
  warm.intensity=18+Math.sin(e*2.1)*2;
  renderer.render(scene,camera);
}
tick();
</script>
</body>
</html>
