<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Walking Humanoid</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b1020}
#app{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head>
<body>
<div id="app"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b1020);
scene.fog=new THREE.Fog(0x0b1020,7,20);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,100);
function checkerTexture(){
const c=document.createElement('canvas');c.width=c.height=256;
const g=c.getContext('2d');const n=8,s=256/n;
for(let y=0;y<n;y++)for(let x=0;x<n;x++){g.fillStyle=(x+y)%2?'#1c2547':'#dfe6f5';g.fillRect(x*s,y*s,s,s);}
const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(14,14);
t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;
}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({map:checkerTexture(),roughness:0.9,metalness:0.0}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(40,28,0x445588,0x223055);grid.position.y=0.001;scene.add(grid);
scene.add(new THREE.HemisphereLight(0x8fb4ff,0x1a1410,0.55));
const sun=new THREE.DirectionalLight(0xfff2dd,2.2);
sun.position.set(3.5,6,2.5);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-4;sun.shadow.camera.right=4;sun.shadow.camera.top=5;sun.shadow.camera.bottom=-2;
sun.shadow.camera.far=20;sun.shadow.bias=-0.0004;sun.shadow.radius=4;
scene.add(sun);
const glow=new THREE.PointLight(0xff3d8a,30,12,2);glow.position.set(-2.2,1.6,-1.8);scene.add(glow);
const rim=new THREE.PointLight(0x22d3ee,18,12,2);rim.position.set(2.2,2.2,-2.4);scene.add(rim);
const skin=new THREE.MeshStandardMaterial({color:0xe8b08a,roughness:0.6});
const shirt=new THREE.MeshStandardMaterial({color:0x2f7de1,roughness:0.7});
const pants=new THREE.MeshStandardMaterial({color:0x232a3a,roughness:0.8});
const shoeM=new THREE.MeshStandardMaterial({color:0xf1f5f9,roughness:0.5});
const hairM=new THREE.MeshStandardMaterial({color:0x2b1c12,roughness:0.9});
function mesh(geo,mat,x=0,y=0,z=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;return m;}
const character=new THREE.Group();scene.add(character);
const H=0.98;
const pelvis=mesh(new THREE.BoxGeometry(0.34,0.18,0.22),pants,0,H,0);character.add(pelvis);
const spine=new THREE.Group();spine.position.set(0,H,0);character.add(spine);
const torso=mesh(new THREE.BoxGeometry(0.4,0.52,0.24),shirt,0,0.34,0);spine.add(torso);
const chestStripe=mesh(new THREE.BoxGeometry(0.42,0.08,0.26),new THREE.MeshStandardMaterial({color:0xffb703}),0,0.42,0);spine.add(chestStripe);
const neck=mesh(new THREE.CylinderGeometry(0.06,0.06,0.1,12),skin,0,0.64,0);spine.add(neck);
const headG=new THREE.Group();headG.position.set(0,0.7,0);spine.add(headG);
const head=mesh(new THREE.SphereGeometry(0.15,24,18),skin,0,0.12,0);headG.add(head);
const hair=mesh(new THREE.SphereGeometry(0.155,24,16,0,Math.PI*2,0,Math.PI*0.55),hairM,0,0.135,-0.015);headG.add(hair);
const eyeG=new THREE.SphereGeometry(0.018,8,8),eyeM=new THREE.MeshBasicMaterial({color:0x111111});
const eL=new THREE.Mesh(eyeG,eyeM);eL.position.set(-0.055,0.12,0.135);headG.add(eL);
const eR=eL.clone();eR.position.x=0.055;headG.add(eR);
function makeArm(side){
const s=new THREE.Group();s.position.set(0.26*side,0.55,0);spine.add(s);
const up=mesh(new THREE.CapsuleGeometry(0.06,0.2,6,12),shirt,0,-0.15,0);s.add(up);
const el=new THREE.Group();el.position.set(0,-0.3,0);s.add(el);
const lo=mesh(new THREE.CapsuleGeometry(0.05,0.18,6,12),skin,0,-0.13,0);el.add(lo);
const hand=mesh(new THREE.SphereGeometry(0.065,14,12),skin,0,-0.3,0);hand.scale.set(0.9,1.25,0.9);el.add(hand);
s.rotation.z=side*0.12;
return {shoulder:s,elbow:el};
}
function makeLeg(side){
const hip=new THREE.Group();hip.position.set(0.11*side,-0.06,0);hip.position.y=H-0.06;character.add(hip);
const thigh=mesh(new THREE.CapsuleGeometry(0.08,0.28,6,12),pants,0,-0.22,0);hip.add(thigh);
const knee=new THREE.Group();knee.position.set(0,-0.45,0);hip.add(knee);
const shin=mesh(new THREE.CapsuleGeometry(0.06,0.28,6,12),pants,0,-0.2,0);knee.add(shin);
const foot=mesh(new THREE.BoxGeometry(0.11,0.07,0.26),shoeM,0,-0.42,0.06);knee.add(foot);
return {hip,knee,foot};
}
const armL=makeArm(-1),armR=makeArm(1);
const legL=makeLeg(-1),legR=makeLeg(1);
armL.shoulder.position.y=0.55;armR.shoulder.position.y=0.55;
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const clock=new THREE.Clock();
function animate(){
requestAnimationFrame(animate);
const t=clock.getElapsedTime();
const ph=t*6.2;
const swL=Math.sin(ph),swR=Math.sin(ph+Math.PI);
legL.hip.rotation.x=swL*0.62;
legR.hip.rotation.x=swR*0.62;
legL.knee.rotation.x=Math.max(0,Math.sin(ph-0.9))*1.15+0.08;
legR.knee.rotation.x=Math.max(0,Math.sin(ph+Math.PI-0.9))*1.15+0.08;
legL.foot.rotation.x=-(legL.hip.rotation.x+legL.knee.rotation.x)*0.55;
legR.foot.rotation.x=-(legR.hip.rotation.x+legR.knee.rotation.x)*0.55;
armL.shoulder.rotation.x=swR*0.5;
armR.shoulder.rotation.x=swL*0.5;
armL.elbow.rotation.x=0.35+Math.max(0,swR)*0.7;
armR.elbow.rotation.x=0.35+Math.max(0,swL)*0.7;
armL.shoulder.rotation.z=-0.14;armR.shoulder.rotation.z=0.14;
spine.rotation.y=swL*0.14;
spine.rotation.x=0.06+Math.cos(ph*2)*0.015;
spine.position.y=H+Math.abs(Math.cos(ph))*0.055-0.02;
character.position.y=Math.abs(Math.cos(ph))*0.02;
character.rotation.z=Math.sin(ph)*0.02;
headG.rotation.y=-spine.rotation.y*0.7;
headG.rotation.x=-0.05+Math.cos(ph*2)*0.02;
glow.intensity=26+Math.sin(t*2.3)*6;
const a=t*0.45,r=3.4;
camera.position.set(Math.sin(a)*r,1.55+Math.sin(t*0.4)*0.25,Math.cos(a)*r);
camera.lookAt(0,1.05,0);
renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
