<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Physics Sandbox - No Library</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b1020;font-family:system-ui,sans-serif}
#app{position:fixed;inset:0}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;color:#dbe7ff;background:rgba(10,16,34,.55);border:1px solid rgba(140,180,255,.25);padding:8px 12px;border-radius:10px;font-size:13px;backdrop-filter:blur(6px);pointer-events:none;user-select:none}
#hud b{color:#fff}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head>
<body>
<div id="app"></div>
<div id="hud"><b>170 spheres</b> · custom physics · shake <span id="st">—</span></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const N=170, H=5, WALL_H=6, GRAV=-18, E_WALL=0.5, E_FLOOR=0.42, E_BALL=0.32;
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b1020);
scene.fog=new THREE.Fog(0x0b1020,28,70);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,200);
scene.add(new THREE.HemisphereLight(0xbcd4ff,0x1a2035,0.9));
scene.add(new THREE.AmbientLight(0xffffff,0.25));
const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(10,18,7);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-14;sun.shadow.camera.right=14;
sun.shadow.camera.top=14;sun.shadow.camera.bottom=-14;
sun.shadow.camera.far=50;sun.shadow.bias=-0.0004;
scene.add(sun);
const rim=new THREE.DirectionalLight(0x66aaff,0.7);
rim.position.set(-9,7,-10);scene.add(rim);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshStandardMaterial({color:0x11182e,roughness:0.9,metalness:0}));
ground.rotation.x=-Math.PI/2;ground.position.y=-0.02;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(60,60,0x2a3d66,0x1a2542);
grid.position.y=0.01;scene.add(grid);
const boxGroup=new THREE.Group();scene.add(boxGroup);
const glassMat=new THREE.MeshPhysicalMaterial({color:0x9fd4ff,transparent:true,opacity:0.13,roughness:0.08,metalness:0,side:THREE.DoubleSide});
const floorGlass=new THREE.Mesh(new THREE.BoxGeometry(H*2,0.15,WALL_H*0+ H*2),new THREE.MeshPhysicalMaterial({color:0x9fd4ff,transparent:true,opacity:0.18,roughness:0.15}));
floorGlass.position.y=-0.075;floorGlass.receiveShadow=true;boxGroup.add(floorGlass);
function wall(w,h,x,y,z,ry){
const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),glassMat);
m.position.set(x,y,z);m.rotation.y=ry;boxGroup.add(m);
const e=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),new THREE.LineBasicMaterial({color:0x7fb8ff,transparent:true,opacity:0.9}));
e.position.copy(m.position);e.rotation.copy(m.rotation);boxGroup.add(e);
return m;
}
wall(H*2,WALL_H,0,WALL_H/2,-H,0);
wall(H*2,WALL_H,0,WALL_H/2,H,0);
wall(H*2,WALL_H,-H,WALL_H/2,0,Math.PI/2);
wall(H*2,WALL_H,H,WALL_H/2,0,Math.PI/2);
const geo=new THREE.SphereGeometry(1,20,14);
const mat=new THREE.MeshStandardMaterial({roughness:0.35,metalness:0.05});
const mesh=new THREE.InstancedMesh(geo,mat,N);
mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);
const px=new Float32Array(N),py=new Float32Array(N),pz=new Float32Array(N);
const vx=new Float32Array(N),vy=new Float32Array(N),vz=new Float32Array(N);
const rad=new Float32Array(N),invM=new Float32Array(N);
const dummy=new THREE.Object3D();const col=new THREE.Color();
for(let i=0;i<N;i++){
rad[i]=0.25+Math.random()*0.4;
invM[i]=1/Math.pow(rad[i],3);
px[i]=(Math.random()*2-1)*4;py[i]=8+Math.random()*22;pz[i]=(Math.random()*2-1)*4;
col.setHSL(Math.random(),0.75,0.55);
mesh.setColorAt(i,col);
}
mesh.instanceColor.needsUpdate=true;
let spawnIdx=0,spawnT=0,simT=0,nextShake=4,shakeT=99,ox=0,oz=0;
const stEl=document.getElementById('st');
function doShake(){
shakeT=0;nextShake=simT+5+Math.random()*3;
for(let i=0;i<N;i++){vx[i]+=(Math.random()-0.5)*7;vz[i]+=(Math.random()-0.5)*7;vy[i]+=Math.random()*5;}
}
function step(h){
for(let i=0;i<N;i++){vy[i]+=GRAV*h;vx[i]*=0.999;vy[i]*=0.9995;vz[i]*=0.999;px[i]+=vx[i]*h;py[i]+=vy[i]*h;pz[i]+=vz[i]*h;}
for(let i=0;i<N;i++){
const r=rad[i];
if(py[i]<r){py[i]=r;if(vy[i]<0)vy[i]=-vy[i]*E_FLOOR;vx[i]*=0.94;vz[i]*=0.94;if(Math.abs(vy[i])<0.4)vy[i]=0;}
const x0=-H+r+ox,x1=H-r+ox,z0=-H+r+oz,z1=H-r+oz;
if(px[i]<x0){px[i]=x0;if(vx[i]<0)vx[i]=-vx[i]*E_WALL;vy[i]*=0.95;vz[i]*=0.95;}
else if(px[i]>x1){px[i]=x1;if(vx[i]>0)vx[i]=-vx[i]*E_WALL;vy[i]*=0.95;vz[i]*=0.95;}
if(pz[i]<z0){pz[i]=z0;if(vz[i]<0)vz[i]=-vz[i]*E_WALL;vx[i]*=0.95;vy[i]*=0.95;}
else if(pz[i]>z1){pz[i]=z1;if(vz[i]>0)vz[i]=-vz[i]*E_WALL;vx[i]*=0.95;vy[i]*=0.95;}
}
for(let i=0;i<N;i++){
for(let j=i+1;j<N;j++){
const dx=px[j]-px[i],dy=py[j]-py[i],dz=pz[j]-pz[i];
const rs=rad[i]+rad[j],d2=dx*dx+dy*dy+dz*dz;
if(d2<rs*rs&&d2>1e-9){
const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,nz=dz/d,ov=rs-d;
const w1=invM[i],w2=invM[j],ws=w1+w2;
px[i]-=nx*ov*(w1/ws);py[i]-=ny*ov*(w1/ws);pz[i]-=nz*ov*(w1/ws);
px[j]+=nx*ov*(w2/ws);py[j]+=ny*ov*(w2/ws);pz[j]+=nz*ov*(w2/ws);
const rvx=vx[j]-vx[i],rvy=vy[j]-vy[i],rvz=vz[j]-vz[i];
const vn=rvx*nx+rvy*ny+rvz*nz;
if(vn<0){
const jj=-(1+E_BALL)*vn/ws;
vx[i]-=jj*w1*nx;vy[i]-=jj*w1*ny;vz[i]-=jj*w1*nz;
vx[j]+=jj*w2*nx;vy[j]+=jj*w2*ny;vz[j]+=jj*w2*nz;
const tx=rvx-vn*nx,ty=rvy-vn*ny,tz=rvz-vn*nz;
vx[i]+=tx*0.02;vy[i]+=ty*0.02;vz[i]+=tz*0.02;
vx[j]-=tx*0.02;vy[j]-=ty*0.02;vz[j]-=tz*0.02;
}
}
}
}
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
let last=performance.now(),camA=0.6;
function tick(now){
requestAnimationFrame(tick);
let dt=Math.min((now-last)/1000,0.033);last=now;simT+=dt;shakeT+=dt;
spawnT+=dt;
if(spawnT>0.12){spawnT=0;const i=spawnIdx;spawnIdx=(spawnIdx+1)%N;
px[i]=(Math.random()*2-1)*3.5+ox;py[i]=11+Math.random()*4;pz[i]=(Math.random()*2-1)*3.5+oz;
vx[i]=(Math.random()-0.5)*2;vy[i]=-1;vz[i]=(Math.random()-0.5)*2;}
if(simT>=nextShake)doShake();
const sh=shakeT<1.2?(1-shakeT/1.2):0;
ox=Math.sin(simT*38)*0.35*sh;oz=Math.cos(simT*31)*0.35*sh;
boxGroup.position.x=ox;boxGroup.position.z=oz;
stEl.textContent=sh>0.02?'SHAKE!':'in '+(nextShake-simT).toFixed(1)+'s';
const sub=2,h=dt/sub;
for(let s=0;s<sub;s++)step(h);
for(let i=0;i<N;i++){dummy.position.set(px[i],py[i],pz[i]);dummy.scale.setScalar(rad[i]);dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix);}
mesh.instanceMatrix.needsUpdate=true;
camA+=dt*0.18;
const R=19;camera.position.set(Math.cos(camA)*R,11.5+Math.sin(simT*0.3)*1.2,Math.sin(camA)*R);
camera.lookAt(0,2.8,0);
renderer.render(scene,camera);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
