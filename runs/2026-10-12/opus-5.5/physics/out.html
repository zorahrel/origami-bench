<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sphere Physics Sandbox</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0d1320}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;left:12px;top:10px;color:#cfe3ff;font:12px/1.4 system-ui,sans-serif;opacity:.75;pointer-events:none}
</style>
</head>
<body>
<div id="hud"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const MAX = 220, W = 3.5, H = 4.5, G = 9.81;
const E_BALL = 0.45, E_WALL = 0.35, MU = 0.12, SUB = 6;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1320);
scene.fog = new THREE.Fog(0x0d1320, 18, 45);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);

scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x202030, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(6, 14, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = sc.bottom = -9; sc.right = sc.top = 9; sc.near = 1; sc.far = 40;
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.02;
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x1b2333, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.2;
ground.receiveShadow = true;
scene.add(ground);

// Box: everything in a group so the shake moves it as one
const box = new THREE.Group();
scene.add(box);
const base = new THREE.Mesh(new THREE.BoxGeometry(2 * W + 0.2, 0.2, 2 * W + 0.2), new THREE.MeshStandardMaterial({ color: 0x8a96a8, roughness: 0.4, metalness: 0.1 }));
base.position.y = -0.1;
base.receiveShadow = true;
base.castShadow = true;
box.add(base);
const glass = new THREE.MeshPhysicalMaterial({ color: 0xaad4ff, roughness: 0.05, metalness: 0, transparent: true, opacity: 0.16, depthWrite: false, side: THREE.DoubleSide, clearcoat: 1 });
const T = 0.06;
for (const [sx, sz, x, z] of [[2 * W, T, 0, -W - T / 2], [2 * W, T, 0, W + T / 2], [T, 2 * W + 2 * T, -W - T / 2, 0], [T, 2 * W + 2 * T, W + T / 2, 0]]) {
  const p = new THREE.Mesh(new THREE.BoxGeometry(sx, H, sz), glass);
  p.position.set(x, H / 2, z);
  p.renderOrder = 2;
  box.add(p);
}
const edges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(2 * W + 2 * T, H, 2 * W + 2 * T)), new THREE.LineBasicMaterial({ color: 0xcfe8ff, transparent: true, opacity: 0.55 }));
edges.position.y = H / 2;
box.add(edges);

// Spheres
const mesh = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 24, 16), new THREE.MeshStandardMaterial({ roughness: 0.35, metalness: 0.1 }), MAX);
mesh.castShadow = mesh.receiveShadow = true;
mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
mesh.count = 0;
mesh.frustumCulled = false;
scene.add(mesh);

const px = new Float32Array(MAX), py = new Float32Array(MAX), pz = new Float32Array(MAX);
const vx = new Float32Array(MAX), vy = new Float32Array(MAX), vz = new Float32Array(MAX);
const rad = new Float32Array(MAX), im = new Float32Array(MAX);
const col = new THREE.Color();
let n = 0, recycle = 0, spawnT = 0;

function spawn(i) {
  const r = 0.18 + Math.random() ** 1.6 * 0.37;
  rad[i] = r;
  im[i] = 1 / (r * r * r);
  const lim = W - r - 0.3;
  px[i] = (Math.random() * 2 - 1) * lim + bx;
  pz[i] = (Math.random() * 2 - 1) * lim + bz;
  py[i] = H + 2.5 + Math.random();
  vx[i] = (Math.random() - 0.5) * 0.8;
  vz[i] = (Math.random() - 0.5) * 0.8;
  vy[i] = -1 - Math.random() * 2;
  col.setHSL(Math.random(), 0.75, 0.55);
  mesh.setColorAt(i, col);
  mesh.instanceColor.needsUpdate = true;
}

// Shake: box offset/velocity, recomputed every substep
let bx = 0, bz = 0, bvx = 0, bvz = 0, shaking = false;
function boxOffset(t) {
  const period = 7, dur = 1.6, ph = t % period;
  if (ph > dur) return [0, 0, false];
  const env = Math.sin(Math.PI * ph / dur) ** 2;
  const k = Math.floor(t / period);
  const a = 0.35 * env, w = 2 * Math.PI * 3.2 * ph;
  const ang = k * 1.3;
  const s = Math.sin(w) * a;
  return [Math.cos(ang) * s, Math.sin(ang) * s, true];
}

function step(h, t) {
  const [nbx, nbz, sh] = boxOffset(t);
  bvx = (nbx - bx) / h; bvz = (nbz - bz) / h;
  bx = nbx; bz = nbz; shaking = sh;

  for (let i = 0; i < n; i++) {
    vy[i] -= G * h;
    vx[i] *= 0.9995; vz[i] *= 0.9995;
    px[i] += vx[i] * h; py[i] += vy[i] * h; pz[i] += vz[i] * h;
  }

  // Sphere vs sphere (brute force is fine at this N)
  for (let i = 0; i < n; i++) {
    const ri = rad[i];
    for (let j = i + 1; j < n; j++) {
      const dx = px[j] - px[i], dy = py[j] - py[i], dz = pz[j] - pz[i];
      const rs = ri + rad[j];
      const d2 = dx * dx + dy * dy + dz * dz;
      if (d2 >= rs * rs || d2 < 1e-10) continue;
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, nz = dz / d;
      const wi = im[i], wj = im[j], ws = wi + wj;
      const pen = (rs - d) / ws * 0.8;
      px[i] -= nx * pen * wi; py[i] -= ny * pen * wi; pz[i] -= nz * pen * wi;
      px[j] += nx * pen * wj; py[j] += ny * pen * wj; pz[j] += nz * pen * wj;
      const rvx = vx[j] - vx[i], rvy = vy[j] - vy[i], rvz = vz[j] - vz[i];
      const vn = rvx * nx + rvy * ny + rvz * nz;
      if (vn >= 0) continue;
      const jn = -(1 + E_BALL) * vn / ws;
      let tx = rvx - vn * nx, ty = rvy - vn * ny, tz = rvz - vn * nz;
      const tl = Math.hypot(tx, ty, tz);
      let jt = 0;
      if (tl > 1e-6) { jt = Math.min(MU * jn, tl / ws) / tl; }
      const ix = jn * nx + jt * tx, iy = jn * ny + jt * ty, iz = jn * nz + jt * tz;
      vx[i] -= ix * wi; vy[i] -= iy * wi; vz[i] -= iz * wi;
      vx[j] += ix * wj; vy[j] += iy * wj; vz[j] += iz * wj;
    }
  }

  // Walls and floor, relative to the moving box
  for (let i = 0; i < n; i++) {
    const r = rad[i];
    if (py[i] < r) {
      py[i] = r;
      if (vy[i] < 0) vy[i] = -E_WALL * vy[i] * (vy[i] < -0.5 ? 1 : 0);
      const f = 1 - MU * 0.5;
      vx[i] = bvx + (vx[i] - bvx) * f;
      vz[i] = bvz + (vz[i] - bvz) * f;
    }
    if (py[i] < H + 4) {
      wall(i, px, vx, bx, bvx, r, vy, vz);
      wall(i, pz, vz, bz, bvz, r, vy, vx);
    }
  }
}

function wall(i, p, v, b, bv, r, t1, t2) {
  let hit = 0;
  if (p[i] - r < b - W) { p[i] = b - W + r; hit = 1; }
  else if (p[i] + r > b + W) { p[i] = b + W - r; hit = -1; }
  if (!hit) return;
  const rel = v[i] - bv;
  if (rel * hit < 0) v[i] = bv - E_WALL * rel;
  t1[i] *= 1 - MU * 0.3; t2[i] *= 1 - MU * 0.3;
}

const m4 = new THREE.Matrix4();
function sync() {
  for (let i = 0; i < n; i++) {
    const r = rad[i];
    m4.makeScale(r, r, r);
    m4.setPosition(px[i], py[i], pz[i]);
    mesh.setMatrixAt(i, m4);
  }
  mesh.count = n;
  mesh.instanceMatrix.needsUpdate = true;
  box.position.set(bx, 0, bz);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const hud = document.getElementById('hud');
const clock = new THREE.Clock();
let sim = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 30);
  spawnT += dt;
  while (spawnT > 0.07) {
    spawnT -= 0.07;
    if (n < MAX) spawn(n++);
    else { spawn(recycle); recycle = (recycle + 1) % MAX; }
  }
  const h = dt / SUB;
  for (let s = 0; s < SUB; s++) { sim += h; step(h, sim); }
  sync();

  const a = sim * 0.12;
  camera.position.set(Math.cos(a) * 14, 8 + Math.sin(sim * 0.2) * 1.2, Math.sin(a) * 14);
  camera.lookAt(0, 1.6, 0);
  hud.textContent = `spheres: ${n}${shaking ? '  ·  SHAKE' : ''}`;
  renderer.render(scene, camera);
});
</script>
</body>
</html>
