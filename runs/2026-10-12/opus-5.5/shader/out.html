<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SDF Raymarcher</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false, alpha: false });

const vs = `
attribute vec2 p;
void main(){ gl_Position = vec4(p, 0.0, 1.0); }
`;

const fs = `
precision highp float;
uniform vec2 R;
uniform float T;

float smin(float a, float b, float k){
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float blob(vec3 p){
  float t = T;
  vec3 c = vec3(0.0, 1.3, 0.0);
  float d = length(p - c) - 0.7;
  vec3 o1 = c + vec3(sin(t * 1.1) * 0.9, cos(t * 1.3) * 0.5, cos(t * 0.9) * 0.7);
  vec3 o2 = c + vec3(cos(t * 0.7) * 0.8, sin(t * 1.7) * 0.6, sin(t * 1.2) * 0.8);
  vec3 o3 = c + vec3(sin(t * 1.5 + 2.0) * 0.7, sin(t * 0.8) * 0.7, cos(t * 1.4 + 1.0) * 0.6);
  d = smin(d, length(p - o1) - 0.45, 0.5);
  d = smin(d, length(p - o2) - 0.40, 0.5);
  d = smin(d, length(p - o3) - 0.35, 0.5);
  float w = sin(p.x * 5.0 + t * 2.0) * sin(p.y * 4.0 - t * 1.5) * sin(p.z * 5.0 + t * 1.7);
  return d + w * 0.06;
}

float ground(vec3 p){
  vec2 q = mod(p.xz + 2.0, 4.0) - 2.0;
  float dome = length(vec3(q.x, p.y + 0.9, q.y)) - 1.05;
  return smin(p.y, dome, 0.4);
}

vec2 map(vec3 p){
  float b = blob(p);
  float g = ground(p);
  return b < g ? vec2(b, 1.0) : vec2(g, 0.0);
}

vec3 calcNormal(vec3 p){
  const vec2 e = vec2(1.0, -1.0) * 0.0015;
  return normalize(
    e.xyy * map(p + e.xyy).x +
    e.yyx * map(p + e.yyx).x +
    e.yxy * map(p + e.yxy).x +
    e.xxx * map(p + e.xxx).x);
}

float softShadow(vec3 ro, vec3 rd){
  float res = 1.0;
  float t = 0.02;
  for (int i = 0; i < 64; i++){
    float h = map(ro + rd * t).x;
    res = min(res, 10.0 * h / t);
    t += clamp(h, 0.02, 0.25);
    if (res < 0.001 || t > 12.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

float calcAO(vec3 p, vec3 n){
  float occ = 0.0;
  float sca = 1.0;
  for (int i = 0; i < 5; i++){
    float h = 0.02 + 0.12 * float(i);
    float d = map(p + n * h).x;
    occ += (h - d) * sca;
    sca *= 0.9;
  }
  return clamp(1.0 - 2.5 * occ, 0.0, 1.0);
}

void main(){
  vec2 uv = (gl_FragCoord.xy * 2.0 - R) / R.y;
  float t = T;

  vec3 ro = vec3(4.6 * cos(t * 0.21), 1.9 + 0.6 * sin(t * 0.33), 4.6 * sin(t * 0.21));
  ro.xz += vec2(sin(t * 0.13), cos(t * 0.17)) * 0.8;
  vec3 ta = vec3(0.0, 1.1, 0.0);
  vec3 ww = normalize(ta - ro);
  vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));
  vec3 vv = cross(uu, ww);
  vec3 rd = normalize(uv.x * uu + uv.y * vv + 1.7 * ww);

  vec3 sky = mix(vec3(0.05, 0.06, 0.12), vec3(0.35, 0.25, 0.45), pow(max(1.0 - rd.y, 0.0), 4.0));
  vec3 col = sky;

  float dist = 0.0;
  float mat = -1.0;
  float glow = 0.0;
  for (int i = 0; i < 140; i++){
    vec3 p = ro + rd * dist;
    vec2 h = map(p);
    glow += exp(-blob(p) * 6.0) * 0.012;
    if (h.x < 0.0008 * dist){ mat = h.y; break; }
    dist += h.x * 0.9;
    if (dist > 40.0) break;
  }

  vec3 lightDir = normalize(vec3(0.6, 0.8, 0.4));

  if (mat >= 0.0){
    vec3 p = ro + rd * dist;
    vec3 n = calcNormal(p);
    vec3 albedo;
    if (mat > 0.5){
      albedo = 0.5 + 0.5 * cos(vec3(0.0, 2.0, 4.0) + t * 0.5 + p.y * 1.5);
      albedo *= 0.8;
    } else {
      float chk = mod(floor(p.x) + floor(p.z), 2.0);
      albedo = mix(vec3(0.18, 0.19, 0.22), vec3(0.42, 0.40, 0.38), chk);
    }
    float dif = clamp(dot(n, lightDir), 0.0, 1.0);
    float sh = softShadow(p + n * 0.01, lightDir);
    float ao = calcAO(p, n);
    vec3 hal = normalize(lightDir - rd);
    float spe = pow(clamp(dot(n, hal), 0.0, 1.0), 48.0) * dif * sh;
    float amb = 0.5 + 0.5 * n.y;
    float fre = pow(clamp(1.0 + dot(n, rd), 0.0, 1.0), 3.0);

    col = albedo * (1.6 * dif * sh * vec3(1.0, 0.92, 0.8) + 0.35 * amb * ao * vec3(0.5, 0.6, 0.9));
    col += spe * vec3(1.0) * (mat > 0.5 ? 1.2 : 0.3);
    vec3 glowCol = 0.5 + 0.5 * cos(vec3(4.0, 2.0, 0.0) + t * 0.7);
    col += fre * ao * (mat > 0.5 ? glowCol * 1.4 : vec3(0.15, 0.15, 0.25));
    col *= mix(1.0, ao, 0.6);

    float fog = 1.0 - exp(-0.0025 * dist * dist);
    col = mix(col, sky, fog);
  }

  col += glow * (0.5 + 0.5 * cos(vec3(4.0, 2.0, 0.0) + t * 0.7)) * 0.6;

  col = col / (1.0 + col);
  col = pow(col, vec3(0.4545));
  col *= 1.0 - 0.25 * dot(uv * 0.5, uv * 0.5);
  gl_FragColor = vec4(col, 1.0);
}
`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const uR = gl.getUniformLocation(prog, 'R');
const uT = gl.getUniformLocation(prog, 'T');

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const w = Math.floor(window.innerWidth * dpr);
  const h = Math.floor(window.innerHeight * dpr);
  if (canvas.width !== w || canvas.height !== h){
    canvas.width = w;
    canvas.height = h;
  }
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

const start = performance.now();
function frame(){
  gl.uniform2f(uR, canvas.width, canvas.height);
  gl.uniform1f(uT, (performance.now() - start) / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
