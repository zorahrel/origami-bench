<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Clockwork</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0a0c10}canvas{display:block}</style>
</head><body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const R = new THREE.WebGLRenderer({ antialias: true });
R.setPixelRatio(Math.min(devicePixelRatio, 2));
R.setSize(innerWidth, innerHeight);
R.toneMapping = THREE.ACESFilmicToneMapping;
R.toneMappingExposure = 1.05;
R.shadowMap.enabled = true;
R.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(R.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c10);
scene.fog = new THREE.Fog(0x0a0c10, 20, 42);
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);

// finto ambiente: sfera a gradiente + pannelli luminosi, filtrata con PMREM (core)
const env = new THREE.Scene();
const sg = new THREE.SphereGeometry(20, 32, 16);
const sp = sg.attributes.position, cols = [];
for (let i = 0; i < sp.count; i++) {
  const y = sp.getY(i) / 20;
  const c = new THREE.Color().setHSL(0.08, 0.35, 0.03 + 0.3 * Math.max(0, y) ** 1.5);
  cols.push(c.r, c.g, c.b);
}
sg.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
env.add(new THREE.Mesh(sg, new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true })));
[[0, 14, 6, 12, 4, 0xfff0d8, 6], [-14, 3, 6, 4, 10, 0xbfd8ff, 3], [14, 2, 4, 3, 8, 0xffd0a0, 3], [0, -4, 15, 10, 3, 0xffffff, 1.5]].forEach(([x, y, z, w, h, c, k]) => {
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), side: THREE.DoubleSide }));
  p.position.set(x, y, z); p.lookAt(0, 0, 0); env.add(p);
});
const pm = new THREE.PMREMGenerator(R);
scene.environment = pm.fromScene(env, 0.035).texture;

// luci
scene.add(new THREE.HemisphereLight(0xffe8c8, 0x101418, 0.35));
const key = new THREE.DirectionalLight(0xfff0dd, 2.2);
key.position.set(6, 9, 12); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 40 });
key.shadow.bias = -0.0005;
scene.add(key);
const rim = new THREE.PointLight(0x6fa8ff, 40, 30); rim.position.set(-8, 4, 4); scene.add(rim);
const warm = new THREE.PointLight(0xffa860, 30, 25); scene.add(warm);

const mats = {
  brass: new THREE.MeshStandardMaterial({ color: 0xd4a84f, metalness: 1, roughness: 0.27 }),
  steel: new THREE.MeshStandardMaterial({ color: 0xc4c8d0, metalness: 1, roughness: 0.22 }),
  copper: new THREE.MeshStandardMaterial({ color: 0xc27a4a, metalness: 1, roughness: 0.3 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x2a2620, metalness: 0.7, roughness: 0.55 }),
};

// backplate
const plate = new THREE.Mesh(new THREE.BoxGeometry(16, 13, 0.25), mats.dark);
plate.position.set(0, 0.5, -1.6); plate.receiveShadow = true; scene.add(plate);
for (let i = 0; i < 4; i++) {
  const s = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.3, 24), mats.brass);
  s.rotation.x = Math.PI / 2; s.position.set(i % 2 ? 7.3 : -7.3, i < 2 ? 6.4 : -5.4, -1.4); scene.add(s);
}

const M = 0.12; // modulo comune: le coppie che ingranano devono condividerlo
function gearGeo(N, th) {
  const r = M * N / 2, ra = r + M, rr = r - 1.25 * M, p = Math.PI * 2 / N;
  const sh = new THREE.Shape();
  for (let i = 0; i < N; i++) {
    const a = i * p;
    const pts = [[rr, a - 0.5 * p], [rr, a - 0.26 * p], [ra, a - 0.13 * p], [ra, a + 0.13 * p], [rr, a + 0.26 * p]];
    pts.forEach(([rad, an], j) => {
      const x = Math.cos(an) * rad, y = Math.sin(an) * rad;
      (i === 0 && j === 0) ? sh.moveTo(x, y) : sh.lineTo(x, y);
    });
  }
  sh.closePath();
  const hole = new THREE.Path(); hole.absarc(0, 0, 0.08, 0, Math.PI * 2, true); sh.holes.push(hole);
  if (rr > 0.8) {
    const k = N > 30 ? 6 : 5, hr = rr * 0.22, hd = rr * 0.56;
    for (let i = 0; i < k; i++) {
      const h = new THREE.Path(), a = i * Math.PI * 2 / k;
      h.absarc(Math.cos(a) * hd, Math.sin(a) * hd, hr, 0, Math.PI * 2, true);
      sh.holes.push(h);
    }
  }
  const g = new THREE.ExtrudeGeometry(sh, { depth: th, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.015, bevelSegments: 2, curveSegments: 20 });
  g.translate(0, 0, -th / 2);
  return g;
}

// mesh: ingrana col genitore in direzione th · axle: stesso albero, strato diverso
const defs = [
  { N: 40, z: 0, m: 'brass' },
  { N: 12, z: 0, mesh: 0, th: 0.35, m: 'steel' },
  { N: 36, z: 0.5, axle: 1, m: 'copper' },
  { N: 14, z: 0.5, mesh: 2, th: 2.6, m: 'steel' },
  { N: 30, z: 1.0, axle: 3, m: 'brass' },
  { N: 18, z: 1.0, mesh: 4, th: -0.6, m: 'steel' },
  { N: 24, z: 0, mesh: 0, th: 3.6, m: 'copper' },
  { N: 32, z: -0.5, axle: 6, m: 'brass' },
  { N: 16, z: -0.5, mesh: 7, th: 1.9, m: 'steel' },
  { N: 22, z: -0.5, mesh: 8, th: 0.9, m: 'copper' },
];
const gears = [];
defs.forEach((d) => {
  let x = 0, y = 0, k = 1, c = 0;
  if (d.axle !== undefined) {
    const P = gears[d.axle]; x = P.x; y = P.y; k = P.k; c = P.c;
  } else if (d.mesh !== undefined) {
    const P = gears[d.mesh], dist = M * (P.N + d.N) / 2, q = P.N / d.N;
    x = P.x + Math.cos(d.th) * dist; y = P.y + Math.sin(d.th) * dist;
    // dente del genitore sulla linea dei centri <-> vano del figlio di fronte
    const C = d.th + Math.PI - Math.PI / d.N + q * d.th;
    k = -q * P.k; c = -q * P.c + C;
  }
  const th = 0.28;
  const mesh = new THREE.Mesh(gearGeo(d.N, th), mats[d.m]);
  mesh.position.set(x, y, d.z); mesh.castShadow = mesh.receiveShadow = true;
  scene.add(mesh);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, th + 0.12, 24), mats.steel);
  hub.rotation.x = Math.PI / 2; hub.position.set(x, y, d.z); hub.castShadow = true; scene.add(hub);
  const ax = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, d.z + 1.75, 16), mats.steel);
  ax.rotation.x = Math.PI / 2; ax.position.set(x, y, (d.z + 0.3 - 1.45) / 2 + 0.0); ax.castShadow = true; scene.add(ax);
  gears.push({ N: d.N, x, y, k, c, mesh });
});

// pendolo
const pend = new THREE.Group(); pend.position.set(0.4, 5.9, -1.1); scene.add(pend);
const rod = new THREE.Mesh(new THREE.BoxGeometry(0.07, 7.2, 0.05), mats.steel);
rod.position.y = -3.6; rod.castShadow = true; pend.add(rod);
const bob = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 0.18, 48), mats.brass);
bob.rotation.x = Math.PI / 2; bob.position.y = -7.2; bob.castShadow = true; pend.add(bob);
const anchor = new THREE.Mesh(new THREE.TorusGeometry(0.9, 0.06, 8, 32, Math.PI * 0.7), mats.steel);
anchor.rotation.z = Math.PI * 1.15; pend.add(anchor);
const piv = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.5, 20), mats.brass);
piv.rotation.x = Math.PI / 2; pend.add(piv);

// quadrante dei secondi davanti a G6
const G6 = gears[6];
const dial = new THREE.Group(); dial.position.set(G6.x, G6.y, 0.75); scene.add(dial);
const cream = new THREE.MeshStandardMaterial({ color: 0xeee4cc, metalness: 0.2, roughness: 0.4 });
dial.add(new THREE.Mesh(new THREE.RingGeometry(1.15, 1.42, 64), cream));
for (let i = 0; i < 60; i++) {
  const big = i % 5 === 0;
  const t = new THREE.Mesh(new THREE.BoxGeometry(big ? 0.05 : 0.025, big ? 0.17 : 0.09, 0.02), mats.dark);
  const a = i * Math.PI / 30, r = 1.32 - (big ? 0.04 : 0);
  t.position.set(Math.sin(a) * r, Math.cos(a) * r, 0.01); t.rotation.z = -a; dial.add(t);
}
const hand = new THREE.Group(); hand.position.z = 0.06; dial.add(hand);
const hm = new THREE.MeshStandardMaterial({ color: 0xb02020, metalness: 0.6, roughness: 0.3 });
const hb = new THREE.Mesh(new THREE.BoxGeometry(0.04, 1.55, 0.03), hm); hb.position.y = 0.5; hb.castShadow = true; hand.add(hb);
const hc = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.08, 20), hm); hc.rotation.x = Math.PI / 2; hand.add(hc);

// tic: scatto rapido con piccolo rimbalzo
function ease(f) {
  return f < 0.1 ? (f / 0.1) ** 2 : 1 + 0.06 * Math.sin((f - 0.1) * 32) * Math.exp(-(f - 0.1) * 11);
}

const clock = new THREE.Clock();
function frame() {
  const t = clock.getElapsedTime();
  const tick = Math.floor(t) + ease(t - Math.floor(t));
  const A = tick * (Math.PI * 2 / 40);
  for (const g of gears) g.mesh.rotation.z = g.k * A + g.c;
  hand.rotation.z = -tick * Math.PI / 30;
  pend.rotation.z = 0.2 * Math.cos(Math.PI * t);
  warm.position.set(Math.cos(t * 0.3) * 7, 3 + Math.sin(t * 0.4) * 2, 6);
  cam.position.set(Math.sin(t * 0.09) * 3.5, 0.8 + Math.sin(t * 0.07) * 1.6, 15 + Math.sin(t * 0.05) * 1.2);
  cam.lookAt(0, 0.6, 0);
  R.render(scene, cam);
  requestAnimationFrame(frame);
}
frame();

addEventListener('resize', () => {
  cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
  R.setSize(innerWidth, innerHeight);
});
</script>
</body></html>
