<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Walking Humanoid</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f1a}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const fogColor = new THREE.Color(0x141a2b);
scene.background = fogColor;
scene.fog = new THREE.Fog(fogColor, 6, 22);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);

// Luci
scene.add(new THREE.HemisphereLight(0x9fb4ff, 0x2a2018, 0.45));
const sun = new THREE.DirectionalLight(0xfff1dd, 2.2);
sun.position.set(4, 8, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -4; sun.shadow.camera.right = 4;
sun.shadow.camera.top = 4; sun.shadow.camera.bottom = -4;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 20;
sun.shadow.radius = 6;
sun.shadow.bias = -0.0005;
scene.add(sun);

const point = new THREE.PointLight(0xff3fa0, 6, 8, 1.5);
point.castShadow = true;
point.shadow.mapSize.set(512, 512);
scene.add(point);
const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 8), new THREE.MeshBasicMaterial({ color: 0xff7fc0 }));
point.add(bulb);

// Pavimento a scacchi da canvas
const cv = document.createElement('canvas');
cv.width = cv.height = 256;
const cx = cv.getContext('2d');
for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
  cx.fillStyle = (i + j) % 2 ? '#d8d8dc' : '#3a3f4f';
  cx.fillRect(i * 32, j * 32, 32, 32);
}
const tex = new THREE.CanvasTexture(cv);
tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
tex.repeat.set(10, 10);
tex.colorSpace = THREE.SRGBColorSpace;
tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8, metalness: 0.05 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Materiali
const skin = new THREE.MeshStandardMaterial({ color: 0xe0b48f, roughness: 0.6 });
const shirt = new THREE.MeshStandardMaterial({ color: 0x2f7dd1, roughness: 0.55 });
const pants = new THREE.MeshStandardMaterial({ color: 0x2b2f3a, roughness: 0.7 });
const shoe = new THREE.MeshStandardMaterial({ color: 0x8a2f1f, roughness: 0.4 });
const dark = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3 });

function mesh(geo, mat) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// Segmento appeso: il pivot è il giunto, la geometria pende lungo -Y
function limb(len, r, mat) {
  const pivot = new THREE.Group();
  const m = mesh(new THREE.CapsuleGeometry(r, Math.max(len - 2 * r, 0.01), 6, 12), mat);
  m.position.y = -len / 2;
  pivot.add(m);
  return pivot;
}

// Gerarchia
const body = new THREE.Group();
scene.add(body);

const hips = new THREE.Group();
hips.position.y = 1.0;
body.add(hips);
const pelvis = mesh(new THREE.BoxGeometry(0.34, 0.16, 0.2), pants);
hips.add(pelvis);

const torso = new THREE.Group();
torso.position.y = 0.06;
hips.add(torso);
const belly = mesh(new THREE.CapsuleGeometry(0.15, 0.18, 6, 12), shirt);
belly.position.y = 0.14; belly.scale.set(1.05, 1, 0.75);
torso.add(belly);
const chest = mesh(new THREE.CapsuleGeometry(0.18, 0.12, 6, 12), shirt);
chest.position.y = 0.38; chest.scale.set(1.15, 1, 0.75);
torso.add(chest);

const neck = new THREE.Group();
neck.position.y = 0.56;
torso.add(neck);
neck.add(mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.1, 12), skin));
const head = new THREE.Group();
head.position.y = 0.17;
neck.add(head);
const skull = mesh(new THREE.SphereGeometry(0.13, 24, 16), skin);
skull.scale.set(0.95, 1.1, 1);
head.add(skull);
for (const s of [-1, 1]) {
  const eye = mesh(new THREE.SphereGeometry(0.018, 10, 8), dark);
  eye.position.set(s * 0.045, 0.02, 0.12);
  head.add(eye);
}
const nose = mesh(new THREE.ConeGeometry(0.02, 0.05, 8), skin);
nose.rotation.x = Math.PI / 2; nose.position.set(0, -0.01, 0.14);
head.add(nose);
const hair = mesh(new THREE.SphereGeometry(0.135, 24, 12, 0, Math.PI * 2, 0, Math.PI * 0.5), dark);
hair.position.y = 0.025; hair.scale.set(0.97, 1.1, 1.03); hair.rotation.x = -0.25;
head.add(hair);

function makeArm(side) {
  const shoulder = limb(0.3, 0.055, shirt);
  shoulder.position.set(side * 0.25, 0.48, 0);
  torso.add(shoulder);
  const elbow = limb(0.27, 0.045, skin);
  elbow.position.y = -0.3;
  shoulder.add(elbow);
  const hand = mesh(new THREE.BoxGeometry(0.07, 0.1, 0.04), skin);
  hand.position.y = -0.31;
  elbow.add(hand);
  return { shoulder, elbow };
}
function makeLeg(side) {
  const hip = limb(0.44, 0.075, pants);
  hip.position.set(side * 0.1, -0.03, 0);
  hips.add(hip);
  const knee = limb(0.44, 0.06, pants);
  knee.position.y = -0.44;
  hip.add(knee);
  const ankle = new THREE.Group();
  ankle.position.y = -0.44;
  knee.add(ankle);
  const foot = mesh(new THREE.BoxGeometry(0.11, 0.07, 0.26), shoe);
  foot.position.set(0, -0.035, 0.05);
  ankle.add(foot);
  return { hip, knee, ankle };
}
const armL = makeArm(1), armR = makeArm(-1);
const legL = makeLeg(1), legR = makeLeg(-1);

// Ciclo del passo: il personaggio guarda +Z, rotazione X negativa porta l'arto avanti
function legPose(leg, p) {
  const swing = Math.sin(p);                 // >0 = gamba avanti
  const inSwing = Math.max(0, Math.cos(p));  // fase aerea: la gamba sta avanzando
  leg.hip.rotation.x = -swing * 0.45 - inSwing * 0.25;
  leg.knee.rotation.x = 0.08 + inSwing * inSwing * 1.0;
  leg.ankle.rotation.x = -(leg.hip.rotation.x + leg.knee.rotation.x) * 0.85 + swing * 0.15;
}
function armPose(arm, p, side) {
  const swing = Math.sin(p);                 // >0 = braccio indietro
  arm.shoulder.rotation.x = swing * 0.5;
  arm.shoulder.rotation.z = side * 0.08;
  arm.elbow.rotation.x = -0.25 - Math.max(0, -swing) * 0.55;
}

const clock = new THREE.Clock();
const freq = 5.2; // rad/s, circa una falcata al secondo

function animate() {
  const t = clock.getElapsedTime();
  const p = t * freq;

  legPose(legL, p);
  legPose(legR, p + Math.PI);
  armPose(armL, p, 1);
  armPose(armR, p + Math.PI, -1);

  // Rimbalzo: più alto a metà appoggio, quando le gambe sono verticali
  hips.position.y = 0.985 + Math.cos(2 * p) * 0.025;
  hips.rotation.y = -Math.sin(p) * 0.1;
  hips.rotation.z = Math.sin(p) * 0.03;
  torso.rotation.y = Math.sin(p) * 0.2;
  torso.rotation.x = 0.04 + Math.cos(2 * p) * 0.015;
  torso.rotation.z = -Math.sin(p) * 0.025;
  neck.rotation.y = -torso.rotation.y * 0.6 - hips.rotation.y * 0.5;
  head.rotation.x = -0.04 - Math.cos(2 * p) * 0.02;

  // Camera in orbita lenta
  const a = t * 0.25;
  const r = 4.6 + Math.sin(t * 0.17) * 0.8;
  camera.position.set(Math.sin(a) * r, 1.6 + Math.sin(t * 0.3) * 0.5, Math.cos(a) * r);
  camera.lookAt(0, 1.0, 0);

  // Luce colorata che gira attorno
  const b = -t * 0.7;
  point.position.set(Math.cos(b) * 1.8, 1.4 + Math.sin(t * 1.3) * 0.4, Math.sin(b) * 1.8);
  point.color.setHSL((t * 0.05) % 1, 0.9, 0.55);
  bulb.material.color.copy(point.color);

  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
