<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clockwork</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#07090d}
  canvas{display:block}
  #label{position:fixed;left:22px;bottom:18px;pointer-events:none;user-select:none;
    font-family:Georgia,'Times New Roman',serif;color:#d8c58f;letter-spacing:.35em;
    font-size:13px;text-transform:uppercase;opacity:.85;text-shadow:0 1px 8px #000}
  #label small{display:block;letter-spacing:.22em;font-size:9px;color:#8f96a8;margin-top:5px}
</style>
</head>
<body>
<div id="label">Clockwork<small>eleven gears &middot; escapement &middot; pendulum</small></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07090d);
const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 100);
let baseDist = 12.5;

/* ---- fake studio environment (canvas equirect -> PMREM) ---- */
{
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0,0,0,512);
  grad.addColorStop(0,'#3a4666'); grad.addColorStop(0.45,'#141926'); grad.addColorStop(1,'#05070a');
  g.fillStyle = grad; g.fillRect(0,0,1024,512);
  const box = (x,y,w,h,col)=>{ g.fillStyle = col; g.fillRect(x,y,w,h); };
  box(80,60,220,130,'#ffffff');  box(430,40,140,200,'#ffe2b0');
  box(700,80,260,90,'#bcd2ff');  box(200,300,500,26,'#ff9a3c');
  box(760,320,180,60,'#7fa8ff'); box(40,330,120,50,'#ffd9a0');
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(tex).texture;
  tex.dispose(); pmrem.dispose();
}

/* ---- lights ---- */
scene.add(new THREE.HemisphereLight(0x9db4ff, 0x2a1c0d, 0.55));
scene.add(new THREE.AmbientLight(0x223044, 0.5));
const key = new THREE.DirectionalLight(0xffe6b8, 2.4); key.position.set(5,8,6); scene.add(key);
const rim = new THREE.DirectionalLight(0x6fa8ff, 1.4); rim.position.set(-6,3,-5); scene.add(rim);
const warm = new THREE.PointLight(0xff9a3c, 60, 40, 2); warm.position.set(-4,-3,4); scene.add(warm);
const cool = new THREE.PointLight(0x7fb2ff, 40, 40, 2); cool.position.set(5,4,3); scene.add(cool);

/* ---- materials ---- */
function metal(color, rough){ return new THREE.MeshStandardMaterial({ color, metalness:0.92, roughness:rough, envMapIntensity:1.15 }); }
const mats = [
  metal(0xc9a44a, 0.30), metal(0xb8bcc4, 0.24), metal(0xb87333, 0.34),
  metal(0x8c6a3f, 0.40), metal(0x6e7684, 0.30), metal(0xd8b25e, 0.26)
];
const darkMetal = metal(0x3a3f4a, 0.5);
const frameMat  = metal(0x4a3b28, 0.55);

/* ---- procedural gear geometry (tooth 0 centred on angle 0) ---- */
const MODULE = 0.13;
function gearGeometry(N){
  const r = MODULE*N/2;                 // pitch radius
  const rTip = r + MODULE*0.9, rRoot = r - MODULE*1.05;
  const p = Math.PI*2/N, s = new THREE.Shape();
  for(let i=0;i<N;i++){
    const c = i*p;
    const pts = [[rRoot,c-0.32*p],[rTip,c-0.15*p],[rTip,c+0.15*p],[rRoot,c+0.32*p]];
    for(const [rr,a] of pts){
      const x = Math.cos(a)*rr, y = Math.sin(a)*rr;
      if(i===0 && a===pts[0][1]) s.moveTo(x,y); else s.lineTo(x,y);
    }
  }
  s.closePath();
  const hub = new THREE.Path(); hub.absarc(0,0,0.15,0,Math.PI*2,true); s.holes.push(hub);
  if(r > 1.12){                          // lightening holes on large wheels
    for(let i=0;i<5;i++){
      const a = i/5*Math.PI*2, h = new THREE.Path();
      h.absarc(Math.cos(a)*rRoot*0.55, Math.sin(a)*rRoot*0.55, rRoot*0.20, 0, Math.PI*2, true);
      s.holes.push(h);
    }
  }
  const geo = new THREE.ExtrudeGeometry(s, { depth:0.32, bevelEnabled:true, bevelThickness:0.02,
    bevelSize:0.015, bevelSegments:1, curveSegments:28 });
  geo.translate(0,0,-0.16);
  return geo;
}

/* ---- gear train: mesh graph with exact ratios & tooth phasing ---- */
/* spec: N teeth, parent index, mesh angle (deg) OR coax z-layer        */
const specs = [
  { N:28, p:-1, x:-3.0, y:-1.5, z:0    },   // root wheel
  { N:17, p:0,  phi:  30 },
  { N:22, p:1,  phi:  80 },
  { N:13, p:2,  coax: 0.65 },               // front pinion on gear 2's axle
  { N:26, p:3,  phi: -10 },
  { N:15, p:4,  phi: -60 },
  { N:20, p:5,  coax: 0    },               // back to main layer on gear 5's axle
  { N:12, p:6,  phi:-120 },
  { N:24, p:7,  phi:-155 },
  { N:14, p:0,  coax:-0.65 },               // rear pinion on root axle
  { N:18, p:9,  phi: 120 }
];
const OX = 0.4, OY = 0.6;                    // centre the layout
const hubGeo  = new THREE.CylinderGeometry(0.20,0.20,0.55,24); hubGeo.rotateX(Math.PI/2);
const boltGeo = new THREE.CylinderGeometry(0.11,0.11,0.12,6);  boltGeo.rotateX(Math.PI/2);
const machine = new THREE.Group(); scene.add(machine);
const gears = [];

specs.forEach((sp,i)=>{
  const r = MODULE*sp.N/2;
  let x,y,z,k,c;
  if(sp.p < 0){ x=sp.x; y=sp.y; z=sp.z; k=1; c=0; }
  else{
    const par = gears[sp.p];
    if(sp.coax !== undefined){            // rigidly fixed to parent's axle
      x=par.x; y=par.y; z=sp.coax; k=par.k; c=par.c;
    }else{                                // meshing neighbour
      const phi = sp.phi*Math.PI/180, d = r + par.r;
      x = par.x + Math.cos(phi)*d; y = par.y + Math.sin(phi)*d; z = par.z;
      const ratio = par.N/sp.N;           // omegaChild = -ratio * omegaParent
      k = -ratio*par.k;
      c = -ratio*par.c + phi*(1+ratio) + Math.PI + Math.PI/sp.N;  // tooth-into-gap phase
    }
  }
  const grp = new THREE.Group();
  grp.position.set(x+OX, y+OY, z);
  grp.add(new THREE.Mesh(gearGeometry(sp.N), mats[i % mats.length]));
  const hub = new THREE.Mesh(hubGeo, darkMetal); grp.add(hub);
  const bolt = new THREE.Mesh(boltGeo, mats[(i+3) % mats.length]); bolt.position.z = 0.30; grp.add(bolt);
  machine.add(grp);
  gears.push({ N:sp.N, r, x, y, z, k, c, grp });
});

/* ---- frame ---- */
{
  const mk = (w,h,x,y)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,0.25), frameMat);
    m.position.set(x,y,-1.25); machine.add(m); };
  mk(11,0.35,0, 3.95); mk(11,0.35,0,-3.95); mk(0.35,8.25,-5.4,0); mk(0.35,8.25,5.4,0);
  const screwGeo = new THREE.CylinderGeometry(0.09,0.09,0.1,6); screwGeo.rotateX(Math.PI/2);
  for(const [x,y] of [[-5.4,3.95],[5.4,3.95],[-5.4,-3.95],[5.4,-3.95]]){
    const sc = new THREE.Mesh(screwGeo, darkMetal); sc.position.set(x,y,-1.1); machine.add(sc);
  }
}

/* ---- pendulum (2 s period, behind the wheels) ---- */
const pendulum = new THREE.Group();
pendulum.position.set(0.2, 3.75, -0.95);
{
  const L = 6.2;
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,L,10), darkMetal);
  rod.position.y = -L/2; pendulum.add(rod);
  const bobGeo = new THREE.CylinderGeometry(0.66,0.66,0.16,44); bobGeo.rotateX(Math.PI/2);
  const bob = new THREE.Mesh(bobGeo, metal(0xd8b25e,0.22)); bob.position.y = -L; pendulum.add(bob);
  const rimT = new THREE.Mesh(new THREE.TorusGeometry(0.66,0.045,12,44), metal(0x8c6a3f,0.35));
  rimT.position.y = -L; pendulum.add(rimT);
  const anchor = new THREE.Mesh(new THREE.TorusGeometry(0.5,0.055,10,28,Math.PI), darkMetal);
  anchor.rotation.z = Math.PI; anchor.position.y = 0.05; pendulum.add(anchor);
}
machine.add(pendulum);

/* ---- dial with ticking second hand ---- */
const dial = new THREE.Group(); dial.position.set(-3.55, 2.85, 1.15); machine.add(dial);
let secHand, minHand, hrHand;
{
  const face = new THREE.Mesh(new THREE.CircleGeometry(0.95,48),
    new THREE.MeshStandardMaterial({ color:0x161a22, metalness:0.4, roughness:0.6, envMapIntensity:0.6 }));
  dial.add(face);
  dial.add(new THREE.Mesh(new THREE.TorusGeometry(0.95,0.07,14,64), metal(0xc9a44a,0.28)));
  const markGeo = new THREE.BoxGeometry(0.045,0.17,0.02);
  const markMat = metal(0xd8c58f,0.35);
  for(let i=0;i<12;i++){
    const a = i/12*Math.PI*2, m = new THREE.Mesh(markGeo, markMat);
    m.position.set(Math.sin(a)*0.78, Math.cos(a)*0.78, 0.02); m.rotation.z = -a; dial.add(m);
  }
  function hand(len,w,mat,z,tail){
    const g = new THREE.Group(); g.position.z = z;
    const geo = new THREE.BoxGeometry(w,len+tail,0.025); geo.translate(0,(len-tail)/2,0);
    g.add(new THREE.Mesh(geo, mat)); dial.add(g); return g;
  }
  hrHand  = hand(0.45,0.085,metal(0xd8c58f,0.3),0.06,0.10);
  minHand = hand(0.68,0.060,metal(0xd8c58f,0.3),0.10,0.12);
  secHand = hand(0.80,0.028,new THREE.MeshStandardMaterial({ color:0xc23b2a, metalness:0.6, roughness:0.4 }),0.14,0.22);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.075,20,14), metal(0xc9a44a,0.25));
  cap.position.z = 0.16; dial.add(cap);
  hrHand.rotation.z = -2.1; minHand.rotation.z = -0.9;
}

/* ---- drifting dust for depth ---- */
let dust;
{
  const n=350, pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){ pos[i*3]=(Math.random()-0.5)*18; pos[i*3+1]=(Math.random()-0.5)*12; pos[i*3+2]=-3-Math.random()*6; }
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  dust = new THREE.Points(g, new THREE.PointsMaterial({ color:0x8fa3cc, size:0.045, transparent:true, opacity:0.55 }));
  scene.add(dust);
}

/* ---- animation ---- */
const easeOutBack = x => { const s=1.9; return 1 + (s+1)*Math.pow(x-1,3) + s*Math.pow(x-1,2); };
const clock = new THREE.Clock();

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  baseDist = camera.aspect < 1.2 ? Math.min(24, 12.5*Math.pow(1.2/camera.aspect,0.8)) : 12.5;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize); onResize();

renderer.setAnimationLoop(()=>{
  const t = clock.getElapsedTime();
  const T = t*0.55;                                   // master angle
  for(const g of gears) g.grp.rotation.z = g.k*T + g.c;

  pendulum.rotation.z = 0.38*Math.sin(Math.PI*t);     // 2 s period

  const whole = Math.floor(t), frac = t-whole;        // tick each second
  const step = easeOutBack(Math.min(frac/0.16, 1));
  secHand.rotation.z = -(whole+step)*Math.PI/30;
  minHand.rotation.z = -0.9 - t*Math.PI/1800;
  hrHand.rotation.z  = -2.1 - t*Math.PI/21600;

  dust.rotation.z = t*0.005;
  machine.rotation.y = Math.sin(t*0.10)*0.045;
  machine.rotation.x = Math.sin(t*0.07+1.3)*0.02;

  camera.position.set(Math.sin(t*0.13)*0.85, 0.35+Math.sin(t*0.09)*0.45, baseDist + Math.sin(t*0.06)*0.55);
  camera.lookAt(0,0,0);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
