<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clockwork</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0b0e13}canvas{display:block;width:100vw;height:100vh}#h{position:fixed;left:12px;bottom:10px;color:#9fb3c8;font:12px/1.4 monospace;opacity:.7;pointer-events:none}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head>
<body>
<div id="h">procedural clockwork · 8 gears · pendulum · tick</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b0e13);
scene.fog=new THREE.Fog(0x0b0e13,10,24);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,100);
const camBase=new THREE.Vector3(0,0.4,9.2);
camera.position.copy(camBase);
camera.lookAt(0,0,0.3);
scene.add(new THREE.AmbientLight(0x8899bb,0.55));
const key=new THREE.DirectionalLight(0xffffff,2.4);key.position.set(5,7,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x88aaff,0.7);fill.position.set(-6,2,5);scene.add(fill);
const rim=new THREE.PointLight(0xffaa55,60,30);rim.position.set(-4,-3,3);scene.add(rim);
const top=new THREE.PointLight(0x66ccff,50,30);top.position.set(4,5,-2);scene.add(top);
const front=new THREE.PointLight(0xfff2dd,30,20);front.position.set(0,0,6);scene.add(front);
const MOD=0.09,TH=0.28;
const teeth=[12,20,14,28,12,24,16,36];
const N=teeth.length;
const R=teeth.map(n=>n*MOD/2);
const Z=[0,0,0,0,0.75,0.75,0.75,0.75];
const coax={4:3};
const par=[-1,0,1,2,-1,4,5,6];
const pos=[{x:0,y:0}];
for(let i=1;i<N;i++){
 if(coax[i]!=null){pos.push({x:pos[coax[i]].x,y:pos[coax[i]].y});continue;}
 const p=par[i],D=R[i]+R[p]+0.015;
 let best=null;
 for(let a=0;a<Math.PI*2;a+=0.18){
  const cx=pos[p].x+Math.cos(a)*D,cy=pos[p].y+Math.sin(a)*D;
  let ok=true;
  for(let j=0;j<i;j++){
   if(j===p)continue;
   if(coax[i]!=null&&coax[i]===j)continue;
   if(coax[j]!=null&&coax[i]!=null&&coax[j]===coax[i])continue;
   if(Math.abs(Z[i]-Z[j])>0.4)continue;
   const dx=cx-pos[j].x,dy=cy-pos[j].y,d=Math.hypot(dx,dy);
   if(d<R[i]+R[j]+0.12){ok=false;break;}
  }
  if(ok){best={x:cx,y:cy};break;}
 }
 if(!best){const a=i*2.4;best={x:pos[p].x+Math.cos(a)*D,y:pos[p].y+Math.sin(a)*D};}
 pos.push(best);
}
function gearGeo(n){
 const pitch=n*MOD/2,ro=pitch+MOD,rr=Math.max(0.05,pitch-1.25*MOD);
 const s=new THREE.Shape(),P=Math.PI*2/n;let first=true;
 const add=(r,a)=>{const x=Math.cos(a)*r,y=Math.sin(a)*r;if(first){s.moveTo(x,y);first=false;}else s.lineTo(x,y);};
 for(let i=0;i<n;i++){const a=i*P;add(rr,a);add(rr,a+P*0.25);add(ro,a+P*0.33);add(ro,a+P*0.58);add(rr,a+P*0.66);}
 s.closePath();
 const c=new THREE.Path();c.absarc(0,0,0.11,0,Math.PI*2,true);s.holes.push(c);
 if(pitch>0.6){const nh=4,hr=Math.min(0.2,pitch*0.2),cr=pitch*0.55;for(let k=0;k<nh;k++){const an=k/nh*Math.PI*2;const h=new THREE.Path();h.absarc(Math.cos(an)*cr,Math.sin(an)*cr,hr,0,Math.PI*2,true);s.holes.push(h);}}
 const g=new THREE.ExtrudeGeometry(s,{depth:TH,bevelEnabled:true,bevelThickness:0.02,bevelSize:0.02,bevelSegments:1,curveSegments:7});
 g.translate(0,0,-TH/2);return g;
}
const palette=[0xd8b25a,0xb9c2cc,0xc47b3a,0x9aa4b0,0xe0c06a,0x8f9aa6,0xcf9a4a,0xaab4c0];
const groups=[],W=new Array(N),PH=new Array(N);
W[0]=0.55;PH[0]=0;
for(let i=1;i<N;i++){
 if(coax[i]!=null){W[i]=W[coax[i]];PH[i]=PH[coax[i]];}
 else{const p=par[i];W[i]=-W[p]*teeth[p]/teeth[i];
  const al=Math.atan2(pos[i].y-pos[p].y,pos[i].x-pos[p].x);
  PH[i]=al+Math.PI-Math.PI/teeth[i]+(teeth[p]/teeth[i])*(al-PH[p]);}
}
const shaftMat=new THREE.MeshStandardMaterial({color:0x5a6068,metalness:0.95,roughness:0.3});
const darkMat=new THREE.MeshStandardMaterial({color:0x2a2e34,metalness:0.8,roughness:0.5});
for(let i=0;i<N;i++){
 const mat=new THREE.MeshStandardMaterial({color:palette[i%palette.length],metalness:0.92,roughness:0.32});
 const g=new THREE.Group();g.position.set(pos[i].x,pos[i].y,Z[i]);
 const m=new THREE.Mesh(gearGeo(teeth[i]),mat);g.add(m);
 const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,TH+0.22,20),shaftMat);
 hub.rotation.x=Math.PI/2;g.add(hub);
 const pin=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,TH+0.12,10),darkMat);
 pin.rotation.x=Math.PI/2;pin.position.set(R[i]*0.62,0,0);g.add(pin);
 const pin2=pin.clone();pin2.position.set(Math.cos(2.1)*R[i]*0.62,Math.sin(2.1)*R[i]*0.62,0);g.add(pin2);
 scene.add(g);groups.push(g);
 const sh=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,1.6,12),shaftMat);
 sh.rotation.x=Math.PI/2;sh.position.set(pos[i].x,pos[i].y,0.35);scene.add(sh);
}
(function(){const a=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,1.1,12),shaftMat);a.rotation.x=Math.PI/2;a.position.set(pos[3].x,pos[3].y,0.38);scene.add(a);})();
const plate=new THREE.Mesh(new THREE.BoxGeometry(11,8,0.25),new THREE.MeshStandardMaterial({color:0x151a22,metalness:0.6,roughness:0.7}));
plate.position.set(0.4,0,-0.75);scene.add(plate);
for(let i=0;i<10;i++){const r=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.3,10),shaftMat);r.rotation.x=Math.PI/2;r.position.set(-4.5+i*1.05,3.4,-0.55);scene.add(r);}
const dialC={x:pos[0].x,y:pos[0].y};
const ring=new THREE.Mesh(new THREE.TorusGeometry(1.15,0.07,12,60),new THREE.MeshStandardMaterial({color:0xd8b25a,metalness:0.95,roughness:0.25}));
ring.position.set(dialC.x,dialC.y,1.35);scene.add(ring);
for(let k=0;k<12;k++){const t=new THREE.Mesh(new THREE.BoxGeometry(k%3===0?0.09:0.045,0.22,0.02),darkMat);const a=k/12*Math.PI*2;t.position.set(dialC.x+Math.sin(a)*1.0,dialC.y+Math.cos(a)*1.0,1.33);t.rotation.z=-a;scene.add(t);}
const secHand=new THREE.Group();secHand.position.set(dialC.x,dialC.y,1.45);
const sm=new THREE.MeshStandardMaterial({color:0xd23b3b,metalness:0.6,roughness:0.4});
const needle=new THREE.Mesh(new THREE.BoxGeometry(0.05,1.05,0.03),sm);needle.position.y=0.32;secHand.add(needle);
const tail=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.3,0.03),sm);tail.position.y=-0.28;secHand.add(tail);
const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.08,16),shaftMat);cap.rotation.x=Math.PI/2;secHand.add(cap);
scene.add(secHand);
const pend=new THREE.Group();pend.position.set(2.9,3.1,-0.2);scene.add(pend);
const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,3.8,10),shaftMat);rod.position.y=-1.9;pend.add(rod);
const bob=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.16,32),new THREE.MeshStandardMaterial({color:0xd8b25a,metalness:0.95,roughness:0.28}));
bob.rotation.x=Math.PI/2;bob.position.y=-3.8;pend.add(bob);
const piv=new THREE.Mesh(new THREE.SphereGeometry(0.12,16,12),darkMat);pend.add(piv);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const clk=new THREE.Clock();
function tick(){
 requestAnimationFrame(tick);
 const t=clk.getElapsedTime();
 for(let i=0;i<N;i++)groups[i].rotation.z=PH[i]+W[i]*t;
 const s=t%60,fl=Math.floor(s),fr=s-fl,e=1-Math.exp(-fr*14);
 secHand.rotation.z=-(fl+e)*Math.PI*2/60;
 pend.rotation.z=0.38*Math.sin(t*Math.PI);
 camera.position.set(camBase.x+Math.sin(t*0.12)*0.7,camBase.y+Math.sin(t*0.17)*0.45,camBase.z+Math.sin(t*0.09)*0.5);
 camera.lookAt(0,0,0.35);
 renderer.render(scene,camera);
}
tick();
</script>
</body>
</html>
