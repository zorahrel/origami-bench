<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raymarched Blob</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05060f}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const uniforms = {
uTime: { value: 0.0 },
uRes: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
};
const vert = `void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }`;
const frag = `
uniform float uTime;
uniform vec2 uRes;
float smin(float a, float b, float k){
float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
return mix(b, a, h) - k * h * (1.0 - h);
}
vec2 mapScene(vec3 p){
float t = uTime * 0.7;
vec3 c0 = vec3(0.0, 1.25 + 0.28 * sin(t * 1.2), 0.0);
float d = length(p - c0) - 0.85;
vec3 c1 = c0 + vec3(0.85 * sin(t * 1.6), 0.35 * sin(t * 2.2), 0.85 * cos(t * 1.6));
vec3 c2 = c0 + vec3(0.85 * sin(t * 1.6 + 2.094), 0.35 * sin(t * 2.2 + 2.094), 0.85 * cos(t * 1.6 + 2.094));
vec3 c3 = c0 + vec3(0.85 * sin(t * 1.6 + 4.188), 0.35 * sin(t * 2.2 + 4.188), 0.85 * cos(t * 1.6 + 4.188));
d = smin(d, length(p - c1) - 0.52, 0.65);
d = smin(d, length(p - c2) - 0.52, 0.65);
d = smin(d, length(p - c3) - 0.52, 0.65);
d += 0.07 * sin(p.x * 2.6 + t * 2.0) * sin(p.y * 2.4 - t * 1.7) * sin(p.z * 2.6 + t * 1.4);
float fd = p.y;
float mat = (d < fd) ? 0.0 : 1.0;
return vec2(min(d, fd), mat);
}
vec3 calcNormal(vec3 p){
vec2 e = vec2(0.0015, -0.0015);
return normalize(e.xyy * mapScene(p + e.xyy).x + e.yyx * mapScene(p + e.yyx).x + e.yxy * mapScene(p + e.yxy).x + e.xxx * mapScene(p + e.xxx).x);
}
float softShadow(vec3 ro, vec3 rd, float mint, float maxt, float k){
float res = 1.0;
float t = mint;
for(int i = 0; i < 28; i++){
float h = mapScene(ro + rd * t).x;
if(h < 0.001) return 0.0;
res = min(res, k * h / t);
t += clamp(h, 0.02, 0.35);
if(t > maxt) break;
}
return clamp(res, 0.0, 1.0);
}
float calcAO(vec3 p, vec3 n){
float occ = 0.0;
float sca = 1.0;
for(int i = 1; i <= 5; i++){
float h = 0.01 + 0.12 * float(i) / 5.0;
float d = mapScene(p + n * h).x;
occ += (h - d) * sca;
sca *= 0.92;
}
return clamp(1.0 - 3.0 * occ, 0.0, 1.0);
}
void main(){
vec2 uv = (gl_FragCoord.xy * 2.0 - uRes) / uRes.y;
float t = uTime;
float ang = t * 0.26;
vec3 ro = vec3(4.4 * cos(ang), 2.1 + 0.75 * sin(t * 0.31), 4.4 * sin(ang));
vec3 ta = vec3(0.0, 0.9, 0.0);
vec3 fw = normalize(ta - ro);
vec3 rt = normalize(cross(fw, vec3(0.0, 1.0, 0.0)));
vec3 up = cross(rt, fw);
vec3 rd = normalize(uv.x * rt + uv.y * up + 1.7 * fw);
float tm = 0.0;
float m = -1.0;
float tmax = 32.0;
for(int i = 0; i < 128; i++){
vec3 p = ro + rd * tm;
vec2 h = mapScene(p);
if(h.x < 0.0012) { m = h.y; break; }
tm += h.x;
if(tm > tmax) break;
m = h.y;
}
vec3 col = vec3(0.0);
vec3 bg = mix(vec3(0.03, 0.04, 0.09), vec3(0.10, 0.16, 0.28), 0.5 + 0.5 * rd.y);
bg += vec3(0.35, 0.18, 0.45) * pow(clamp(1.0 - abs(rd.y), 0.0, 1.0), 6.0) * 0.5;
if(tm < tmax && m > -0.5){
vec3 p = ro + rd * tm;
vec3 n = calcNormal(p);
vec3 lig = normalize(vec3(0.5 * sin(t * 0.45), 0.85, 0.5 * cos(t * 0.45)));
vec3 view = -rd;
float dif = clamp(dot(n, lig), 0.0, 1.0);
float sky = 0.5 + 0.5 * n.y;
float sh = softShadow(p + n * 0.02, lig, 0.04, 6.0, 9.0);
float ao = calcAO(p, n);
float fres = pow(1.0 - clamp(dot(n, view), 0.0, 1.0), 3.0);
vec3 blobA = vec3(0.15, 0.55, 0.95);
vec3 blobB = vec3(0.75, 0.25, 0.95);
vec3 blobCol = mix(blobA, blobB, 0.5 + 0.5 * sin(t * 0.9 + p.y * 2.0 + p.x * 1.5));
vec3 chk = vec3(0.16, 0.17, 0.22);
vec2 g = floor(p.xz * 1.2);
float check = mod(g.x + g.y, 2.0);
vec3 floorA = vec3(0.13, 0.14, 0.19);
vec3 floorB = vec3(0.42, 0.44, 0.55);
vec3 floorCol = mix(floorA, floorB, check);
float grid = smoothstep(0.96, 1.0, max(abs(fract(p.x * 1.2) - 0.5), abs(fract(p.z * 1.2) - 0.5)) * 2.0);
floorCol += vec3(0.2, 0.6, 1.0) * grid * 0.35;
float glowPulse = 0.5 + 0.5 * sin(t * 2.0);
vec3 base = (m < 0.5) ? blobCol : floorCol;
vec3 lit = base * (0.25 + 0.25 * sky);
lit += base * dif * sh * 1.25;
vec3 hv = normalize(lig + view);
float spec = pow(clamp(dot(n, hv), 0.0, 1.0), 42.0) * sh;
lit += vec3(1.0, 0.95, 0.9) * spec * ((m < 0.5) ? 0.9 : 0.25);
lit *= ao;
vec3 glowCol = mix(vec3(0.2, 0.7, 1.0), vec3(1.0, 0.35, 0.85), 0.5 + 0.5 * sin(t * 0.8));
lit += glowCol * fres * (0.9 + 0.6 * glowPulse) * (m < 0.5 ? 1.0 : 0.35);
float fog = 1.0 - exp(-0.028 * tm * tm * 0.18 - 0.02 * tm);
lit = mix(lit, bg, clamp(fog, 0.0, 1.0));
col = lit;
} else {
col = bg;
float sun = pow(clamp(dot(rd, normalize(vec3(0.5 * sin(t * 0.45), 0.85, 0.5 * cos(t * 0.45)))), 0.0, 1.0), 220.0);
col += vec3(1.0, 0.9, 0.75) * sun * 2.0;
}
col = col / (1.0 + col * 0.35);
col = pow(clamp(col, 0.0, 1.0), vec3(0.4545));
gl_FragColor = vec4(col, 1.0);
}
`;
const mat = new THREE.ShaderMaterial({ uniforms: uniforms, vertexShader: vert, fragmentShader: frag });
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat);
quad.frustumCulled = false;
scene.add(quad);
window.addEventListener('resize', function(){
renderer.setSize(window.innerWidth, window.innerHeight);
uniforms.uRes.value.set(window.innerWidth, window.innerHeight);
});
const clock = new THREE.Clock();
renderer.setAnimationLoop(function(){
uniforms.uTime.value = clock.getElapsedTime();
renderer.render(scene, camera);
});
</script>
</body>
</html>
