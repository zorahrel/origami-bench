<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Consequence Engine</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a20;color:#f1ede3;font-family:Arial,Helvetica,sans-serif}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;padding:30px 34px;display:flex;flex-direction:column;justify-content:space-between}
header{display:flex;justify-content:space-between;align-items:flex-start}
.eyebrow{font-size:10px;letter-spacing:3px;color:#a7b6b7;font-weight:700}
h1{font-size:clamp(24px,3.3vw,48px);line-height:.95;letter-spacing:-2px;margin:13px 0 12px;font-weight:900}
h1 span{color:#ff865e} .subtitle{font-size:10px;color:#a7b6b7;letter-spacing:1.4px}
.clock{text-align:right;font-variant-numeric:tabular-nums}
.clock strong{display:block;font-size:26px;font-weight:400;letter-spacing:-1px;margin-top:10px}
.clock small{font-size:10px;color:#82979c;letter-spacing:2px}
.live{font-size:10px;letter-spacing:2px;color:#96d6bd}.live:before{content:"";display:inline-block;width:6px;height:6px;background:#9ce5c9;border-radius:50%;margin-right:8px;box-shadow:0 0 12px #8fe4ba}
#stages{display:flex;gap:7px;margin-top:20px;max-width:790px}
.stage{flex:1;min-width:0;border-top:2px solid #455358;padding:10px 9px 10px 0;opacity:.47;transition:opacity .3s,border-color .3s}
.stage b{font-size:12px;display:inline-block;margin-right:7px;color:#b4c7cb}
.stage span{font-size:9px;font-weight:700;letter-spacing:1px}
.stage.active{opacity:1;border-color:#ff976d}.stage.active b{color:#ff976d}.stage.done{opacity:.85;border-color:#81c7b2}
footer{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:25px}
#chapter{font-size:10px;letter-spacing:2.5px;color:#f7a27c;margin-bottom:8px}
#caption{font-size:clamp(17px,2.1vw,27px);font-weight:600;letter-spacing:-.7px;max-width:600px}
#detail{margin-top:8px;color:#93a7aa;font-size:10px;letter-spacing:1.2px;min-height:14px}
.diagram{font-size:10px;letter-spacing:1.5px;color:#8fa5a8;text-align:right;line-height:1.8}
.arm{display:inline-block;color:#657d83;border:1px solid #435a61;border-radius:3px;padding:1px 7px;margin:0 3px;transition:all .2s}
.arm.on{color:#ffe3bd;border-color:#e6ac65;background:#b9873529;box-shadow:0 0 14px #daa95525}
#progress{position:fixed;bottom:0;left:0;height:3px;background:linear-gradient(90deg,#69c4b0,#ffd196,#ff7957);width:0}
#vignette{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,#0712168c,transparent 28%,transparent 70%,#071216bb)}
#shutter{position:fixed;inset:0;background:#101a20;pointer-events:none;opacity:1}
@media(max-width:700px){#hud{padding:20px}.eyebrow{font-size:8px;letter-spacing:2px}h1{letter-spacing:-1px}.subtitle{font-size:8px}.clock strong{font-size:20px}.clock small{font-size:8px}#stages{gap:5px;max-width:400px}.stage{padding:8px 0}.stage b{font-size:11px}.stage span{display:none}.diagram{display:none}#caption{max-width:90vw}footer{padding-bottom:8px}}
</style>
</head>
<body>
<canvas id="world" aria-label="An automatic three-dimensional Rube Goldberg machine with seven connected stages"></canvas>
<div id="vignette"></div>
<div id="hud">
<div>
<header>
<div>
<div class="eyebrow">AUTOMATIC KINETIC THEATRE / Nº 007</div>
<h1>THE CONSEQUENCE<br><span>ENGINE.</span></h1>
<div class="subtitle">33 DOMINOES · TWO PATHS · ONE INEVITABLE END</div>
</div>
<div class="clock">
<div class="live">LIVE CHAIN</div>
<strong id="time">00.00</strong>
<small>15 SECOND CYCLE / <span id="cycle">01</span></small>
</div>
</header>
<div id="stages"></div>
</div>
<footer>
<div>
<div id="chapter">01 / THE SPLIT</div>
<div id="caption">A small push. An unreasonable consequence.</div>
<div id="detail">FOLLOW THE COPPER MARBLE</div>
</div>
<div class="diagram">PARALLEL PATHS<br><span id="armA" class="arm">A</span> + <span id="armB" class="arm">B</span> → BRIDGE<br>HAND-WRITTEN MOTION / AUTO RESET</div>
</footer>
</div>
<div id="progress"></div>
<div id="shutter"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const TAU=Math.PI*2, PERIOD=15, STEP=1/120;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const smooth=v=>{v=clamp(v);return v*v*(3-2*v)};
const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const scene=new THREE.Scene();
scene.background=new THREE.Color('#101a20');
scene.fog=new THREE.FogExp2('#101a20',.022);
const camera=new THREE.PerspectiveCamera(44,innerWidth/innerHeight,.1,130);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('world'),antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.25;

scene.add(new THREE.HemisphereLight('#b7e2eb','#293332',2.3));
const sun=new THREE.DirectionalLight('#ffdfb1',3.6);
sun.position.set(-3,15,9);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-19,right:19,top:12,bottom:-12,near:.5,far:45});
sun.shadow.bias=-.00035;sun.shadow.normalBias=.035;
scene.add(sun);
const rimLight=new THREE.DirectionalLight('#62c9df',2.2);
rimLight.position.set(2,8,-10);scene.add(rimLight);

const material=(color,metalness=.1,roughness=.5)=>new THREE.MeshStandardMaterial({color,metalness,roughness});
const M={
base:material('#203038',.45,.48),edge:material('#425961',.6,.35),
dark:material('#152b32',.65,.35),teal:material('#3a9c99',.45,.35),
cream:material('#ebe1c8',.1,.48),orange:material('#ef8058',.25,.36),
gold:material('#dfb775',.72,.25),steel:material('#a7babd',.8,.24),
black:material('#142027',.3,.6),rope:material('#e5c998',.25,.5),
copper:material('#ff683c',.78,.2)

function mesh(geometry,mat,parent=scene){
const m=new THREE.Mesh(geometry,mat);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}
function box(w,h,d,mat,x=0,y=0,z=0,parent=scene){
const m=mesh(new THREE.BoxGeometry(w,h,d),mat,parent);m.position.set(x,y,z);return m;
}
function sphere(r,mat,x=0,y=0,z=0,parent=scene){
const m=mesh(new THREE.SphereGeometry(r,20,14),mat,parent);m.position.set(x,y,z);return m;
}
const Y=V(0,1,0),rodDelta=V();
function setRod(m,a,b){
rodDelta.subVectors(b,a);m.position.copy(a).add(b).multiplyScalar(.5);
m.scale.y=Math.max(.0001,rodDelta.length());
m.quaternion.setFromUnitVectors(Y,rodDelta.normalize());
}
function rod(a,b,r,mat,parent=scene){
const m=mesh(new THREE.CylinderGeometry(r,r,1,8),mat,parent);setRod(m,a,b);return m;
}
function ring(r,t,mat,x,y,z,parent=scene,horizontal=false){
const m=mesh(new THREE.TorusGeometry(r,t,8,64),mat,parent);
m.position.set(x,y,z);if(horizontal)m.rotation.x=Math.PI/2;return m;
}
function tube(points,r,mat,parent=scene){
return mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points),Math.max(24,points.length*2),r,6,false),mat,parent);
}

box(28,.55,8.2,M.base,.2,-.35,0);
box(28.08,.07,8.28,M.edge,.2,-.13,0);
box(28,.10,8.2,M.base,.2,-.05,0);
box(27.4,.025,.035,M.gold,.2,.018,3.82);
box(27.4,.025,.035,M.gold,.2,.018,-3.82);
const floor=mesh(new THREE.PlaneGeometry(200,200),material('#111d23',.1,.85));
floor.rotation.x=-Math.PI/2;floor.position.y=-.66;
for(let x=-13;x<=13;x++){
box(.015,.012,7.5,M.edge,x,.012,0);
for(let z=-3;z<=3;z++)box(.065,.014,.016,M.steel,x,.018,z);
}
for(const x of [-12,12])for(const z of [-3,3]){
const foot=mesh(new THREE.CylinderGeometry(.32,.40,.3,16),M.dark);
foot.position.set(x,-.69,z);
}

const stageNames=['DOMINOES','FUNNEL','SEESAW','HAMMER','COLLAPSE','PULLEY','SIGNAL'];
const titles=['THE SPLIT','ORBITAL DESCENT','ENERGY TRANSFER','THE HEAVY HAND','CONTROLLED CHAOS','THE ESCAPEMENT','THE PAYOFF'];
const captions=[
'A small push. An unreasonable consequence.',
'Two paths reunite. Gravity takes the wheel.',
'One ball lands. Another takes flight.',
'Momentum meets a rather large hammer.',
'Twelve blocks discover the short way down.',
'The weight is caught. The mechanism is armed.',
'Flag up. Lights on. Consequence complete.'

const stageUI=document.getElementById('stages');
stageUI.innerHTML=stageNames.map((n,i)=>`<div class="stage"><b>${i+1}</b><span>${n}</span></div>`).join('');
const stageEls=[...stageUI.children],labels=[],fired=Array(7).fill(false);
function label(n,x,y,z){
const c=document.createElement('canvas');c.width=c.height=128;
const ctx=c.getContext('2d');
ctx.fillStyle='#142931';ctx.beginPath();ctx.arc(64,64,54,0,TAU);ctx.fill();
ctx.strokeStyle='#cad9d5';ctx.lineWidth=3;ctx.stroke();
ctx.fillStyle='#ffffff';ctx.font='bold 55px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(n),64,66);

const mat=new THREE.SpriteMaterial({map:tex,color:'#749095',depthTest:false});
const s=new THREE.Sprite(mat);s.position.set(x,y,z);s.scale.set(.65,.65,1);s.renderOrder=10;scene.add(s);labels.push(s);
}
label(1,-6.2,4.14,1.8);label(2,0,4.00,0);label(3,1.7,1.72,1.0);
label(4,5.25,5.12,0);label(5,8.05,3.16,0);label(6,10.6,5.12,0);label(7,12.65,2.9,1.0);
let currentStage=0;
function fire(n){
if(fired[n-1])return;
fired[n-1]=true;currentStage=Math.max(currentStage,n);
labels[n-1].material.color.set('#ffd69a');
stageEls.forEach((e,i)=>{e.classList.toggle('active',i===n-1);e.classList.toggle('done',fired[i]&&i<n-1)});
document.getElementById('chapter').textContent=`0${n} / ${titles[n-1]}`;
document.getElementById('caption').textContent=captions[n-1];
}

const DECK=2.70,H=.91,dominoes=[];
function deck(points,width=.66){
for(let i=0;i<points.length-1;i++){
const a=points[i],b=points[i+1],dx=b.x-a.x,dz=b.z-a.z;
const p=box(Math.hypot(dx,dz)+.11,.14,width,M.dark,(a.x+b.x)/2,DECK-.09,(a.z+b.z)/2);
p.rotation.y=-Math.atan2(dz,dx);
}
for(let i=0;i<points.length;i+=3){
const p=points[i];
rod(V(p.x,0,p.z),V(p.x,DECK-.13,p.z),.055,M.edge);
box(.37,.06,.37,M.dark,p.x,.045,p.z);
ring(.085,.023,M.gold,p.x,DECK-.40,p.z,scene,true);
}
const rail=points.map(p=>V(p.x,DECK-.01,p.z+width*.48));tube(rail,.018,M.gold);
}
function domino(p,dir,kind='normal'){
const g=new THREE.Group();g.position.set(p.x,DECK,p.z);
g.rotation.y=-Math.atan2(dir.z,dir.x);scene.add(g);
const wide=kind==='bridge'?1.38:kind==='fork'?1.20:.45;
const mat=kind==='normal'?(dominoes.length%3===0?M.cream:M.orange):M.gold;
box(.15,H,wide,mat,0,H/2,0,g);
for(const x of [-.077,.077])box(.006,.055,wide*.78,M.dark,x,H*.73,0,g);
box(.20,.055,wide+.10,M.steel,0,.024,0,g);
const d={group:g,p:V(p.x,DECK,p.z),dir:dir.clone().normalize(),kind,start:Infinity,sent:false,angle:0,next:[],contacts:0};
dominoes.push(d);return d;
}
const mainPoints=[];
for(let i=0;i<14;i++){
const u=i/13;mainPoints.push(V(-12+5.7*u,0,1.12*Math.sin(TAU*u)));
}
deck(mainPoints);
const main=mainPoints.map((p,i)=>domino(p,i<13?mainPoints[i+1].clone().sub(p):V(1,0,0)));
for(let i=0;i<main.length-1;i++)main[i].next.push({d:main[i+1],dist:mainPoints[i].distanceTo(mainPoints[i+1])});
const fork=domino(V(-5.88,0,0),V(1,0,0),'fork');
box(.65,.14,1.4,M.dark,-5.90,DECK-.09,0);
main.at(-1).next.push({d:fork,dist:.42});
const branches=[];
for(let arm=0;arm<2;arm++){
const sign=arm===0?1:-1,points=[];
for(let i=0;i<8;i++){
const u=i/7;points.push(V(-5.45+2.48*u,0,sign*(.43+(arm===0?.89:1.10)*Math.sin(Math.PI*u))));
}
deck(points,.61);
const ds=points.map((p,i)=>domino(p,i<7?points[i+1].clone().sub(p):V(1,0,0)));
for(let i=0;i<7;i++)ds[i].next.push({d:ds[i+1],dist:points[i].distanceTo(points[i+1])});
fork.next.push({d:ds[0],dist:.43});
branches.push(ds);
}
const bridge=domino(V(-2.56,0,0),V(1,0,0),'bridge');
const lastDomino=domino(V(-2.12,0,0),V(1,0,0));
box(.95,.14,1.52,M.dark,-2.40,DECK-.09,0);
bridge.next.push({d:lastDomino,dist:.44});
branches.forEach((ds,i)=>ds.at(-1).next.push({d:bridge,dist:.42,arm:i}));
const mergeLights=[];
for(const z of [-.56,.56]){
const mat=material('#374744',.3,.35);mat.emissive=new THREE.Color('#ffc47d');mat.emissiveIntensity=0;
mergeLights.push(sphere(.072,mat,-2.56,DECK+.10,z));
}
const starter=new THREE.Group();scene.add(starter);
const initialDir=main[0].dir.clone();
starter.position.copy(main[0].p).addScaledVector(initialDir,-.8);starter.position.y+=.55;
starter.rotation.y=-Math.atan2(initialDir.z,initialDir.x);
box(.45,.25,.32,M.dark,-.23,0,0,starter);
const piston=box(.38,.055,.055,M.steel,.10,0,0,starter);
const striker=box(.10,.25,.34,M.gold,.27,0,0,starter);

const funnelMat=new THREE.MeshStandardMaterial({color:'#317d81',metalness:.48,roughness:.28,side:THREE.DoubleSide,transparent:true,opacity:.82,depthWrite:false});
mesh(new THREE.LatheGeometry([new THREE.Vector2(.235,1.36),new THREE.Vector2(.24,1.42),new THREE.Vector2(1.62,3.22)],80),funnelMat);
ring(1.62,.055,M.gold,0,3.22,0,scene,true);
ring(.245,.03,M.gold,0,1.39,0,scene,true);
const neck=mesh(new THREE.CylinderGeometry(.235,.235,.33,32,1,true),funnelMat);neck.position.y=1.24;
for(let i=0;i<8;i++){
const a=i*TAU/8;
rod(V(1.64*Math.cos(a),3.19,1.64*Math.sin(a)),V(.26*Math.cos(a),1.39,.26*Math.sin(a)),.023,M.edge);
}
for(const x of [-1.14,1.14])for(const z of [-1.14,1.14]){
rod(V(x,.04,z),V(x,2.87,z),.055,M.edge);box(.32,.08,.32,M.dark,x,.06,z);
}
function funnelPoint(u){
const r=1.50*(1-u),a=Math.PI+TAU*2.65*u;

return V(r*Math.cos(a),y,r*Math.sin(a));
}
const groove=[];
for(let i=0;i<150;i++){const p=funnelPoint(i/160);p.y-=.175;groove.push(p)}
tube(groove,.018,M.gold);
const marble=sphere(.19,M.copper);marble.position.copy(funnelPoint(0));
ring(.192,.014,M.cream,0,0,0,marble);
const ball2=sphere(.22,M.cream);
ring(.222,.021,M.orange,0,0,0,ball2);
const trailArray=new Float32Array(35*3),trailGeo=new THREE.BufferGeometry();
trailGeo.setAttribute('position',new THREE.BufferAttribute(trailArray,3));
const trail=new THREE.Line(trailGeo,new THREE.LineBasicMaterial({color:'#ffc089',transparent:true,opacity:.48}));
trail.frustumCulled=false;scene.add(trail);

const seePivot=V(1.7,.73,0);
const standShape=new THREE.Shape();
standShape.moveTo(-.42,0);standShape.lineTo(.42,0);standShape.lineTo(0,.69);standShape.closePath();
const stand=mesh(new THREE.ExtrudeGeometry(standShape,{depth:.50,bevelEnabled:true,bevelSize:.035,bevelThickness:.025,bevelSegments:1,steps:1}),M.teal);
stand.position.set(1.7,.02,-.25);
const seesaw=new THREE.Group();seesaw.position.copy(seePivot);scene.add(seesaw);
box(3.65,.13,.51,M.cream,0,0,0,seesaw);
box(3.65,.025,.09,M.orange,0,.075,0,seesaw);
rod(V(1.7,.73,-.40),V(1.7,.73,.40),.13,M.gold);
for(const x of [-1.70,1.52]){
const dish=mesh(new THREE.CylinderGeometry(.33,.28,.09,24),M.gold,seesaw);

ring(.31,.025,M.dark,x,.16,0,seesaw,true);
}

for(const z of [-.67,.67]){
rod(V(4.78,0,z),V(5.25,4.78,z),.07,M.dark);
box(.64,.10,.4,M.edge,4.78,.08,z);
}
rod(V(5.25,4.70,-.87),V(5.25,4.70,.87),.13,M.gold);
const hammer=new THREE.Group();hammer.position.copy(HP);scene.add(hammer);
rod(V(0,-.04,0),V(0,-HL,0),.063,M.gold,hammer);
box(1.02,.55,.86,M.dark,0,-HL,0,hammer);
box(.11,.58,.91,M.steel,.48,-HL,0,hammer);
box(.11,.58,.91,M.steel,-.48,-HL,0,hammer);
box(.60,.30,.02,M.orange,0,-HL,.442,hammer);
sphere(.145,M.steel,0,0,0,hammer);

const blocks=[],blockSize=.62;
for(let row=0;row<4;row++)for(let col=0;col<3;col++){
const g=new THREE.Group();scene.add(g);
box(blockSize,blockSize,blockSize,row%2?M.cream:M.teal,0,0,0,g);
box(.42,.42,.016,M.dark,0,0,.317,g);
box(.27,.035,.018,M.gold,0,0,.33,g);
const p=V(8.05,.33+row*.66,(col-1)*.67);g.position.copy(p);
blocks.push({g,p:p.clone(),v:V(),w:V(),row,col,wake:Infinity,loose:false,caught:false,target:row===3&&col===1,local:V()});
}
box(1.20,.075,2.50,M.dark,8.05,.025,0);

const bucket=new THREE.Group();scene.add(bucket);
bucket.position.set(10.35,1.5,0);
mesh(new THREE.CylinderGeometry(.60,.43,1,32,1,true),M.orange,bucket);
const bucketBottom=mesh(new THREE.CylinderGeometry(.43,.43,.07,24),M.dark,bucket);bucketBottom.position.y=-.48;
ring(.60,.038,M.gold,0,.5,0,bucket,true);
ring(.44,.025,M.dark,0,-.48,0,bucket,true);
for(let i=0;i<12;i++){const a=i*TAU/12;rod(V(.435*Math.cos(a),-.46,.435*Math.sin(a)),V(.594*Math.cos(a),.49,.594*Math.sin(a)),.014,M.gold,bucket)}
tube([V(-.55,.35,0),V(-.44,.92,0),V(0,1.07,0),V(.44,.92,0),V(.55,.35,0)],.032,M.steel,bucket);

for(const x of [9.70,12.10]){
rod(V(x,0,-.58),V(x,4.92,-.58),.075,M.dark);
box(.55,.10,.55,M.edge,x,.07,-.58);
}
rod(V(9.60,4.92,-.58),V(12.22,4.92,-.58),.095,M.edge);
const wheels=[];
for(const x of [10.60,11.70]){
const g=new THREE.Group();g.position.set(x,4.58,0);scene.add(g);
ring(.25,.045,M.gold,0,0,0,g);
for(let i=0;i<6;i++){const a=i*TAU/6;rod(V(),V(.22*Math.cos(a),.22*Math.sin(a),0),.022,M.steel,g)}
sphere(.075,M.dark,0,0,0,g);wheels.push(g);
rod(V(x,4.58,-.65),V(x,4.58,.08),.055,M.edge);
}
const ropePath=[];
for(let i=0;i<=12;i++){const a=Math.PI-i*Math.PI/24;ropePath.push(V(10.60+.25*Math.cos(a),4.58+.25*Math.sin(a),.01))}
ropePath.push(V(11.70,4.83,.01));
for(let i=0;i<=12;i++){const a=Math.PI/2-i*Math.PI/24;ropePath.push(V(11.70+.25*Math.cos(a),4.58+.25*Math.sin(a),.01))}
tube(ropePath,.023,M.rope);
const ropeLeft=rod(V(10.35,2.55,0),V(10.35,4.58,0),.023,M.rope);
const ropeRight=rod(V(11.95,2.95,0),V(11.95,4.58,0),.023,M.rope);

const gear=new THREE.Group();gear.position.set(9.76,3.34,.05);scene.add(gear);
ring(.36,.075,M.gold,0,0,0,gear);
for(let i=0;i<12;i++){

const particles=[],dustGeo=new THREE.IcosahedronGeometry(1,0);

let seed=12345,particleCursor=0;
function rand(){seed=(Math.imul(seed,1664525)+0x3C6EF35F)>>>0;return seed/4294967296}
function puff(p,n=7,power=1){
for(let i=0;i<n;i++){
const q=particles[particleCursor++%particles.length];q.age=0;q.life=.35+rand()*.43;q.size=.025+rand()*.065;
q.m.position.copy(p);q.v.set((rand()-.5)*1.9*power,(.3+rand()*1.5)*power,(rand()-.5)*1.9*power);
q.m.visible=true;q.m.material.opacity=.5;
}
}

let time=0,cycle=1,marbleMode='waiting',marbleStart=0,marbleVelocity=0;
let seeStart=Infinity,launchDone=false,ballMode='waiting',ballVelocity=V();
let hammerAngle=0,hammerVelocity=0,hammerHit=false,stackStart=Infinity;
let bucketLoaded=false,bucketStart=Infinity,bridgeMask=0,signalStart=Infinity,lampOn=false;
let trailCount=0;
function reset(){
time=0;seed=12345;currentStage=0;fired.fill(false);
for(const d of dominoes){d.start=Infinity;d.sent=false;d.angle=0;d.contacts=0;d.group.rotation.z=0}
marbleMode='waiting';marble.position.copy(funnelPoint(0));marbleStart=0;marbleVelocity=0;
seeStart=Infinity;launchDone=false;seesaw.rotation.z=0;ballMode='waiting';ballVelocity.set(0,0,0);ball2.position.copy(leverPoint(localBall2));
hammerAngle=hammerVelocity=0;hammer.rotation.z=0;hammerHit=false;stackStart=Infinity;
bucketLoaded=false;bucketStart=Infinity;bridgeMask=0;signalStart=Infinity;lampOn=false;
bucket.position.set(10.35,1.5,0);bucket.rotation.z=0;
flag.position.y=2.95;flagMesh.scale.x=.045;
gear.rotation.z=0;latch.rotation.z=0;bulbMat.emissiveIntensity=0;bulbMat.color.set('#6b8888');lampLight.intensity=0;halo.visible=false;spark.visible=false;
for(const b of blocks){b.g.position.copy(b.p);b.g.rotation.set(0,0,0);b.v.set(0,0,0);b.w.set(0,0,0);b.wake=Infinity;b.loose=false;b.caught=false}
for(const p of particles){p.age=2;p.m.visible=false}
mergeLights.forEach(m=>m.material.emissiveIntensity=0);
labels.forEach(m=>m.material.color.set('#749095'));
stageEls.forEach(e=>e.className='stage');
document.getElementById('armA').classList.remove('on');document.getElementById('armB').classList.remove('on');
document.getElementById('chapter').textContent='01 / THE SPLIT';
document.getElementById('caption').textContent=captions[0];
document.getElementById('cycle').textContent=String(cycle).padStart(2,'0');
trailCount=0;trail.visible=false;
camera.position.set(-5,12,18);cameraTarget.set(-5,1.9,0);camera.lookAt(cameraTarget);
}
function hitDomino(d){
if(d.start!==Infinity)return;
d.start=time;puff(d.p.clone().add(V(0,.07,0)),3,.35);
}
function bridgeContact(arm){
const bit=1<<arm;if(bridgeMask&bit)return;
bridgeMask|=bit;mergeLights[arm].material.emissiveIntensity=3;
document.getElementById(arm===0?'armA':'armB').classList.add('on');
puff(V(-2.56,DECK+.1,arm===0?.45:-.45),5,.45);
if(bridgeMask===3)hitDomino(bridge);
}
function collapse(){
hammerHit=true;stackStart=time;hammerVelocity*=-.23;fire(5);
puff(V(7.76,2.3,0),19,1.35);
for(const b of blocks){
b.wake=time+(3-b.row)*.045;
b.v.set(1.05+rand()*.8+b.row*.12,1.0+b.row*.28+rand()*.5,(b.col-1)*(.60+rand()*.35));
if(b.target){
const flight=.90;b.v.x=(10.35-b.p.x)/flight;
b.v.y=(2.0+blockSize/2-b.p.y+.5*9.8*flight*flight)/flight;b.v.z=0;
}
b.w.set((rand()-.5)*5,(rand()-.5)*4,(rand()-.5)*5);
}
}
function catchBlock(b){
b.caught=true;b.loose=false;b.local.set(0,.02,0);b.g.rotation.set(.05,.22,-.15);
if(!bucketLoaded){bucketLoaded=true;bucketStart=time;fire(6)}
puff(V(10.35,2.04,0),16,.9);
}
const nearest=V(),top=V();
function update(dt){
time+=dt;if(time>=PERIOD){cycle++;reset();return}
const push=smooth(time/.37);
striker.position.x=.27+push*.37;piston.scale.x=1+push*.95;piston.position.x=.10+push*.18;
if(time>=.35&&main[0].start===Infinity){hitDomino(main[0]);fire(1)}
for(const d of dominoes){
if(d.start===Infinity){
if(d===bridge&&bridgeMask)d.group.rotation.z=-.10;
continue;
}
const age=time-d.start,q=clamp(age/.33);
d.angle=1.47*q*q;
if(age>.33)d.angle+=.025*Math.sin((age-.33)*20)*Math.exp(-(age-.33)*8);
d.group.rotation.z=-d.angle;
if(!d.sent&&d.next.length){
let all=true;
for(const link of d.next){
if(H*Math.sin(d.angle)+.10>=link.dist){
if(link.d===bridge)bridgeContact(link.arm);else hitDomino(link.d);
}else all=false;
}
d.sent=all;
}
if(d===lastDomino&&marbleMode==='waiting'){
top.copy(d.dir).multiplyScalar(H*Math.sin(d.angle));top.y=H*Math.cos(d.angle);
const rel=marble.position.clone().sub(d.p);
nearest.copy(top).multiplyScalar(clamp(rel.dot(top)/top.lengthSq())).add(d.p);
if(nearest.distanceTo(marble.position)<.255){
marbleMode='spiral';marbleStart=time;fire(2);puff(marble.position,6,.5);
}
}
}
if(marbleMode==='spiral'){
const u=clamp((time-marbleStart)/3.0);
marble.position.copy(funnelPoint(u));marble.rotation.x+=dt*11;marble.rotation.z-=dt*9;
if(u>=1){marbleMode='fall';marbleVelocity=-.25}
}else if(marbleMode==='fall'){
marbleVelocity-=9.8*dt;marble.position.y+=marbleVelocity*dt;
const landing=leverPoint(localBall1);
if(marble.position.y<=landing.y){
marble.position.copy(landing);marbleMode='landed';seeStart=time;fire(3);puff(landing,11,.8);
}
}
if(seeStart!==Infinity){
const age=time-seeStart;
seesaw.rotation.z=.30*smooth(age/.25)+.018*Math.sin(age*14)*Math.exp(-age*2);
if(marbleMode==='landed')marble.position.copy(leverPoint(localBall1));
if(!launchDone&&age>=.19){
launchDone=true;ballMode='flight';ball2.position.copy(leverPoint(localBall2));
const flight=.82;
ballVelocity.set((4.57-ball2.position.x)/flight,(1.67-ball2.position.y+.5*9.8*flight*flight)/flight,0);
puff(ball2.position.clone().add(V(0,-.22,0)),6,.5);
}
}
if(ballMode==='waiting')ball2.position.copy(leverPoint(localBall2));
if(ballMode==='flight'||ballMode==='rebound'){
ballVelocity.y-=9.8*dt;ball2.position.addScaledVector(ballVelocity,dt);ball2.rotation.z-=dt*7;
if(ballMode==='flight'){
const dx=ball2.position.x-HP.x,dy=ball2.position.y-HP.y,c=Math.cos(hammerAngle),s=Math.sin(hammerAngle);
const lx=dx*c+dy*s,ly=-dx*s+dy*c+HL;
const ax=Math.max(0,Math.abs(lx)-.51),ay=Math.max(0,Math.abs(ly)-.275),az=Math.max(0,Math.abs(ball2.position.z)-.43);
if(ax*ax+ay*ay+az*az<=.22*.22){
ballMode='rebound';ballVelocity.set(-1.05,.65,.50);hammerVelocity=1.56;fire(4);puff(ball2.position,13,.85);
}
}
if(ball2.position.y<.23){
ball2.position.y=.23;
if(Math.abs(ballVelocity.y)>.45){ballVelocity.y=-ballVelocity.y*.30;puff(ball2.position,4,.35)}else ballVelocity.y=0;
ballVelocity.x*=.96;ballVelocity.z*=.96;
}
}
if(fired[3]){
hammerVelocity+=(-9.8/HL*Math.sin(hammerAngle)-.055*hammerVelocity)*dt;
hammerAngle+=hammerVelocity*dt;hammer.rotation.z=hammerAngle;
const hx=HP.x+HL*Math.sin(hammerAngle),hy=HP.y-HL*Math.cos(hammerAngle);
if(!hammerHit&&hx+.49>=8.05-.31&&hy-.28<2.65)collapse();
}
for(const b of blocks){
if(b.caught)continue;
if(!b.loose&&time>=b.wake)b.loose=true;
if(!b.loose)continue;
const prevBottom=b.g.position.y-blockSize/2;
b.v.y-=9.8*dt;b.g.position.addScaledVector(b.v,dt);
b.g.rotation.x+=b.w.x*dt;b.g.rotation.y+=b.w.y*dt;b.g.rotation.z+=b.w.z*dt;
if(!bucketLoaded&&b.v.y<0&&prevBottom>=2.0&&b.g.position.y-blockSize/2<=2.0&&Math.hypot(b.g.position.x-10.35,b.g.position.z)<.46){catchBlock(b);continue}
if(b.g.position.y<.32){
b.g.position.y=.32;
if(b.v.y<-.8)puff(b.g.position.clone().setY(.08),5,.60);
b.v.y=Math.abs(b.v.y)>.7?-b.v.y*.26:0;b.v.x*=.78;b.v.z*=.78;b.w.multiplyScalar(.66);
if(b.w.length()<.4){
b.g.rotation.x=THREE.MathUtils.lerp(b.g.rotation.x,Math.round(b.g.rotation.x/(Math.PI/2))*Math.PI/2,.16);
b.g.rotation.z=THREE.MathUtils.lerp(b.g.rotation.z,Math.round(b.g.rotation.z/(Math.PI/2))*Math.PI/2,.16);
}
}
}
for(let i=0;i<blocks.length;i++)for(let j=i+1;j<blocks.length;j++){
const a=blocks[i],b=blocks[j];if(!a.loose||!b.loose||a.caught||b.caught)continue;
const dx=b.g.position.x-a.g.position.x,dy=b.g.position.y-a.g.position.y,dz=b.g.position.z-a.g.position.z;
const px=.60-Math.abs(dx),py=.60-Math.abs(dy),pz=.60-Math.abs(dz);
if(px>0&&py>0&&pz>0){
const axis=py<px&&py<pz?'y':px<pz?'x':'z',delta=b.g.position[axis]-a.g.position[axis];
const overlap=axis==='x'?px:axis==='y'?py:pz,sign=delta>=0?1:-1;
a.g.position[axis]-=sign*overlap*.5;b.g.position[axis]+=sign*overlap*.5;
const relative=(b.v[axis]-a.v[axis])*sign;
if(relative<0){const impulse=-relative*.60;a.v[axis]-=impulse*sign;b.v[axis]+=impulse*sign}
}
}
let lift=0;
if(bucketLoaded){
const age=time-bucketStart;
bucket.rotation.z=.19*Math.exp(-age*1.8)*Math.sin(age*10);
gear.rotation.z-=dt*(time<14.02?3.1:10);
pawl.rotation.z=.20*Math.sin(age*26);
if(time>=14.02){
fire(7);lift=.96*smooth((time-14.02)/.56);
latch.rotation.z=1.45*smooth((time-14.02)/.18);
flagMesh.scale.x=.045+.955*smooth((time-14.02)/.48);
if(lift>.875&&signalStart===Infinity){signalStart=time;puff(V(11.95,3.9,.1),8,.45)}
}
}
bucket.position.y=1.5-lift;flag.position.y=2.95+lift;
wheels[0].rotation.z=lift/.25;wheels[1].rotation.z=lift/.25;
for(const b of blocks)if(b.caught)b.g.position.copy(b.local).applyAxisAngle(V(0,0,1),bucket.rotation.z).add(bucket.position);
const attach=V(0,1.06,0).applyAxisAngle(V(0,0,1),bucket.rotation.z).add(bucket.position);
setRod(ropeLeft,attach,V(10.35,4.58,0));setRod(ropeRight,flag.position.clone().setZ(0),V(11.95,4.58,0));
if(signalStart!==Infinity){
const q=(time-signalStart)/.10;
spark.visible=q<1;spark.position.copy(wireCurve.getPoint(clamp(q)));
contactMat.emissiveIntensity=2;
if(q>=1&&!lampOn){lampOn=true;bulbMat.color.set('#fff0bf');bulbMat.emissiveIntensity=4.5;lampLight.intensity=24;halo.visible=true;puff(bulb.position,8,.25)}
}
for(const p of particles){
if(p.age>=p.life)continue;
p.age+=dt;const u=clamp(p.age/p.life);
p.v.y-=1.6*dt;p.m.position.addScaledVector(p.v,dt);p.m.scale.setScalar(p.size*(.5+u*2.2));p.m.material.opacity=.48*(1-u)*(1-u);
if(u>=1)p.m.visible=false;
}
}

const cameraTarget=V(-5,1.9,0),desiredTarget=V(),desiredCamera=V();
let trailTick=0,uiTick=0;
function display(dt){
if(currentStage<=1){
let lead=main[0];
for(const d of dominoes)if(d.start!==Infinity&&d.p.x>lead.p.x)lead=d;
desiredTarget.set(lead.p.x+.6,2.30,lead.p.x>-6?0:lead.p.z*.40);
desiredCamera.copy(desiredTarget).add(V(1.7,5.5,8.7));
}else if(currentStage===2){
desiredTarget.set(0,2.2,0);desiredCamera.copy(desiredTarget).add(V(3.2,8.9,5.2));
}else if(currentStage===3){
desiredTarget.set(ballMode==='flight'?ball2.position.x-.45:1.65,1.28,0);desiredCamera.copy(desiredTarget).add(V(2.0,3.8,7.6));
}else if(currentStage===4){
desiredTarget.set(6.45,2.62,0);desiredCamera.copy(desiredTarget).add(V(1.4,3.4,8.0));
}else if(currentStage===5){
desiredTarget.set(9.05,1.8,0);desiredCamera.copy(desiredTarget).add(V(1.4,4.0,8.1));
}else{
desiredTarget.set(11.10,2.65,.15);desiredCamera.copy(desiredTarget).add(V(3.0,3.1,8.5));
}
if(camera.aspect<.8)desiredCamera.sub(desiredTarget).multiplyScalar(1.30).add(desiredTarget);
const follow=1-Math.exp(-dt*3.2);
camera.position.lerp(desiredCamera,follow);cameraTarget.lerp(desiredTarget,follow);camera.lookAt(cameraTarget);
const attr=flagGeo.attributes.position;
for(let i=0;i<attr.count;i++){
const x=flagRest[i*3],y=flagRest[i*3+1];
attr.setZ(i,(.045*Math.sin(x*8-time*9)+.020*Math.sin(y*12+time*7))*x*flagMesh.scale.x);
}
attr.needsUpdate=true;flagGeo.computeVertexNormals();
if(lampOn)halo.scale.setScalar(2.45+.12*Math.sin(time*13));
trailTick+=dt;
if((marbleMode==='spiral'||marbleMode==='fall')&&trailTick>.025){
trailTick=0;trailArray.copyWithin(3,0,trailArray.length-3);
trailArray[0]=marble.position.x;trailArray[1]=marble.position.y;trailArray[2]=marble.position.z;
trailCount=Math.min(35,trailCount+1);trailGeo.setDrawRange(0,trailCount);trailGeo.attributes.position.needsUpdate=true;trail.visible=true;
}else if(marbleMode==='landed')trail.visible=false;
uiTick+=dt;
if(uiTick>.045){
uiTick=0;document.getElementById('time').textContent=time.toFixed(2).padStart(5,'0');
document.getElementById('progress').style.width=`${time/PERIOD*100}%`;
let detail='S-CURVE → PARALLEL ARMS → SHARED BRIDGE';
if(currentStage===2)detail='2.65 ORBITS / GRAVITY-FED FUNNEL';
if(currentStage===3)detail='IMPACT → ROTATION → BALLISTIC FLIGHT';
if(currentStage===4)detail='BALL IMPULSE → PENDULUM → STACK';
if(currentStage===5)detail='TWELVE RIGID BODIES / ONE WAITING BUCKET';
if(currentStage===6)detail=`LOAD CAPTURED / ESCAPEMENT RELEASE IN ${Math.max(0,14.02-time).toFixed(1)} s`;
if(currentStage===7)detail=lampOn?'CIRCUIT CLOSED / ALL SEVEN STAGES COMPLETE':'COUNTERWEIGHT DESCENDING / FLAG CONTACT APPROACHING';
document.getElementById('detail').textContent=detail;
}
document.getElementById('shutter').style.opacity=String(time<.18?1-smooth(time/.18):smooth((time-14.86)/.14));
renderer.render(scene,camera);
}
addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
reset();
let previous=performance.now(),accumulator=0;
function animate(now){
requestAnimationFrame(animate);
const dt=Math.min((now-previous)/1000,.05);previous=now;accumulator+=dt;
while(accumulator>=STEP){update(STEP);accumulator-=STEP}
display(dt);
}
requestAnimationFrame(animate);
</script>
