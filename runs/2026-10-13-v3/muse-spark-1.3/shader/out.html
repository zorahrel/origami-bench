<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raymarch Morph SDF</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100vw;height:100vh}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const uniforms = { iTime:{value:0}, iResolution:{value:new THREE.Vector2(window.innerWidth, window.innerHeight)} };
const mat = new THREE.ShaderMaterial({
uniforms,
vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}`,
fragmentShader:`
varying vec2 vUv;
uniform float iTime;
uniform vec2 iResolution;
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float sdSphere(vec3 p,float r){return length(p)-r;}
float sdBox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0);}
float sdTorus(vec3 p,vec2 t){vec2 q=vec2(length(p.xz)-t.x,p.y);return length(q)-t.y;}
float sdCapsule(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,pba=b-a;float h=clamp(dot(pa,pba)/dot(pba,pba),0.0,1.0);return length(pa-pba*h)-r;}
float sdCylinder(vec3 p,float r,float h){vec2 d=abs(vec2(length(p.xz),p.y))-vec2(r,h);return min(max(d.x,d.y),0.0)+length(max(d,0.0));}
float sdOct(vec3 p,float s){p=abs(p);return (p.x+p.y+p.z-s)*0.57735027;}
float smin(float a,float b,float k){float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0);return mix(b,a,h)-k*h*(1.0-h);}
float hash21(vec2 p){p=fract(p*vec2(234.34,435.345));p+=dot(p,p+34.23);return fract(p.x*p.y);}
vec2 map(vec3 p){
 float t=iTime*0.5;
 float k=0.35+0.15*sin(iTime*0.8);
 vec3 c1=vec3(sin(t)*1.2,1.15+0.3*sin(iTime*1.3),cos(t)*1.2);
 float d1=sdSphere(p-c1,0.7);
 vec3 q2=p-vec3(cos(t*0.8+1.0)*1.9,1.05+0.25*sin(iTime),sin(t*0.8+1.0)*1.9);
 q2.xz=rot(t*0.9)*q2.xz; q2.xy=rot(t*0.6)*q2.xy;
 float d2=sdTorus(q2,vec2(0.5,0.16));
 vec3 q3=p-vec3(sin(t*0.6+2.0)*1.6,1.35+0.3*cos(iTime*0.9),cos(t*0.6+2.0)*1.6);
 q3.xz=rot(t)*q3.xz; q3.xy=rot(t*0.7)*q3.xy;
 float d3=sdBox(q3,vec3(0.45));
 vec3 c4=vec3(sin(t*0.7+4.0)*1.4,1.2,cos(t*0.7+4.0)*1.4);
 float d4=sdCapsule(p,c4+vec3(0.0,-0.4,0.0),c4+vec3(0.3*sin(iTime),0.45,0.3*cos(iTime)),0.22);
 vec3 c5=vec3(cos(t*0.65+5.2)*1.7,0.85,sin(t*0.65+5.2)*1.7);
 float d5=sdCylinder(p-c5,0.34,0.5);
 vec3 c6=vec3(sin(t*0.55+3.0)*1.1,1.9+0.4*sin(iTime*1.1),cos(t*0.55+3.0)*1.1);
 vec3 q6=p-c6; q6.xz=rot(iTime*0.5)*q6.xz;
 float d6=sdOct(q6,0.62);
 float d=d1; float m=1.0;
 float d02=smin(d,d2,k); m=(d02==d)?m:2.0; d=d02;
 float d03=smin(d,d3,k); if(d03<d){m=3.0;} d=d03;
 float d04=smin(d,d4,k); if(d04<d){m=4.0;} d=d04;
 float d05=smin(d,d5,k); if(d05<d){m=5.0;} d=d05;
 float d06=smin(d,d6,k); if(d06<d){m=6.0;} d=d06;
 float df=p.y;
 if(df<d){d=df;m=0.0;}
 return vec2(d,m);
}
vec2 castRay(vec3 ro,vec3 rd){
 float t=0.0; float m=-1.0;
 for(int i=0;i<96;i++){
  vec3 p=ro+rd*t;
  vec2 h=map(p);
  if(abs(h.x)<0.0015){m=h.y;break;}
  t+=h.x*0.9;
  if(t>40.0)break;
 }
 if(t>40.0)t=-1.0;
 return vec2(t,m);
}
vec3 calcNormal(vec3 p){
 vec2 e=vec2(0.0015,0.0);
 return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x,map(p+e.yxy).x-map(p-e.yxy).x,map(p+e.yyx).x-map(p-e.yyx).x));
}
float softShadow(vec3 ro,vec3 rd){
 float res=1.0; float t=0.02; float ph=1e10;
 for(int i=0;i<32;i++){
  float h=map(ro+rd*t).x;
  if(h<0.001)return 0.0;
  float y=h*h/(2.0*ph); float d=sqrt(h*h-y*y);
  res=min(res,12.0*d/max(0.0,t-y));
  ph=h; t+=h; if(res<0.005||t>12.0)break;
 }
 return clamp(res,0.0,1.0);
}
float calcAO(vec3 p,vec3 n){
 float occ=0.0; float sca=1.0;
 for(int i=0;i<5;i++){float h=0.01+0.12*float(i)/4.0;float d=map(p+n*h).x;occ+=(h-d)*sca;sca*=0.95;}
 return clamp(1.0-3.0*occ,0.0,1.0);
}
vec3 baseColor(float m,vec3 p){
 if(m<0.5){float c=mod(floor(p.x*1.5)+floor(p.z*1.5),2.0);return mix(vec3(0.08,0.09,0.12),vec3(0.85,0.87,0.9),c);}
 if(m<1.5)return vec3(0.9,0.2,0.1);
 if(m<2.5)return vec3(0.1,0.6,0.9);
 if(m<3.5)return vec3(0.2,0.9,0.4);
 if(m<4.5)return vec3(0.95,0.8,0.2);
 if(m<5.5)return vec3(0.7,0.3,0.95);
 return vec3(0.2,0.9,0.85);
}
vec3 shade(vec3 p,vec3 n,float m,vec3 rd,vec3 ro){
 vec3 alb=baseColor(m,p);
 vec3 lp=vec3(4.0,6.0,2.5);
 vec3 ld=normalize(lp-p);
 float dif=clamp(dot(n,ld),0.0,1.0);
 float sh=softShadow(p+n*0.002,ld);
 float ao=calcAO(p,n);
 vec3 hv=normalize(ld-rd);
 float spec=pow(clamp(dot(n,hv),0.0,1.0),48.0);
 vec3 col=alb*(0.25+0.35*ao);
 col+=alb*dif*sh*1.4;
 col+=vec3(1.0,0.95,0.85)*spec*sh*(m<0.5?0.9:0.5);
 float fres=pow(1.0-clamp(dot(n,-rd),0.0,1.0),3.0);
 col+=fres*vec3(0.3,0.6,1.0)*0.8;
 if(m>0.5&&m<1.5){
  float w=sin(p.x*12.0)*sin(p.y*12.0+1.3)*sin(p.z*12.0+0.7);
  float pulse=0.5+0.5*sin(iTime*3.0);
  float crack=smoothstep(0.75,0.99,sin(w*5.0+iTime*1.5)*0.5+0.5);
  crack=pow(crack,2.0)*(0.6+0.9*pulse);
  col+=crack*vec3(1.0,0.22,0.03)*3.0;
  col+=pulse*0.15*vec3(1.0,0.3,0.05);
 }
 if(m>5.5&&m<6.5){col+=vec3(0.1,0.8,0.7)*0.35*(0.5+0.5*sin(iTime*2.0+p.y*4.0));}
 return col;
}
vec3 aces(vec3 x){return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0);}
void main(){
 vec2 fc=vUv*iResolution;
 vec2 uv=(2.0*fc-iResolution)/min(iResolution.x,iResolution.y);
 float ct=iTime*0.22;
 float R=5.6+1.0*sin(iTime*0.13);
 float hy=2.4+1.5*sin(iTime*0.21)-0.9*sin(iTime*0.09+1.0);
 vec3 ro=vec3(cos(ct)*R,clamp(hy,0.7,4.5),sin(ct)*R);
 vec3 ta=vec3(0.0,0.95+0.2*sin(iTime*0.4),0.0);
 vec3 fw=normalize(ta-ro);
 vec3 rt=normalize(cross(fw,vec3(0.0,1.0,0.0)));
 vec3 up=cross(rt,fw);
 vec3 rd=normalize(uv.x*rt+uv.y*up+1.9*fw);
 vec3 fogC=vec3(0.03,0.04,0.08);
 vec3 col=fogC;
 vec2 r1=castRay(ro,rd);
 float dust=0.0;
 if(r1.x>0.0){
  vec3 p=ro+rd*r1.x;
  vec3 n=calcNormal(p);
  if(r1.y<0.5){vec2 cp=vec2(p.x,p.z);float b=0.06*exp(-0.25*r1.x);n=normalize(n+vec3(sin(cp.x*40.0)*b,0.0,sin(cp.y*40.0)*b));}
  col=shade(p,n,r1.y,rd,ro);
  float refl=(r1.y<0.5)?0.75:0.35;
  vec3 rro=p+n*0.004;
  vec3 rrd=reflect(rd,n);
  vec2 r2=castRay(rro,rrd);
  vec3 rcol=fogC*0.6+0.15*vec3(0.4,0.6,1.0);
  if(r2.x>0.0){
   vec3 p2=rro+rrd*r2.x;
   vec3 n2=calcNormal(p2);
   rcol=shade(p2,n2,r2.y,rrd,rro);
   rcol=mix(rcol,fogC,1.0-exp(-0.045*r2.x*r2.x*0.2-0.02*r2.x));
  } else {
   float s=hash21(floor(rrd.xz/max(0.05,rrd.y)*180.0));
   if(s>0.985)rcol+=vec3(0.9)*1.5;
  }
  float fres=pow(1.0-clamp(dot(n,-rd),0.0,1.0),3.0);
  float fw2=0.25+0.75*fres;
  col=mix(col,rcol,clamp(refl*fw2+((r1.y<0.5)?0.35:0.0),0.0,0.85));
  col=mix(col,fogC,1.0-exp(-0.028*r1.x*r1.x*0.12-0.015*r1.x));
 } else {
  vec2 sp=rd.xz/(abs(rd.y)+0.25)*60.0;
  float st=hash21(floor(sp));
  vec2 fpos=fract(sp)-0.5;
  float star=smoothstep(0.12,0.0,length(fpos))*step(0.978,st)*smoothstep(-0.05,0.25,rd.y+0.4);
  col+=star*vec3(0.9,0.95,1.0)*(0.5+0.5*sin(iTime*2.0+st*40.0));
  col+=pow(clamp(1.0-length(uv)*0.55,0.0,1.0),2.0)*vec3(0.10,0.12,0.22);
 }
 float asp=iResolution.x/iResolution.y;
 for(int i=0;i<2;i++){
  float fi=float(i);
  float spd=0.35+0.3*fi;
  vec2 guv=vec2(fc.x/iResolution.x*asp*(14.0+8.0*fi),fc.y/iResolution.y*(10.0+6.0*fi)-iTime*spd);
  vec2 id=floor(guv);
  vec2 f=fract(guv)-0.5;
  float h=hash21(id+fi*17.0);
  vec2 off=vec2(hash21(id+3.1)-0.5,hash21(id+7.7)-0.5)*0.7;
  float d=length(f-off);
  float tw=0.5+0.5*sin(iTime*(2.0+fi)+h*40.0);
  float spark=smoothstep(0.10,0.0,d)*step(0.90,h)*tw;
  dust+=spark*(fi<0.5?1.0:0.6);
 }
 col+=dust*vec3(1.0,0.6,0.25)*0.9;
 col=aces(col*1.15);
 col=pow(clamp(col,0.0,1.0),vec3(1.0/2.2));
 float vig=1.0-dot(uv*0.5,uv*0.5)*0.55;
 col*=clamp(vig,0.0,1.0);
 col+= (hash21(fc+mod(iTime*60.0,10.0))-0.5)*0.035;
 gl_FragColor=vec4(col,1.0);
}`
});
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat);
scene.add(quad);
window.addEventListener('resize', () => {
renderer.setSize(window.innerWidth, window.innerHeight);
uniforms.iResolution.value.set(window.innerWidth, window.innerHeight);
});
const clock = new THREE.Clock();
function tick(){
uniforms.iTime.value = clock.getElapsedTime();
renderer.render(scene, cam);
requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
