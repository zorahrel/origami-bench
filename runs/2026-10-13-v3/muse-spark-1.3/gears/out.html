 // escape wheel: dwell + jump each second
 const eN=Math.floor(el),eF=el-eN,eE=S(0.06,0.2,eF);
 escWheel.rotation.z=-(eN+eE)/30*TAU;
 // dial hands at exact ratios (second hand deadbeats with escapement)
 const sT=el+TOFF,nS=Math.floor(sT),fS=sT-nS,eSec=S(0.04,0.16,fS);
 secH.rotation.z=-(nS+eSec)/60*TAU;
 minH.rotation.z=-sT/3600*TAU;
 hourH.rotation.z=-sT/43200*TAU;
 // hammer cam: 1 rev per 5 s -> strike on every 5th tick
 const camA=M*12;cam1.rotation.z=-camA;
 let ph=((camA%TAU)+TAU)%TAU/TAU;
 let lift=ph<0.9?ph/0.9*0.34:(ph<0.96?0.34*(1-(ph-0.9)/0.06):0);
 follower.position.set(CAM1.x,CAM1.y+0.42+lift+0.6,CAM1.z);
 hammer.rotation.z=0.55-lift*2.4;
 const phAge=(ph-0.96+1)%1,sD=phAge*5;
 const dk=Math.exp(-2.6*sD);
 bellG.rotation.z=0.14*dk*Math.sin(42*sD);
 bellG.position.y=BELL.y+0.02*dk*Math.abs(Math.sin(30*sD));
 flashRing.scale.setScalar(1+sD*1.8);
 flashRing.material.opacity=0.85*Math.exp(-3.2*sD);
 bellLight.intensity=34*Math.exp(-4.5*sD);
 // figure cam: 1 rev per 2 s, legs antiphase via linkages
 const C2=15*M+1.0;cam2.rotation.z=-C2;
 const sL=0.5*Math.sin(C2),sR=0.5*Math.sin(C2+Math.PI);
 legL.rotation.z=sL;legR.rotation.z=sR;
 vA.set(CAM2.x+Math.cos(C2)*0.14,CAM2.y+Math.sin(C2)*0.14,CAM2.z+0.07);
 vB.set(FX-0.05+Math.sin(-sL)*0.55,FY+0.06+0.72-Math.cos(sL)*0.55+0.25,FZ+0.09);
 setRod(rodL,vA,vB);
 vA.set(CAM2.x+Math.cos(C2+Math.PI)*0.14,CAM2.y+Math.sin(C2+Math.PI)*0.14,CAM2.z+0.07);
 vC.set(FX-0.05+Math.sin(-sR)*0.55,FY+0.06+0.72-Math.cos(sR)*0.55+0.25,FZ-0.09);
 setRod(rodR,vA,vC);
 // orrery 1:4
 const a1=M*2+0.5,a2=M*8+0.5;
 arm1.position.set(OX,OY,OZ);arm1.rotation.y=-a1;
 arm1.geometry.computeBoundingSphere();
 pl1.position.set(OX+Math.cos(a1)*0.62,OY,OZ-Math.sin(a1)*0.62);
 arm2.position.set(OX,OY,OZ);arm2.rotation.y=-a2;
 pl2.position.set(OX+Math.cos(a2)*1.12,OY,OZ-Math.sin(a2)*1.12);
 // dust drift + slow camera push-in, both from master clock
 const pa=dGeo.attributes.position;
 for(let i=0;i<DN;i++){const b=dBase[i],p=dPh[i];
  pa.array[i*3]=b[0]+0.25*Math.sin(M*4+p);
  pa.array[i*3+1]=-3+((b[1]+3+el*dSp[i])%7);
  pa.array[i*3+2]=b[2]+0.15*Math.cos(M*3+p);}
 pa.needsUpdate=true;
 const push=Math.min(3.1,el*0.04);
 camera.position.set(0.7*Math.sin(M*3),0.75+0.32*Math.sin(M*4+1),13.6-push);
 camera.lookAt(0,0.55,0);
 const tickN=Math.floor(el);
 if(tickN%10===0)hud.textContent='MASTER '+(M%TAU).toFixed(2)+' rad · tick '+tickN+' · 13 gears · escapement 1 Hz · bell /5';
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);
</script>
