<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orrery automa</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0d0b09}
canvas{display:block}
</style>
</head>
<body>
<script type="module">
// Un solo angolo master: θ = 2π·t/60 s, un giro al minuto. Ingranaggi, pendolo,
// martello, pianeti, figura, polvere e camera sono tutti funzioni di θ.
// Layout: quadrante sopra, letto degli ingranaggi a metà, pilastri sul fondo.
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const T0 = performance.now();
const TAU = Math.PI * 2;
const MOD = 0.06; // modulo comune: due ruote si ingranano solo se hanno lo stesso m

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0b09);
scene.fog = new THREE.Fog(0x0d0b09, 22, 44);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 120);

// Ambiente finto: piccola scena emissiva (cielo caldo + softbox) passata a PMREM.
const envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(30, 32, 16),
  new THREE.MeshBasicMaterial({ color: 0x3b342c, side: THREE.BackSide })));
for (const [x, y, z, s] of [[0, 18, 0, 10], [-16, 8, 12, 6], [16, 6, -10, 7]]) {
  const p = new THREE.Mesh(new THREE.PlaneGeometry(s, s),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(3, 2.8, 2.5), side: THREE.DoubleSide }));
  p.position.set(x, y, z);
  p.lookAt(0, 0, 0);
  envScene.add(p);
}
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(envScene, 0.04).texture;
scene.add(new THREE.HemisphereLight(0xfff0d8, 0x1a120c, 0.5));

const mat = {
  brass: new THREE.MeshStandardMaterial({ color: 0xc9a04a, metalness: 1, roughness: 0.3 }),
  steel: new THREE.MeshStandardMaterial({ color: 0xb8c0c8, metalness: 1, roughness: 0.25 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x2b241e, metalness: 0.5, roughness: 0.55 }),
  stone: new THREE.MeshStandardMaterial({ color: 0x5a4d40, metalness: 0.1, roughness: 0.8 }),
  ruby: new THREE.MeshStandardMaterial({ color: 0xaa2030, metalness: 0.2, roughness: 0.3 }),
  bell: new THREE.MeshStandardMaterial({ color: 0xd9a858, metalness: 1, roughness: 0.2,
    emissive: 0xff8a2a, emissiveIntensity: 0, side: THREE.DoubleSide }),
};
const mesh = (geo, m, parent = scene) => { const o = new THREE.Mesh(geo, m); parent.add(o); return o; };

// Profilo a denti quadri: quattro passi per dente, due in testa e due alla radice.
function gearGeo(N) {
  const s = new THREE.Shape(), r0 = MOD * N / 2, h = MOD * 0.45;
  for (let i = 0; i < 4 * N; i++) {
    const a = i / (4 * N) * TAU, r = r0 + (i % 4 < 2 ? h : -h);
    if (i) s.lineTo(r * Math.cos(a), r * Math.sin(a));
    else s.moveTo(r * Math.cos(a), r * Math.sin(a));
  }
  s.closePath();
  const hole = new THREE.Path();
  hole.absarc(0, 0, r0 * 0.3, 0, TAU, true); // foro per l'albero, winding opposto
  s.holes.push(hole);
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.06, bevelEnabled: false });
  return g.rotateX(-Math.PI / 2); // disco nel piano XZ, spessore verso l'alto
}

// Treno: k = giri per θ, con segno. Contatto esterno: k' = −k·Np/Nc (verso opposto).
// Coassiale: stesso perno e stesso k, un piano sopra.
const train = [];
function gear(N, parent = null, ang = 0, coax = false) {
  let g;
  if (!parent) g = { N, x: 0, z: 0, y: 0.25, k: 1 };
  else if (coax) g = { N, x: parent.x, z: parent.z, y: parent.y + 0.14, k: parent.k };
  else {
    const d = MOD * (parent.N + N) / 2;
    g = { N, x: parent.x + d * Math.cos(ang), z: parent.z + d * Math.sin(ang),
      y: parent.y, k: -parent.k * parent.N / N };
  }
  train.push(g);
  return g;
}
const E = gear(60);                       // scappamento: 60 denti, un giro al minuto
const PE = gear(8, E, 0, true);
const W = gear(40, PE, 0);
const PW = gear(10, W, 0, true);
const W2 = gear(40, PW, -Math.PI / 2);
const PW2 = gear(10, W2, 0, true);
const IDL = gear(20, PW2, Math.PI);       // folle: due contatti, il verso torna giusto
const MIN = gear(30, IDL, -Math.PI / 2);  // k = 1/60
const PM = gear(10, MIN, 0, true);
const H1 = gear(30, PM, Math.PI / 2);
const PH1 = gear(8, H1, 0, true);
const H = gear(32, PH1, Math.PI / 4);     // k = 1/720
const CAM = gear(5, E, 2.6);              // martello: un giro ogni 5 s
const CAM2 = gear(10, E, -2.2);           // gambe: un giro ogni 10 s
for (const g of train) {
  g.obj = new THREE.Group();
  g.obj.position.set(g.x, g.y, g.z);
  scene.add(g.obj);
  mesh(gearGeo(g.N), g.N <= 10 ? mat.steel : mat.brass, g.obj);
}
// Camma eccentrica sopra la ruota da 5: il bilanciere la segue.
mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.05, 24), mat.steel, CAM.obj).position.set(0.1, 0.085, 0);

// Letto, binario della figura, pilastri sul fondo.
mesh(new THREE.CylinderGeometry(6.8, 6.8, 0.2, 96), mat.stone).position.y = 0.1;
const rail = mesh(new THREE.TorusGeometry(5.6, 0.035, 8, 160), mat.brass);
rail.rotation.x = Math.PI / 2;
rail.position.y = 0.21;
for (const a of [-0.5, 0.5, -0.95, 0.95]) {
  mesh(new THREE.CylinderGeometry(0.2, 0.26, 3.2, 20), mat.steel)
    .position.set(6.3 * Math.sin(a), 1.6, -6.3 * Math.cos(a));
}

// Quadrante ad anello con dodici indici; le lancette stanno al centro.
const dial = mesh(new THREE.RingGeometry(1.95, 2.7, 96), mat.dark);
dial.rotation.x = -Math.PI / 2;
dial.position.y = 1.25;
for (let i = 0; i < 12; i++) {
  const a = i * Math.PI / 6, tick = mesh(new THREE.BoxGeometry(0.1, 0.03, 0.26), mat.brass);
  tick.position.set(2.35 * Math.sin(a), 1.27, 2.35 * Math.cos(a));
  tick.rotation.y = a;
}
const hand = (len, w, m, y) => {
  const g = new THREE.Group();
  g.position.y = y;
  scene.add(g);
  mesh(new THREE.BoxGeometry(w, 0.03, len), m, g).position.z = len / 2;
  return g;
};
const hSec = hand(2.3, 0.035, mat.ruby, 1.52);
const hMin = hand(1.9, 0.06, mat.steel, 1.46);
const hHour = hand(1.35, 0.1, mat.brass, 1.4);
mesh(new THREE.CylinderGeometry(0.07, 0.07, 1.3, 16), mat.brass).position.y = 0.9;

// Campana e martello.
const bellG = new THREE.Group();
bellG.position.set(-4.3, 0.2, 0.6);
scene.add(bellG);
const bp = [];
for (let i = 0; i <= 12; i++) {
  const u = i / 12;
  bp.push(new THREE.Vector2(0.14 + 0.36 * u ** 1.6, 0.95 * (1 - u)));
}
mesh(new THREE.LatheGeometry(bp, 28), mat.bell, bellG);
const bellLight = new THREE.PointLight(0xffa040, 0, 4);
bellLight.position.set(-4.3, 1.0, 0.6);
scene.add(bellLight);
const hamG = new THREE.Group();
hamG.position.set(-3.25, 0.85, 0.6);
scene.add(hamG);
mesh(new THREE.BoxGeometry(0.8, 0.07, 0.07), mat.steel, hamG).position.x = -0.4;
mesh(new THREE.SphereGeometry(0.1, 16, 12), mat.dark, hamG).position.x = -0.8;

// Pendolo e ancora sull'asse della ruota di scappamento.
const pivot = new THREE.Group();
pivot.position.set(-2.5, 2.9, -1.6);
scene.add(pivot);
mesh(new THREE.CylinderGeometry(0.03, 0.03, 2.4, 8), mat.steel, pivot).position.y = -1.2;
mesh(new THREE.SphereGeometry(0.22, 24, 16), mat.brass, pivot).position.y = -2.4;
const anchor = new THREE.Group();
anchor.position.set(-1.95, 0.3, 0);
scene.add(anchor);
mesh(new THREE.BoxGeometry(0.12, 0.05, 1.0), mat.steel, anchor);

// Pianeti sopra il quadrante: esterno θ, interno 4θ.
mesh(new THREE.SphereGeometry(0.2, 24, 16), mat.brass).position.set(0, 2.7, 0);
const armO = new THREE.Group(), armI = new THREE.Group();
armO.position.y = 2.7;
armI.position.y = 2.7;
scene.add(armO, armI);
mesh(new THREE.SphereGeometry(0.2, 24, 16), mat.steel, armO).position.x = 1.6;
mesh(new THREE.SphereGeometry(0.12, 24, 16), mat.ruby, armI).position.x = 0.8;

// Camminatore: primitive, gambe guidate dalla camma CAM2 con angoli di anca e ginocchio.
const walker = new THREE.Group();
scene.add(walker);
mesh(new THREE.BoxGeometry(0.26, 0.36, 0.16), mat.brass, walker).position.y = 0.78;
mesh(new THREE.SphereGeometry(0.11, 20, 14), mat.steel, walker).position.y = 1.07;
const legs = [-0.07, 0.07].map((x) => {
  const hip = new THREE.Group();
  hip.position.set(x, 0.6, 0);
  walker.add(hip);
  mesh(new THREE.BoxGeometry(0.09, 0.32, 0.09), mat.dark, hip).position.y = -0.16;
  const knee = new THREE.Group();
  knee.position.y = -0.32;
  hip.add(knee);
  mesh(new THREE.BoxGeometry(0.08, 0.3, 0.08), mat.steel, knee).position.y = -0.15;
  return { hip, knee };
});

// Polvere: sprite radiale su Points, ruotata intera da θ.
const cv = document.createElement('canvas');
cv.width = cv.height = 64;
const cx = cv.getContext('2d');
const gr = cx.createRadialGradient(32, 32, 0, 32, 32, 32);
gr.addColorStop(0, 'rgba(255,236,200,1)');
gr.addColorStop(1, 'rgba(255,236,200,0)');
cx.fillStyle = gr;
cx.fillRect(0, 0, 64, 64);
const dpos = new Float32Array(240 * 3);
for (let i = 0; i < 240; i++) {
  dpos[3 * i] = (Math.random() - 0.5) * 14;
  dpos[3 * i + 1] = Math.random() * 4 + 0.5;
  dpos[3 * i + 2] = (Math.random() - 0.5) * 14;
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dpos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  map: new THREE.CanvasTexture(cv), size: 0.12, transparent: true, opacity: 0.6, depthWrite: false,
}));
scene.add(dust);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function frame() {
  const th = TAU * (performance.now() - T0) / 60000; // angolo master: un giro al minuto
  const t = 60 * th / TAU;                           // secondi, derivati da θ

  for (const g of train) g.obj.rotation.y = g.k * th;
  hSec.rotation.y = th;
  hMin.rotation.y = th / 60;
  hHour.rotation.y = th / 720;

  // Pendolo e ancora: periodo 2 s, passa lo zero a ogni tick (sin 30θ = sin πt).
  const sw = Math.sin(30 * th);
  pivot.rotation.z = 0.32 * sw;
  anchor.rotation.y = 0.35 * sw;

  // Martello: la camma lo alza in 5 s, cade sulla campana a ogni tick multiplo di 5.
  const s = t % 5;
  hamG.rotation.z = -0.7 * Math.min(1, Math.max(0, (s - 0.12) / 4.6));
  const flash = Math.exp(-3 * s);
  bellG.rotation.z = 0.12 * Math.exp(-1.4 * s) * Math.sin(2 * Math.PI * 2.6 * s);
  mat.bell.emissiveIntensity = flash * 0.8;
  bellLight.intensity = flash * 4;

  armO.rotation.y = th;
  armI.rotation.y = 4 * th;

  // Figura: un giro in 10 minuti sul binario, orientata lungo la tangente.
  const phi = th / 10;
  walker.position.set(5.6 * Math.cos(phi), 0.2, 5.6 * Math.sin(phi));
  walker.rotation.y = -phi;
  const a = CAM2.k * th;
  legs.forEach((L, i) => {
    const p = a + i * Math.PI;
    L.hip.rotation.x = -0.4 * Math.sin(p);
    L.knee.rotation.x = 0.45 * (1 - Math.cos(p)) / 2;
  });

  // Polvere e camera: deriva laterale e push-in lento, sempre da θ.
  dust.rotation.y = th * 0.04;
  const push = 1 - 0.12 * (1 - Math.cos(th / 8)) / 2;
  camera.position.set(0.5 * Math.sin(th * 0.5), 9.2 + 0.3 * Math.cos(th * 0.25), 15.5 * push);
  camera.lookAt(0, 0.8, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
