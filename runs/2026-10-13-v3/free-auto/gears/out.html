<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clockwork Orrery Automaton</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050302;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

        // --- SCENE, CAMERA, RENDERER ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050302, 0.015);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 22);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffedd0, 0.4);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xfff5e6, 2.2);
        mainLight.position.set(10, 15, 12);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.bias = -0.0005;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x88bbff, 0.8);
        fillLight.position.set(-15, 5, -5);
        scene.add(fillLight);

        const warmGlow = new THREE.PointLight(0xffaa33, 1.5, 10);
        warmGlow.position.set(0, 2, 4);
        scene.add(warmGlow);

        // --- PROCEDURAL MATERIALS (PBR-ish) ---
        const brassMat = new THREE.MeshStandardMaterial({
            color: 0xd4af37,
            metalness: 0.9,
            roughness: 0.25,
            flatShading: false
        });

        const copperMat = new THREE.MeshStandardMaterial({
            color: 0xb87333,
            metalness: 0.85,
            roughness: 0.3
        });

        const steelMat = new THREE.MeshStandardMaterial({
            color: 0xcccccc,
            metalness: 0.95,
            roughness: 0.2
        });

        const darkIronMat = new THREE.MeshStandardMaterial({
            color: 0x222428,
            metalness: 0.8,
            roughness: 0.5
        });

        const goldMat = new THREE.MeshStandardMaterial({
            color: 0xffd700,
            metalness: 1.0,
            roughness: 0.15
        });

        const ivoryMat = new THREE.MeshStandardMaterial({
            color: 0xf5f2eb,
            metalness: 0.05,
            roughness: 0.6
        });

        const rubyMat = new THREE.MeshStandardMaterial({
            color: 0xcc0022,
            metalness: 0.1,
            roughness: 0.1,
            transmission: 0.6,
            thickness: 0.5
        });

        const woodMat = new THREE.MeshStandardMaterial({
            color: 0x3d2314,
            roughness: 0.7,
            metalness: 0.05
        });

        // --- PROCEDURAL GEOMETRY GENERATORS ---

        // Gear Geometry Generator with correct teeth profile approximation
        function createGearGeometry(teeth, radius) {
            const shape = new THREE.Shape();
            const outerRadius = radius;
            const rootRadius = radius * 0.82;
            const toothDepth = outerRadius - rootRadius;

            for (let i = 0; i < teeth; i++) {
                const theta = (i / teeth) * Math.PI * 2;
                const nextTheta = ((i + 1) / teeth) * Math.PI * 2;
                const angleStep = (nextTheta - theta);

                const a1 = theta;
                const a2 = theta + angleStep * 0.25;
                const a3 = theta + angleStep * 0.4;
                const a4 = theta + angleStep * 0.6;
                const a5 = theta + angleStep * 0.75;
                const a6 = nextTheta;

                // Root to tip
                if (i === 0) {
                    shape.moveTo(Math.cos(a1) * rootRadius, Math.sin(a1) * rootRadius);
                }
                shape.lineTo(Math.cos(a2) * outerRadius, Math.sin(a2) * outerRadius);
                shape.lineTo(Math.cos(a3) * outerRadius, Math.sin(a3) * outerRadius);
                shape.lineTo(Math.cos(a4) * rootRadius, Math.sin(a4) * rootRadius);
                shape.lineTo(Math.cos(a5) * rootRadius, Math.sin(a5) * rootRadius);
                shape.lineTo(Math.cos(a6) * rootRadius, Math.sin(a6) * rootRadius);
            }

            // Center hole
            const holePath = new THREE.Path();
            const holeRadius = radius * 0.15;
            holePath.absarc(0, 0, holeRadius, 0, Math.PI * 2, true);
            shape.holes.push(holePath);

            const extrudeSettings = {
                steps: 1,
                depth: radius * 0.12,
                bevelEnabled: true,
                bevelThickness: radius * 0.02,
                bevelSize: radius * 0.02,
                bevelSegments: 2
            };

            const geom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            geom.center();
            return geom;
        }

        // --- ASSEMBLE AUTOMATON STRUCTURE ---
        const automatonGroup = new THREE.Group();
        scene.add(automatonGroup);

        // Base frame / Wooden chassis
        const baseGeom = new THREE.BoxGeometry(16, 0.8, 8);
        const base = new THREE.Mesh(baseGeom, woodMat);
        base.position.set(0, -5.4, 0);
        base.receiveShadow = true;
        automatonGroup.add(base);

        // Back Plate (Gear Bed)
        const plateGeom = new THREE.BoxGeometry(15, 9, 0.4);
        const backPlate = new THREE.Mesh(plateGeom, brassMat);
        backPlate.position.set(0, 0, -2);
        backPlate.castShadow = true;
        backPlate.receiveShadow = true;
        automatonGroup.add(backPlate);

        // Pillars connecting plates
        const pillarGeo = new THREE.CylinderGeometry(0.2, 0.2, 4, 16);
        [-6.5, 6.5].forEach(x => {
            [-3.5, 3.5].forEach(z => {
                const p = new THREE.Mesh(pillarGeo, steelMat);
                p.position.set(x, 0, z);
                p.rotation.x = Math.PI / 2;
                automatonGroup.add(p);
            });
        });

        // --- GEAR TRAIN SETUP (12+ Gears with Teeth Counts) ---
        // Master Driver (Gear 1): 48 teeth
        // Meshes with Gear 2: 24 teeth (opposite rotation)
        // Gear 2 shares shaft with Gear 3: 40 teeth
        // Meshes with Gear 4: 20 teeth
        // Gear 4 shares shaft with Gear 5: 36 teeth
        // Meshes with Gear 6: 18 teeth
        // Gear 6 shares shaft with Gear 7: 32 teeth
        // Meshes with Gear 8: 16 teeth (Escapement crown-like / fast gear)
        // Plus auxiliary gears for hands, orrery, and cams (Gears 9, 10, 11, 12, 13)

        const gearsData = [
            { id: 1, teeth: 48, radius: 3.0, x: -3.0, y: 1.0, z: -1.2, mat: brassMat },       // Master
            { id: 2, teeth: 24, radius: 1.5, x: -0.3, y: 1.0, z: -1.2, mat: copperMat },      // Meshes 1
            { id: 3, teeth: 40, radius: 2.5, x: -0.3, y: 1.0, z: -1.5, mat: brassMat },      // Co-axial with 2
            { id: 4, teeth: 20, radius: 1.3, x: 2.0,  y: 1.8, z: -1.5, mat: steelMat },      // Meshes 3
            { id: 5, teeth: 36, radius: 2.3, x: 2.0,  y: 1.8, z: -1.8, mat: copperMat },     // Co-axial with 4
            { id: 6, teeth: 18, radius: 1.2, x: 4.4,  y: 1.1, z: -1.8, mat: brassMat },      // Meshes 5
            { id: 7, teeth: 32, radius: 2.0, x: 4.4,  y: 1.1, z: -2.1, mat: steelMat },      // Co-axial with 6
            { id: 8, teeth: 16, radius: 1.0, x: 6.0,  y: -0.3,z: -2.1, mat: copperMat },     // Meshes 7 (Escapement driver)
            { id: 9, teeth: 30, radius: 1.8, x: -3.0, y: 1.0, z: -1.6, mat: steelMat },     // Co-axial with 1 (Dial driver)
            { id: 10,teeth: 60, radius: 3.5, x: -3.0, y: -2.5,z: -1.2, mat: brassMat },     // Orrery driver
            { id: 11,teeth: 15, radius: 0.9, x: 1.5,  y: -2.5,z: -1.2, mat: copperMat },    // Cam driver 1
            { id: 12,teeth: 24, radius: 1.5, x: 4.5,  y: -2.5,z: -1.2, mat: steelMat },    // Cam driver 2 (Walker)
        ];

        const gearMeshes = [];

        gearsData.forEach(data => {
            const geom = createGearGeometry(data.teeth, data.radius);
            const mesh = new THREE.Mesh(geom, data.mat);
            mesh.position.set(data.x, data.y, data.z);
            mesh.castShadow = true;
            automatonGroup.add(mesh);
            gearMeshes.push({ mesh, data });
        });

        // --- DIAL & CLOCK HANDS ---
        const dialGroup = new THREE.Group();
        dialGroup.position.set(-3.0, -2.5, -0.8);
        automatonGroup.add(dialGroup);

        // Dial Plate (White enamel look)
        const dialPlateGeo = new THREE.CylinderGeometry(3.2, 3.2, 0.1, 32);
        dialPlateGeo.rotateX(Math.PI / 2);
        const dialPlate = new THREE.Mesh(dialPlateGeo, ivoryMat);
        dialPlate.receiveShadow = true;
        dialGroup.add(dialPlate);

        // Dial markings (ticks)
        for(let i=0; i<12; i++) {
            const angle = (i / 12) * Math.PI * 2;
            const tickGeo = new THREE.BoxGeometry(0.08, 0.4, 0.05);
            const tick = new THREE.Mesh(tickGeo, darkIronMat);
            tick.position.set(Math.sin(angle) * 2.6, Math.cos(angle) * 2.6, 0.08);
            tick.rotation.z = -angle;
            dialGroup.add(tick);
        }

        // Hands
        const hourHandGeo = new THREE.BoxGeometry(0.15, 1.8, 0.05);
        hourHandGeo.translate(0, 0.9, 0);
        const hourHand = new THREE.Mesh(hourHandGeo, darkIronMat);
        hourHand.position.z = 0.1;
        dialGroup.add(hourHand);

        const minHandGeo = new THREE.BoxGeometry(0.1, 2.6, 0.05);
        minHandGeo.translate(0, 1.3, 0);
        const minHand = new THREE.Mesh(minHandGeo, brassMat);
        minHand.position.z = 0.15;
        dialGroup.add(minHand);

        const secHandGeo = new THREE.BoxGeometry(0.04, 3.0, 0.04);
        secHandGeo.translate(0, 1.5, 0);
        const secHand = new THREE.Mesh(secHandGeo, copperMat);
        secHand.position.z = 0.2;
        dialGroup.add(secHand);

        // Center cap
        const capGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.3, 16);
        capGeo.rotateX(Math.PI / 2);
        const centerCap = new THREE.Mesh(capGeo, goldMat);
        centerCap.position.z = 0.25;
        dialGroup.add(centerCap);


        // --- ANCHOR ESCAPEMENT & PENDULUM ---
        const escapementGroup = new THREE.Group();
        escapementGroup.position.set(6.8, 1.5, -1.5);
        automatonGroup.add(escapementGroup);

        // Escape wheel (Anchor driver, meshes with gear 8)
        const escapeWheelGeom = createGearGeometry(15, 1.2);
        const escapeWheel = new THREE.Mesh(escapeWheelGeom, goldMat);
        escapementGroup.add(escapeWheel);

        // Anchor pallet
        const anchorGeo = new THREE.BoxGeometry(2.2, 0.3, 0.3);
        const anchor = new THREE.Mesh(anchorGeo, steelMat);
        anchor.position.set(0, 1.8, 0);
        escapementGroup.add(anchor);

        // Pendulum rod & bob
        const pendRodGeo = new THREE.CylinderGeometry(0.05, 0.05, 6, 8);
        const pendRod = new THREE.Mesh(pendRodGeo, steelMat);
        pendRod.position.set(0, -3, 0);
        anchor.add(pendRod);

        const pendBobGeo = new THREE.SphereGeometry(0.8, 32, 32);
        pendBobGeo.scale(1, 1.4, 0.6);
        const pendBob = new THREE.Mesh(pendBobGeo, brassMat);
        pendBob.position.set(0, -5.5, 0);
        pendBob.castShadow = true;
        anchor.add(pendBob);


        // --- BELL & HAMMER (Striking Mechanism) ---
        const bellGroup = new THREE.Group();
        bellGroup.position.set(5.5, -2.5, -0.5);
        automatonGroup.add(bellGroup);

        // Bell Dome
        const bellGeo = new THREE.SphereGeometry(1.2, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.7);
        const bell = new THREE.Mesh(bellGeo, goldMat);
        bell.castShadow = true;
        bellGroup.add(bell);

        // Hammer Arm & Head
        const hammerPivot = new THREE.Group();
        hammerPivot.position.set(-1.8, -0.5, 0.5);
        bellGroup.add(hammerPivot);

        const hammerArmGeo = new THREE.BoxGeometry(2.2, 0.1, 0.1);
        hammerArmGeo.translate(1.1, 0, 0);
        const hammerArm = new THREE.Mesh(hammerArmGeo, steelMat);
        hammerPivot.add(hammerArm);

        const hammerHeadGeo = new THREE.SphereGeometry(0.35, 16, 16);
        const hammerHead = new THREE.Mesh(hammerHeadGeo, darkIronMat);
        hammerHead.position.set(2.0, 0, 0);
        hammerPivot.add(hammerHead);


        // --- ORRERY (Planetary Arms) ---
        const orreryGroup = new THREE.Group();
        orreryGroup.position.set(3.0, 3.8, -0.5);
        automatonGroup.add(orreryGroup);

        // Sun
        const sunGeo = new THREE.SphereGeometry(0.8, 32, 32);
        const sun = new THREE.Mesh(sunGeo, goldMat);
        orreryGroup.add(sun);

        // Sun glow point
        const sunLight = new THREE.PointLight(0xffaa00, 1, 5);
        orreryGroup.add(sunLight);

        // Planet 1 Arm & Planet (Inner, fast)
        const arm1 = new THREE.Group();
        orreryGroup.add(arm1);
        const rod1Geo = new THREE.BoxGeometry(2.5, 0.05, 0.05);
        rod1Geo.translate(1.25, 0, 0);
        arm1.add(new THREE.Mesh(rod1Geo, brassMat));
        
        const planet1Geo = new THREE.SphereGeometry(0.3, 16, 16);
        const planet1 = new THREE.Mesh(planet1Geo, copperMat);
        planet1.position.set(2.5, 0, 0);
        planet1.castShadow = true;
        arm1.add(planet1);

        // Planet 2 Arm & Planet (Outer, slow - 1:4 ratio)
        const arm2 = new THREE.Group();
        orreryGroup.add(arm2);
        const rod2Geo = new THREE.BoxGeometry(4.5, 0.05, 0.05);
        rod2Geo.translate(2.25, 0, 0);
        arm2.add(new THREE.Mesh(rod2Geo, brassMat));

        const planet2Geo = new THREE.SphereGeometry(0.45, 16, 16);
        const planet2 = new THREE.Mesh(planet2Geo, steelMat);
        planet2.position.set(4.5, 0, 0);
        planet2.castShadow = true;
        arm2.add(planet2);


        // --- WALKING MINI-FIGURE & LINKAGES ---
        const walkerGroup = new THREE.Group();
        walkerGroup.position.set(-6.5, -3.2, 0.5);
        automatonGroup.add(walkerGroup);

        // Platform / Track for walker
        const trackGeo = new THREE.BoxGeometry(4, 0.2, 1.5);
        const track = new THREE.Mesh(trackGeo, woodMat);
        track.receiveShadow = true;
        walkerGroup.add(track);

        // Figure Torso & Head
        const torsoGeo = new THREE.CylinderGeometry(0.3, 0.2, 1.2, 16);
        const torso = new THREE.Mesh(torsoGeo, brassMat);
        torso.position.set(0, 0.9, 0);
        torso.castShadow = true;
        walkerGroup.add(torso);

        const headGeo = new THREE.SphereGeometry(0.25, 16, 16);
        const head = new THREE.Mesh(headGeo, ivoryMat);
        head.position.set(0, 1.7, 0);
        walkerGroup.add(head);

        // Articulated Legs via Linkages
        const hipGroup = new THREE.Group();
        hipGroup.position.set(0, 0.4, 0);
        walkerGroup.add(hipGroup);

        const legGeo = new THREE.BoxGeometry(0.15, 1.0, 0.15);
        legGeo.translate(0, -0.5, 0);

        const leftLeg = new THREE.Mesh(legGeo, steelMat);
        leftLeg.castShadow = true;
        hipGroup.add(leftLeg);

        const rightLeg = new THREE.Mesh(legGeo, steelMat);
        rightLeg.castShadow = true;
        hipGroup.add(rightLeg);


        // --- DUST MOTES (Atmosphere) ---
        const dustCount = 200;
        const dustGeo = new THREE.BufferGeometry();
        const dustPositions = new Float32Array(dustCount * 3);

        for(let i=0; i<dustCount * 3; i+=3) {
            dustPositions[i] = (Math.random() - 0.5) * 20;
            dustPositions[i+1] = (Math.random() - 0.5) * 12;
            dustPositions[i+2] = (Math.random() - 0.5) * 10;
        }

        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
        const dustMat = new THREE.PointsMaterial({
            color: 0xffeedd,
            size: 0.05,
            transparent: true,
            opacity: 0.3,
            blending: THREE.AdditiveBlending
        });
        const dustSystem = new THREE.Points(dustGeo, dustMat);
        scene.add(dustSystem);


        // --- ANIMATION & PHYSICS LOOP ---
        const clock = new THREE.Clock();
        let tickCounter = 0;
        let lastSecond = 0;

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            
            // MASTER ANGLE (All motion derives from this single continuous time factor)
            const masterAngle = elapsedTime * 1.5;

            // --- 1. GEAR TRAIN ROTATION WITH PROPER RATIOS & OPPOSITE DIRECTIONS ---
            gearMeshes.forEach(item => {
                const { mesh, data } = item;
                // Alternate direction based on tooth counts and meshing chain depth
                let dir = (data.id % 2 === 0) ? -1 : 1;
                // Speed inversely proportional to tooth count relative to master
                let ratio = 48 / data.teeth;
                mesh.rotation.z = masterAngle * ratio * dir;
            });

            // --- 2. DIAL HANDS RATIOS ---
            // Second hand rotates fast, Minute hand 1/60th, Hour hand 1/720th
            secHand.rotation.z = -masterAngle * 4;
            minHand.rotation.z = -masterAngle * (4 / 60);
            hourHand.rotation.z = -masterAngle * (4 / 720);

            // --- 3. ANCHOR ESCAPEMENT & PENDULUM TICK ---
            // Pendulum swings smoothly with a sharp tick cadence
            const pendulumAngle = Math.sin(masterAngle * 3.5) * 0.35;
            anchor.rotation.z = pendulumAngle;
            escapeWheel.rotation.z = -masterAngle * 6;

            // --- 4. CAM & HAMMER (Strikes bell every 5 ticks) ---
            // Track integer seconds for ticking & striking
            const currentSecond = Math.floor(elapsedTime * 1.5);
            if (currentSecond !== lastSecond) {
                lastSecond = currentSecond;
                tickCounter++;

                if (tickCounter % 5 === 0) {
                    // Trigger bell strike flash & shake
                    warmGlow.intensity = 3.5;
                    bell.position.z = 0.05;
                }
            }

            // Decay bell flash
            warmGlow.intensity += (1.5 - warmGlow.intensity) * 0.1;
            bell.position.z += (0 - bell.position.z) * 0.2;

            // Hammer cam motion
            const camPhase = (masterAngle * 2) % (Math.PI * 2);
            if (camPhase < Math.PI * 0.5) {
                hammerPivot.rotation.z = Math.sin(camPhase * 4) * 0.4;
            } else {
                hammerPivot.rotation.z = 0;
            }

            // --- 5. ORRERY PLANETARY ORBITS (1:4 ratio) ---
            arm1.rotation.z = masterAngle * 2;
            arm2.rotation.z = masterAngle * 0.5; // Exactly 1:4 ratio relative to planet 1

            // --- 6. WALKING MINI-FIGURE (Driven by linkage cam) ---
            const walkCycle = masterAngle * 3;
            leftLeg.rotation.x = Math.sin(walkCycle) * 0.5;
            rightLeg.rotation.x = -Math.sin(walkCycle) * 0.5;
            walkerGroup.position.x = -6.5 + Math.sin(masterAngle * 0.5) * 1.5;
            walkerGroup.rotation.y = (Math.cos(masterAngle * 0.5) > 0) ? 0 : Math.PI;

            // --- 7. CAMERA CINEMATIC DRIFT & PUSH-IN ---
            camera.position.x = Math.sin(elapsedTime * 0.1) * 0.8;
            camera.position.y = 3 + Math.cos(elapsedTime * 0.15) * 0.4;
            camera.position.z = 22 - (elapsedTime * 0.05) % 3; // Very slow subtle push-in, looping gracefully
            camera.lookAt(0, 0, 0);

            // --- 8. DUST MOTES DRIFT ---
            const positions = dustGeo.attributes.position.array;
            for(let i=1; i<positions.length; i+=3) {
                positions[i] -= 0.002;
                if (positions[i] < -6) positions[i] = 6;
            }
            dustGeo.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        // --- RESPONSIVE WINDOW RESIZE ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start animation immediately
        animate();

    </script>
</body>
</html>
