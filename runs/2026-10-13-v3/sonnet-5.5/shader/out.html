<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Molten Garden - SDF raymarcher</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
var cv = document.getElementById('c');
var gl = cv.getContext('webgl', { antialias: false, alpha: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' }) || cv.getContext('experimental-webgl');
if (!gl) { document.body.style.color = '#fff'; document.body.textContent = 'WebGL is not available.'; return; }

var VS = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}';
var FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uR;
uniform float uT;
const vec3 BC = vec3(0.0, 1.75, 0.0);
const float BR = 4.7;
const vec3 HZ = vec3(0.2, 0.085, 0.2);
vec3 gC, gL, gP0, gP1, gP2, gP3, gP4, gP5;
vec2 gA, gB, gA0, gB0, gA1, gB1, gA2, gB2, gA3, gB3, gA4, gB4;
float gM1, gM2, gK, gPix, gLo, g0, g1, g2, g3, g4, g5, g6;

vec2 cs(float a) { return vec2(cos(a), sin(a)); }
vec2 rt(vec2 p, vec2 c) { return vec2(c.x*p.x - c.y*p.y, c.y*p.x + c.x*p.y); }
float smin(float a, float b, float k) {
  float h = max(k - abs(a - b), 0.0) / k;
  return min(a, b) - h*h*k*0.25;
}
float sdBox(vec3 p, vec3 b, float r) {
  vec3 q = abs(p) - b;
  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0) - r;
}
float sdTorus(vec3 p, vec2 t) { return length(vec2(length(p.xz) - t.x, p.y)) - t.y; }
float sdCap(vec3 p, float h, float r) { p.x -= clamp(p.x, -h, h); return length(p) - r; }
float sdCyl(vec3 p, float h, float r) {
  vec2 d = abs(vec2(length(p.xz), p.y)) - vec2(r, h);
  return min(max(d.x, d.y), 0.0) + length(max(d, 0.0));
}
float sdOcta(vec3 p, float s) { p = abs(p); return (p.x + p.y + p.z - s)*0.57735027; }

vec3 orb(float k, float t, float R) {
  float a = t*(0.3 + 0.045*k) + k*1.0472;
  float rr = R*(1.0 + 0.12*sin(k*2.7 + t*0.3));
  return vec3(rr*cos(a), 1.75 + 0.7*sin(t*(0.55 + 0.08*k) + k*2.1), rr*sin(a));
}
void setup(float t) {
  float la = t*0.17;
  gL = normalize(vec3(cos(la), 0.5, sin(la)));
  gC = vec3(0.0, 1.75 + 0.12*sin(t*0.9), 0.0);
  gA = cs(t*0.35); gB = cs(t*0.23 + 1.0);
  gM1 = 0.5 + 0.5*sin(t*0.8);
  gM2 = 0.6*(0.5 + 0.5*sin(t*0.53 + 2.0));
  gK = 0.65 + 0.3*sin(t*0.63 + 0.5);
  float R = 2.15 + 0.7*sin(t*0.42);
  gP0 = orb(0.0, t, R); gP1 = orb(1.0, t, R); gP2 = orb(2.0, t, R);
  gP3 = orb(3.0, t, R); gP4 = orb(4.0, t, R); gP5 = orb(5.0, t, R);
  gA0 = cs(t*0.9);       gB0 = cs(t*0.6 + 1.0);
  gA1 = cs(t*0.7 + 2.0); gB1 = cs(t*1.1);
  gA2 = cs(t*1.3);       gB2 = cs(t*0.8 + 0.5);
  gA3 = cs(t*0.6 + 1.5); gB3 = cs(t*1.0);
  gA4 = cs(t*1.0 + 0.7); gB4 = cs(t*0.75 + 2.5);
}

// objects only: the floor is intersected analytically
float map(vec3 p) {
  vec3 q = p - gC;
  q.xz = rt(q.xz, gA); q.xy = rt(q.xy, gB);
  g0 = mix(mix(length(q) - 0.95, sdBox(q, vec3(0.58), 0.16), gM1), sdOcta(q, 1.3), gM2);
  q = p - gP0; q.yz = rt(q.yz, gA0); q.xz = rt(q.xz, gB0);
  g1 = sdTorus(q, vec2(0.7, 0.2));
  q = p - gP1; q.xy = rt(q.xy, gA1); q.yz = rt(q.yz, gB1);
  g2 = sdBox(q, vec3(0.42), 0.07);
  q = p - gP2; q.xy = rt(q.xy, gA2); q.xz = rt(q.xz, gB2);
  g3 = sdCap(q, 0.55, 0.22);
  q = p - gP3; q.xy = rt(q.xy, gA3); q.yz = rt(q.yz, gB3);
  g4 = sdCyl(q, 0.48, 0.3);
  q = p - gP4; q.yz = rt(q.yz, gA4); q.xz = rt(q.xz, gB4);
  g5 = sdOcta(q, 0.9);
  g6 = length(p - gP5) - 0.38;
  float d = smin(g0, g1, gK);
  d = smin(d, g2, gK); d = smin(d, g3, gK); d = smin(d, g4, gK); d = smin(d, g5, gK);
  return smin(d, g6, gK);
}

vec2 sphI(vec3 ro, vec3 rd, vec3 c, float r) {
  vec3 oc = ro - c;
  float b = dot(oc, rd);
  float d = b*b - dot(oc, oc) + r*r;
  if (d < 0.0) return vec2(-1.0);
  d = sqrt(d);
  return vec2(-b - d, -b + d);
}

// returns (t, kind): kind 0 = floor, 1 = object, -1 = sky
vec2 trace(vec3 ro, vec3 rd, float tmax) {
  float tf = rd.y < -0.0001 ? -ro.y / rd.y : 1e5;
  vec2 res = tf < tmax ? vec2(tf, 0.0) : vec2(tmax, -1.0);
  vec2 b = sphI(ro, rd, BC, BR);
  if (b.y > 0.0) {
    float t = max(b.x, 0.0);
    float te = min(b.y, res.x);
    for (int i = 0; i < 110; i++) {
      if (t > te) break;
      float h = map(ro + rd*t);
      gLo = min(gLo, g0);
      if (h < 0.0005*(1.0 + t)) return vec2(t, 1.0);
      t += h*0.9;
    }
  }
  return res;
}

float shadow(vec3 ro, vec3 rd) {
  vec2 b = sphI(ro, rd, BC, BR);
  if (b.y < 0.0) return 1.0;
  float res = 1.0, t = max(b.x, 0.02), te = b.y;
  for (int i = 0; i < 48; i++) {
    if (t > te) break;
    float h = map(ro + rd*t);
    res = min(res, 9.0*h/t);
    if (res < 0.002) break;
    t += clamp(h, 0.02, 0.5);
  }
  res = clamp(res, 0.0, 1.0);
  return res*res*(3.0 - 2.0*res);
}

vec3 calcNormal(vec3 p) {
  vec2 e = vec2(1.0, -1.0)*0.0008;
  return normalize(e.xyy*map(p + e.xyy) + e.yyx*map(p + e.yyx) + e.yxy*map(p + e.yxy) + e.xxx*map(p + e.xxx));
}

float calcAO(vec3 p, vec3 n) {
  float occ = 0.0, sca = 1.0;
  for (int i = 0; i < 5; i++) {
    float h = 0.02 + 0.14*float(i);
    occ += (h - map(p + n*h))*sca;
    sca *= 0.8;
  }
  return clamp(1.0 - 1.6*occ, 0.0, 1.0);
}

vec3 hash33(vec3 p) {
  p = vec3(dot(p, vec3(127.1, 311.7, 74.7)), dot(p, vec3(269.5, 183.3, 246.1)), dot(p, vec3(113.5, 271.9, 124.6)));
  return fract(sin(p)*43758.5453);
}

// voronoi cell borders = lava cracks
float cracks(vec3 x) {
  vec3 ip = floor(x), fp = x - ip;
  float d1 = 9.0, d2 = 9.0;
  for (int k = -1; k <= 1; k++) {
    for (int j = -1; j <= 1; j++) {
      for (int i = -1; i <= 1; i++) {
        vec3 g = vec3(float(i), float(j), float(k));
        vec3 o = 0.5 + 0.5*sin(uT*0.45 + 6.2831*hash33(ip + g));
        float d = length(g + o - fp);
        if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) { d2 = d; }
      }
    }
  }
  return 1.0 - smoothstep(0.0, 0.16, d2 - d1);
}

// box-filtered checker, w = pixel footprint in tile units
float checker(vec2 p, float w) {
  w = max(w, 0.0001);
  vec2 i = 2.0*(abs(fract((p - 0.5*w)*0.5) - 0.5) - abs(fract((p + 0.5*w)*0.5) - 0.5)) / w;
  return clamp(0.5 - 0.5*i.x*i.y, 0.0, 1.0);
}

// soft color blend between the primitives, weighted by distance at the hit point
vec3 matColor(vec3 p, out float lf) {
  map(p);
  float w0 = exp(-max(g0, 0.0)*9.0), w1 = exp(-max(g1, 0.0)*9.0), w2 = exp(-max(g2, 0.0)*9.0);
  float w3 = exp(-max(g3, 0.0)*9.0), w4 = exp(-max(g4, 0.0)*9.0), w5 = exp(-max(g5, 0.0)*9.0), w6 = exp(-max(g6, 0.0)*9.0);
  float ws = w0 + w1 + w2 + w3 + w4 + w5 + w6;
  lf = w0 / ws;
  return (w0*vec3(0.05, 0.03, 0.03) + w1*vec3(0.04, 0.45, 0.85) + w2*vec3(0.85, 0.12, 0.38) + w3*vec3(0.35, 0.85, 0.15)
        + w4*vec3(0.9, 0.6, 0.1) + w5*vec3(0.45, 0.32, 0.9) + w6*vec3(0.08, 0.8, 0.65)) / ws;
}

vec3 sky(vec3 rd) {
  float h = clamp(rd.y, 0.0, 1.0);
  vec3 col = mix(HZ, vec3(0.012, 0.02, 0.06), pow(h, 0.4));
  col += vec3(0.08, 0.03, 0.16)*(0.5 + 0.5*sin(rd.x*4.0 + sin(rd.z*3.0 + uT*0.15)))*smoothstep(0.0, 0.5, rd.y);
  float sd = max(dot(rd, gL), 0.0);
  col += vec3(1.0, 0.75, 0.5)*(pow(sd, 600.0)*4.0 + pow(sd, 14.0)*0.2)*smoothstep(0.0, 0.3, rd.y);
  vec3 q = rd*90.0;
  vec3 c = floor(q);
  vec3 r = hash33(c);
  float d = length(q - (c + 0.2 + 0.6*hash33(c + 7.7)));
  float tw = 0.65 + 0.35*sin(uT*3.0 + r.y*60.0);
  col += vec3(0.8, 0.9, 1.0)*step(0.8, r.x)*tw*pow(clamp(1.0 - d/0.17, 0.0, 1.0), 2.0)*2.0*smoothstep(0.0, 0.25, rd.y);
  return col;
}

// rising embers and cool motes: analytic ray / point closest approach, occluded by tmax
vec3 sparks(vec3 ro, vec3 rd, float tmax) {
  vec3 acc = vec3(0.0);
  for (int i = 0; i < 36; i++) {
    float fi = float(i);
    vec4 r = fract(sin(vec4(fi*12.9898, fi*78.233, fi*37.719, fi*93.989) + vec4(1.0, 2.0, 3.0, 4.0))*43758.5453);
    float life = fract(uT*(0.05 + 0.07*r.w) + r.x);
    float a = r.y*6.2831 + uT*(r.z - 0.5)*0.8 + life*2.0;
    float rad = 1.3 + 6.0*r.z*r.z + life*1.5;
    vec3 pp = vec3(cos(a)*rad, 0.35 + life*6.0*(0.4 + r.w), sin(a)*rad) - ro;
    float s = dot(pp, rd);
    if (s > 0.0 && s < tmax) {
      float d2 = dot(pp, pp) - s*s;
      float sz = 0.02 + 0.02*r.x;
      float r2 = max(sz*sz, s*s*1.4e-5);
      float g = exp(-d2/r2) + 0.1*exp(-d2/(12.0*r2));
      g *= sz*sz/r2*sin(life*3.14159)*(0.75 + 0.25*sin(uT*17.0 + fi*5.0));
      acc += mix(vec3(1.0, 0.5, 0.12), vec3(0.4, 0.85, 1.0), step(0.62, fract(r.z*13.7)))*g*2.2;
    }
  }
  return acc;
}

vec3 shade(vec3 p, vec3 rd, float t, float kind, bool full, out vec3 n, out float refl, out vec3 tint) {
  vec3 alb, em = vec3(0.0);
  float ks, occ, lf = 0.0;
  if (kind < 0.5) {
    n = vec3(0.0, 1.0, 0.0);
    float w = 1.3*gPix*t / max(abs(rd.y), 0.04);
    float c = checker(p.xz / 1.2, w / 1.2);
    alb = mix(vec3(0.02, 0.025, 0.05), vec3(0.3, 0.32, 0.45), c);
    refl = mix(0.55, 0.22, c);
    tint = mix(vec3(0.8, 0.88, 1.0), vec3(1.0), c);
    ks = 0.5;
    occ = 1.0 - 0.55*exp(-dot(p.xz, p.xz)*0.1);
  } else {
    alb = matColor(p, lf);
    n = calcNormal(p);
    occ = full ? calcAO(p, n) : 1.0;
    refl = 0.3;
    tint = mix(vec3(1.0), alb*1.6 + 0.25, 0.7);
    ks = 1.0;
    if (lf > 0.02) {
      vec3 lp = p - gC;
      lp.xz = rt(lp.xz, gA); lp.xy = rt(lp.xy, gB);
      float cr = cracks(lp*2.3);
      float pulse = 0.6 + 0.4*sin(uT*2.6 + lp.y*3.0 + lp.x*2.0);
      em = (mix(vec3(1.0, 0.12, 0.0), vec3(1.0, 0.8, 0.3), cr*pulse)*cr*(1.2 + 3.2*pulse) + vec3(0.35, 0.05, 0.0)*0.25*pulse)*lf;
      alb = mix(alb, vec3(0.3, 0.05, 0.01), cr*0.5*lf);
    }
  }
  float dif = clamp(dot(n, gL), 0.0, 1.0);
  float sh = dif > 0.001 ? shadow(p + n*0.012, gL) : 0.0;
  float spe = pow(clamp(dot(n, normalize(gL - rd + 0.0001)), 0.0, 1.0), 48.0)*sh;
  vec3 lv = gC - p;
  float ld2 = dot(lv, lv);
  float lat = clamp(dot(n, lv*inversesqrt(ld2 + 0.0001)), 0.0, 1.0) / (1.0 + 0.45*ld2);
  vec3 lin = vec3(1.0, 0.82, 0.62)*2.0*dif*sh;
  lin += mix(vec3(0.06, 0.04, 0.1), vec3(0.2, 0.26, 0.42), 0.5 + 0.5*n.y)*1.8*occ;
  lin += vec3(1.0, 0.3, 0.06)*3.2*(0.65 + 0.35*sin(uT*2.6))*lat;
  vec3 col = alb*lin + vec3(1.0, 0.9, 0.8)*spe*ks*1.2;
  float fre = pow(clamp(1.0 + dot(n, rd), 0.0, 1.0), 4.0);
  vec3 pal = 0.5 + 0.5*cos(6.2831*(vec3(0.0, 0.33, 0.67) + uT*0.04 + t*0.02));
  col += pal*fre*(kind < 0.5 ? 0.1 : 0.9)*occ;
  return col + em;
}

// camera spline: Catmull-Rom through orbit / dive / rise control points
vec3 cpt(float i) {
  float a = i*1.05 + 0.4*sin(i*0.7);
  float r = 6.4 + 1.7*sin(i*1.9 + 0.5);
  float y = 2.9 + 2.0*sin(i*1.25 + 1.0);
  return vec3(r*cos(a), y, r*sin(a));
}
vec3 spline(float s) {
  float i = floor(s), f = s - i;
  vec3 p0 = cpt(i - 1.0), p1 = cpt(i), p2 = cpt(i + 1.0), p3 = cpt(i + 2.0);
  return 0.5*(2.0*p1 + (p2 - p0)*f + (2.0*p0 - 5.0*p1 + 4.0*p2 - p3)*f*f + (3.0*p1 - p0 - 3.0*p2 + p3)*f*f*f);
}

void main() {
  float T = uT;
  setup(T);
  float fl = 1.7 + 0.25*sin(T*0.21);
  gPix = 2.0 / (uR.y*fl);
  vec2 uv = (gl_FragCoord.xy*2.0 - uR) / uR.y;
  vec3 ro = spline(T*0.22);
  ro.y = max(ro.y, 0.75);
  vec3 ta = gC + vec3(sin(T*0.31)*0.5, 0.3 + 0.3*sin(T*0.47), cos(T*0.27)*0.5);
  vec3 cw = normalize(ta - ro);
  vec3 cu = normalize(cross(cw, vec3(sin(T*0.13)*0.1, 1.0, 0.0)));
  vec3 cv = cross(cu, cw);
  vec3 rd = normalize(uv.x*cu + uv.y*cv + fl*cw);

  gLo = 1e3;
  vec2 h = trace(ro, rd, 120.0);
  float glow = gLo;
  float th = 1e3;
  vec3 col;
  if (h.y < 0.0) {
    col = sky(rd);
  } else {
    th = h.x;
    vec3 p = ro + rd*h.x;
    vec3 n, tint;
    float refl;
    col = shade(p, rd, h.x, h.y, true, n, refl, tint);
    float F = refl + (1.0 - refl)*pow(clamp(1.0 + dot(n, rd), 0.0, 1.0), 5.0);
    vec3 r = reflect(rd, n);
    vec3 o2 = p + n*0.006;
    vec2 h2 = trace(o2, r, 70.0);
    vec3 rc;
    float t2 = 1e3;
    if (h2.y < 0.0) {
      rc = sky(r);
    } else {
      t2 = h2.x;
      vec3 p2 = o2 + r*h2.x;
      vec3 n2, tint2;
      float refl2;
      rc = shade(p2, r, h2.x, h2.y, false, n2, refl2, tint2);
      rc = mix(rc, HZ, 1.0 - exp(-h2.x*h2.x*0.00035));
    }
    rc += sparks(o2, r, t2);
    col = mix(col, rc*tint, clamp(F, 0.0, 1.0));
    col = mix(col, HZ, 1.0 - exp(-h.x*h.x*0.00035));
  }
  col += sparks(ro, rd, th);
  col += vec3(1.0, 0.33, 0.07)*exp(-glow*3.0)*0.22*(0.7 + 0.3*sin(T*2.6));

  vec2 q = gl_FragCoord.xy / uR;
  float vig = pow(clamp(16.0*q.x*q.y*(1.0 - q.x)*(1.0 - q.y), 0.0, 1.0), 0.28);
  col *= mix(0.25, 1.0, vig)*1.1;
  col = max(col, vec3(0.0));
  col = (col*(2.51*col + 0.03)) / (col*(2.43*col + 0.59) + 0.14);
  col = pow(clamp(col, 0.0, 1.0), vec3(1.0/2.2));
  col += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233)) + T)*43758.5453) - 0.5)/255.0;
  gl_FragColor = vec4(col, 1.0);
}
`;

function mk(type, src) {
  var s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
var pr = gl.createProgram();
gl.attachShader(pr, mk(gl.VERTEX_SHADER, VS));
gl.attachShader(pr, mk(gl.FRAGMENT_SHADER, FS));
gl.bindAttribLocation(pr, 0, 'p');
gl.linkProgram(pr);
if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(pr)); return; }
gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

var uR = gl.getUniformLocation(pr, 'uR'), uT = gl.getUniformLocation(pr, 'uT');
var q = 1, W = 0, H = 0, t0 = performance.now(), last = t0, ema = 16, cnt = 0;

// pixel budget + automatic downscale if the GPU cannot keep up
function fit() {
  var d = Math.min(window.devicePixelRatio || 1, 2);
  var w = innerWidth * d, h = innerHeight * d;
  var s = Math.min(1, Math.sqrt(1.6e6 / (w * h))) * q;
  w = Math.max(2, Math.floor(w * s)); h = Math.max(2, Math.floor(h * s));
  if (w !== W || h !== H) { W = cv.width = w; H = cv.height = h; gl.viewport(0, 0, w, h); }
}
function frame(now) {
  var dt = Math.max(0, Math.min(now - last, 120)); last = now;
  ema += (dt - ema) * 0.1;
  if (++cnt > 12 && ema > 45 && q > 0.3) { q *= 0.82; cnt = 0; ema = 16; fit(); }
  gl.uniform2f(uR, W, H);
  gl.uniform1f(uT, Math.max(0, (now - t0) / 1000));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
addEventListener('resize', fit);
fit();
requestAnimationFrame(frame);
})();
</script>
