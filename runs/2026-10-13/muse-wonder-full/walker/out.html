<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parkour Fighter</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#0b0e1a;height:100%;font-family:Arial,Helvetica,sans-serif}
canvas{display:block}
#phase{position:fixed;top:18px;left:50%;transform:translateX(-50%);color:#fff;font-size:28px;font-weight:800;letter-spacing:4px;text-shadow:0 2px 12px #000,0 0 22px #4df;pointer-events:none;z-index:10;text-transform:uppercase}
#sub{position:fixed;top:54px;left:50%;transform:translateX(-50%);color:#cfe8ff;font-size:13px;letter-spacing:2px;text-shadow:0 1px 6px #000;pointer-events:none;z-index:10}
#bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:320px;height:6px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden;z-index:10}
#fill{height:100%;width:0%;background:linear-gradient(90deg,#22d3ee,#e879f9)}
</style></head><body>
<div id="phase">RUN</div><div id="sub">PARKOUR COMBAT — 10s LOOP</div><div id="bar"><div id="fill"></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();scene.background=new THREE.Color(0x11172e);
scene.fog=new THREE.Fog(0x11172e,18,42);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,100);
camera.position.set(-8,3,9);

const dir=new THREE.DirectionalLight(0xffffff,2.6);dir.position.set(6,12,6);dir.castShadow=true;
dir.shadow.mapSize.set(2048,2048);dir.shadow.camera.left=-14;dir.shadow.camera.right=14;dir.shadow.camera.top=14;dir.shadow.camera.bottom=-14;dir.shadow.camera.far=35;dir.shadow.bias=-0.0004;dir.shadow.radius=4;scene.add(dir);
scene.add(new THREE.AmbientLight(0x8899ff,0.7));
const point=new THREE.PointLight(0xff3388,60,20,1.8);point.position.set(3,3,3);scene.add(point);
const point2=new THREE.PointLight(0x22ccff,30,18,1.8);point2.position.set(-6,2.5,-3);scene.add(point2);

// --- textures ---
function canvasTex(draw,s=256){const c=document.createElement('canvas');c.width=c.height=s;draw(c.getContext('2d'),s);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;return t;}
const floorTex=canvasTex((g,s)=>{const n=2,d=s/n;for(let i=0;i<n;i++)for(let j=0;j<n;j++){g.fillStyle=(i+j)%2?'#2a3048':'#d7dce8';g.fillRect(i*d,j*d,d,d);}});floorTex.repeat.set(14,14);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({map:floorTex,roughness:0.85}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);

const stripeTex=canvasTex((g,s)=>{for(let i=0;i<8;i++){g.fillStyle=i%2?'#e11d48':'#f8fafc';g.fillRect(i*s/8,0,s/8,s);}g.fillStyle='rgba(0,0,0,.15)';for(let y=0;y<s;y+=32)g.fillRect(0,y,s,3);});stripeTex.repeat.set(4,1.4);
const wallMat=new THREE.MeshStandardMaterial({map:stripeTex,roughness:0.7});
const wall=new THREE.Mesh(new THREE.BoxGeometry(15,5.2,0.4),wallMat);
wall.position.set(1.5,2.6,-1.9);wall.castShadow=true;wall.receiveShadow=true;scene.add(wall);
// side blocks / arena dressing
function block(x,z,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:0.6}));m.position.set(x,h/2,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m;}
block(-9,-3,2,1.2,2,0x334155);block(9,3.5,2.4,1.8,2,0x334155);block(8,-3.5,1.6,1,1.6,0x475569);block(-6,4,1.8,0.8,1.8,0x475569);
const back=new THREE.Mesh(new THREE.BoxGeometry(40,6,0.4),new THREE.MeshStandardMaterial({color:0x1e293b,roughness:0.9}));back.position.set(0,3,-8);back.receiveShadow=true;scene.add(back);

// --- fighter hierarchy ---
const M={suit:new THREE.MeshStandardMaterial({color:0x2563eb,roughness:0.5}),dark:new THREE.MeshStandardMaterial({color:0x111827,roughness:0.6}),skin:new THREE.MeshStandardMaterial({color:0xf2c49b,roughness:0.6}),accent:new THREE.MeshStandardMaterial({color:0xfacc15,roughness:0.4}),red:new THREE.MeshStandardMaterial({color:0xef4444,roughness:0.5})};
function box(w,h,d,mat,x=0,y=0,z=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;return m;}
function limb(len,r,mat){const m=new THREE.Mesh(new THREE.CapsuleGeometry(r,len,4,10),mat);m.position.y=-len/2;m.castShadow=true;return m;}
function makeArm(side){ // side +1 left, -1 right
  const sh=new THREE.Group();sh.position.set(0.34*side,0.62,0);sh.add(limb(0.28,0.085,M.suit));
  const el=new THREE.Group();el.position.y=-0.34;el.add(limb(0.24,0.07,M.skin));sh.add(el);
  const hand=box(0.13,0.13,0.13,M.red,0,-0.34,0);el.add(hand);return{sh,el,hand};}
function makeLeg(side){
  const hip=new THREE.Group();hip.position.set(0.16*side,-0.05,0);hip.add(limb(0.34,0.11,M.dark));
  const knee=new THREE.Group();knee.position.y=-0.44;knee.add(limb(0.3,0.085,M.dark));hip.add(knee);
  const foot=box(0.13,0.09,0.28,M.accent,0,-0.42,0.06);knee.add(foot);return{hip,knee,foot};}

const char=new THREE.Group();scene.add(char);           // world position + yaw
const tilt=new THREE.Group();char.add(tilt);            // wall lean + flip
const hips=new THREE.Group();hips.position.y=1.02;tilt.add(hips);
hips.add(box(0.42,0.22,0.26,M.dark,0,0,0));             // pelvis
const torso=new THREE.Group();torso.position.y=0.08;hips.add(torso);
torso.add(box(0.52,0.62,0.3,M.suit,0,0.33,0));          // torso
torso.add(box(0.54,0.12,0.32,M.accent,0,0.55,0));       // chest stripe
const neck=new THREE.Group();neck.position.y=0.72;torso.add(neck);
const head=new THREE.Mesh(new THREE.SphereGeometry(0.19,20,16),M.skin);head.position.y=0.17;head.castShadow=true;neck.add(head);
neck.add(box(0.4,0.09,0.4,M.red,0,0.27,0));             // headband
const armL=makeArm(1),armR=makeArm(-1);torso.add(armL.sh,armR.sh);
const legL=makeLeg(1),legR=makeLeg(-1);hips.add(legL.hip,legR.hip);

// --- helpers ---
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const ss=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const seg=(t,a,b)=>ss((t-a)/(b-a));
const phaseEl=document.getElementById('phase'),fill=document.getElementById('fill');
let lastPhase='';

function neutral(){
  hips.position.y=1.02;hips.rotation.set(0,0,0);torso.rotation.set(0,0,0);neck.rotation.set(0,0,0);tilt.rotation.set(0,0,0);
  armL.sh.rotation.set(0,0,0.15);armR.sh.rotation.set(0,0,-0.15);armL.el.rotation.set(-0.3,0,0);armR.el.rotation.set(-0.3,0,0);
  legL.hip.rotation.set(0,0,0.05);legR.hip.rotation.set(0,0,-0.05);legL.knee.rotation.set(0.08,0,0);legR.knee.rotation.set(0.08,0,0);
}
function runPose(t,speed=11,amp=0.85,lean=0.28){
  const s=Math.sin(t*speed),c=Math.cos(t*speed);
  hips.position.y=1.02+Math.abs(Math.cos(t*speed))*0.09;torso.rotation.x=lean;neck.rotation.x=-lean*0.6;
  legL.hip.rotation.x=s*amp;legR.hip.rotation.x=-s*amp;
  legL.knee.rotation.x=Math.max(0, -c)*1.1+0.15;legR.knee.rotation.x=Math.max(0,c)*1.1+0.15;
  armL.sh.rotation.x=-s*amp*0.9;armR.sh.rotation.x=s*amp*0.9;
  armL.el.rotation.x=-0.9-Math.max(0,s)*0.5;armR.el.rotation.x=-0.9-Math.max(0,-s)*0.5;
  torso.rotation.y=s*0.12;
}
function crouchPose(a){ // a 0..1 depth
  hips.position.y=lerp(1.02,0.58,a);torso.rotation.x=lerp(0,0.55,a);neck.rotation.x=lerp(0,-0.35,a);
  legL.hip.rotation.x=lerp(0,-1.15,a);legR.hip.rotation.x=lerp(0,-1.3,a);
  legL.knee.rotation.x=lerp(0.08,1.9,a);legR.knee.rotation.x=lerp(0.08,2.0,a);
  legL.hip.rotation.z=lerp(0.05,0.28,a);legR.hip.rotation.z=lerp(-0.05,-0.28,a);
  armL.sh.rotation.x=lerp(0,-0.7,a);armR.sh.rotation.x=lerp(0,0.6,a);armL.el.rotation.x=lerp(-0.3,-0.4,a);armR.el.rotation.x=lerp(-0.3,-1.0,a);
}

const camPos=new THREE.Vector3(-8,3,9),camTgt=new THREE.Vector3(-8,1,0),tmpV=new THREE.Vector3(),tmpT=new THREE.Vector3();
const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05),time=clock.elapsedTime;
  const T=10,t=time%T;fill.style.width=(t/T*100)+'%';
  neutral();
  let name='',camOff=new THREE.Vector3(0,2.2,6.5);

  if(t<2.5){ // RUN toward wall
    name='RUN';const p=seg(t,0,2.5);
    char.position.set(lerp(-8,-1,p),0,lerp(0.6,-0.75,p));char.rotation.y=Math.PI/2;
    runPose(t);camOff.set(-1.5,2.1,6.2);
  } else if(t<4.5){ // WALL RUN
    name='WALL RUN';const p=ss((t-2.5)/2),q=(t-2.5)/2;
    char.position.set(lerp(-1,3.5,p),lerp(0,1.55,ss(Math.min(1,q*2.2)))*(1-ss((q-0.85)/0.15)*0.15),lerp(-0.75,-0.72,p));
    char.rotation.y=Math.PI/2;
    tilt.rotation.z=lerp(0,1.15,ss(Math.min(1,q*3)))*(1-ss((q-0.9)/0.1)); // lean: feet to wall on the left
    runPose(t,12,0.75,0.15);
    legL.hip.rotation.z=0.55;legR.hip.rotation.z=0.35;legL.knee.rotation.x+=0.3;legR.knee.rotation.x+=0.3;
    armL.sh.rotation.z=1.1;armR.sh.rotation.z=-0.5;neck.rotation.z=-0.7;
    camOff.set(3.2,1.4,5.2);
  } else if(t<6.0){ // PUSH OFF + FLIP
    name='FLIP';const q=(t-4.5)/1.5,p=ss(q);
    char.position.set(lerp(3.5,6,p),1.45*(1-p)+Math.sin(q*Math.PI)*1.5,lerp(-0.72,1.1,p));
    char.rotation.y=lerp(Math.PI/2,0.35,p);
    tilt.rotation.x=-q*Math.PI*2; // backflip
    legL.hip.rotation.x=-0.9;legR.hip.rotation.x=-0.5;legL.knee.rotation.x=1.4;legR.knee.rotation.x=1.1; // tuck
    armL.sh.rotation.set(-2.4,0,0.7);armR.sh.rotation.set(-2.4,0,-0.7);armL.el.rotation.x=armR.el.rotation.x=-0.5;
    torso.rotation.x=0.35;hips.position.y=1.0;
    camOff.set(4.5,2.6,5.5);
  } else if(t<6.8){ // LAND CROUCH
    name='LAND — CROUCH';const q=(t-6)/0.8;
    char.position.set(6,0,1.1);char.rotation.y=0.35;tilt.rotation.x=0;
    crouchPose(Math.sin(Math.min(1,q)*Math.PI*0.62));
    camOff.set(2.2,1.4,5);
  } else if(t<9.3){ // 3-HIT COMBO
    char.position.set(6,0,1.1);
    if(t<7.6){ name='COMBO 1 — PUNCH';const q=(t-6.8)/0.8,jab=Math.sin(Math.min(1,q*1.15)*Math.PI);
      char.rotation.y=0.35-jab*0.15;crouchPose(0.22);
      torso.rotation.y=-jab*0.55;armR.sh.rotation.x=lerp(-0.4,-1.55,jab);armR.el.rotation.x=lerp(-1.2,-0.05,jab);
      armL.sh.rotation.x=-0.9;armL.el.rotation.x=-1.5;char.position.z=1.1+jab*0.25;
    } else if(t<8.45){ name='COMBO 2 — KICK';const q=(t-7.6)/0.85,k=Math.sin(Math.min(1,q*1.2)*Math.PI);
      char.rotation.y=0.35;crouchPose(0.1);torso.rotation.x=-k*0.3;torso.rotation.y=k*0.3;
      legR.hip.rotation.x=lerp(0,-1.65,k);legR.knee.rotation.x=lerp(1.2,0.05,ss(k));
      armL.sh.rotation.x=-1.2;armR.sh.rotation.set(0.7,0,-0.9);hips.position.y=1.02+k*0.05;
    } else { name='COMBO 3 — SPIN KICK';const q=(t-8.45)/0.85;
      char.rotation.y=0.35+q*Math.PI*2;const ext=Math.sin(q*Math.PI);
      crouchPose(0.05);legR.hip.rotation.set(-0.4*ext,0,-1.5*ext);legR.knee.rotation.x=lerp(0.6,0.02,ext);
      armL.sh.rotation.z=1.5*ext+0.2;armR.sh.rotation.z=-1.5*ext-0.2;armL.el.rotation.x=armR.el.rotation.x=-0.2;
      tilt.rotation.z=ext*0.25;hips.position.y=1.02+Math.sin(q*Math.PI)*0.28;
    }
    camOff.set(2.6,1.7,4.6);
  } else { // RESET
    name='RESET';const p=ss((t-9.3)/0.7);
    char.position.set(lerp(6,-8,p),0,lerp(1.1,0.6,p));
    char.rotation.y=lerp(0.35,-Math.PI/2,ss(Math.min(1,p*2.5)));
    if(p>0.85)char.rotation.y=lerp(-Math.PI/2,Math.PI/2,ss((p-0.85)/0.15));
    runPose(t,13,0.8,0.25);camOff.set(0,3.6,9);
  }

  if(name!==lastPhase){phaseEl.textContent=name;lastPhase=name;}
  point.position.set(char.position.x+2.5,2.6+Math.sin(time*2)*0.4,char.position.z+2.2);
  point2.position.set(char.position.x-3,1.8,char.position.z-2);

  // smooth lagging follow camera, angle changes per phase via camOff
  tmpV.copy(char.position).add(camOff);tmpT.set(char.position.x,1.15+char.position.y*0.7,char.position.z);
  const k=1-Math.exp(-dt*3.2),k2=1-Math.exp(-dt*4.5);
  camPos.lerp(tmpV,k);camTgt.lerp(tmpT,k2);
  camera.position.copy(camPos);camera.lookAt(camTgt);
  dir.target.position.copy(char.position);dir.target.updateMatrixWorld();

  renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
animate();
</script></body></html>
