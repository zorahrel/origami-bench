<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clockwork Automaton</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0d10}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;left:14px;bottom:12px;color:#cbb37a;font:11px/1.4 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;opacity:.75;pointer-events:none}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}
</script>
</head>
<body>
<div id="hud">Clockwork Automaton &middot; one master angle drives all</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d10);
scene.fog = new THREE.Fog(0x0b0d10, 18, 34);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,0.4,15);

// ---------- fake environment (procedural equirect -> PMREM, core three only) ----------
(function makeEnv(){
  const c = document.createElement('canvas'); c.width=1024; c.height=512;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0,0,0,512);
  grad.addColorStop(0,'#3a4356'); grad.addColorStop(0.45,'#14171d');
  grad.addColorStop(0.55,'#0a0b0e'); grad.addColorStop(1,'#050607');
  g.fillStyle=grad; g.fillRect(0,0,1024,512);
  // bright softbox strips -> streaky metal reflections
  g.fillStyle='#fff4d6'; g.fillRect(120,60,70,340);
  g.fillStyle='#cfe4ff'; g.fillRect(560,40,46,300);
  g.fillStyle='#ffd9a0'; g.fillRect(820,90,120,90);
  g.fillStyle='#ffffff'; g.fillRect(300,30,220,36);
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(tex).texture;
  tex.dispose(); pmrem.dispose();
})();

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0x8fa3c7, 0x1a1208, 0.55));
const key = new THREE.DirectionalLight(0xffe8bb, 2.2); key.position.set(6,8,9); scene.add(key);
const rim = new THREE.DirectionalLight(0x7fa8ff, 1.4); rim.position.set(-8,3,-4); scene.add(rim);
const glow = new THREE.PointLight(0xffb35c, 30, 20, 2); glow.position.set(0,-2,4); scene.add(glow);

// ---------- materials ----------
const brass  = new THREE.MeshStandardMaterial({color:0xc9a227, metalness:1.0, roughness:0.32});
const brass2 = new THREE.MeshStandardMaterial({color:0xa67c2e, metalness:1.0, roughness:0.42});
const steel  = new THREE.MeshStandardMaterial({color:0xb9bfc9, metalness:1.0, roughness:0.22});
const darkSt = new THREE.MeshStandardMaterial({color:0x4a505c, metalness:1.0, roughness:0.45});
const copper = new THREE.MeshStandardMaterial({color:0xb87333, metalness:1.0, roughness:0.30});
const blued  = new THREE.MeshStandardMaterial({color:0x2b4f9e, metalness:0.9, roughness:0.25});
const plateM = new THREE.MeshStandardMaterial({color:0x23272f, metalness:0.85, roughness:0.55});
const cream  = new THREE.MeshStandardMaterial({color:0xe8ddc4, metalness:0.15, roughness:0.6});
const redM   = new THREE.MeshStandardMaterial({color:0xa42318, metalness:0.4, roughness:0.45});

const world = new THREE.Group(); scene.add(world);

// ---------- frame: back plate, front ring pillars ----------
{
  const plate = new THREE.Mesh(new THREE.BoxGeometry(11.4,8.6,0.22), plateM);
  plate.position.set(0,0,-1.15); world.add(plate);
  const trim = new THREE.Mesh(new THREE.BoxGeometry(11.7,8.9,0.1), brass2);
  trim.position.set(0,0,-1.3); world.add(trim);
  const postG = new THREE.CylinderGeometry(0.13,0.13,2.4,20);
  [[-5.2,3.8],[5.2,3.8],[-5.2,-3.8],[5.2,-3.8]].forEach(([x,y])=>{
    const p = new THREE.Mesh(postG, brass);
    p.rotation.x = Math.PI/2; p.position.set(x,y,0); world.add(p);
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.2,20,14), brass);
    cap.position.set(x,y,1.25); world.add(cap);
  });
}

// ---------- gear geometry ----------
function gearGeometry(N, module_, thickness, pointed=false){
  const r = module_*N/2;               // pitch radius proportional to tooth count
  const rOut = r + module_*0.85, rRoot = r - module_*0.7;
  const shape = new THREE.Shape();
  const step = Math.PI*2/N;
  for(let i=0;i<N;i++){
    const a = i*step;
    if(pointed){ // escape-wheel saw teeth
      const pts=[[rRoot,a],[rOut,a+step*0.72],[rRoot,a+step*0.82],[rRoot,a+step]];
      pts.forEach(([rr,aa],j)=>{
        const x=Math.cos(aa)*rr, y=Math.sin(aa)*rr;
        if(i===0&&j===0) shape.moveTo(x,y); else shape.lineTo(x,y);
      });
    } else {     // trapezoidal teeth
      const pts=[[rRoot,a],[rOut,a+step*0.22],[rOut,a+step*0.48],[rRoot,a+step*0.70],[rRoot,a+step]];
      pts.forEach(([rr,aa],j)=>{
        const x=Math.cos(aa)*rr, y=Math.sin(aa)*rr;
        if(i===0&&j===0) shape.moveTo(x,y); else shape.lineTo(x,y);
      });
    }
  }
  shape.closePath();
  const hole = new THREE.Path(); hole.absarc(0,0,Math.max(0.09,r*0.14),0,Math.PI*2,true);
  shape.holes.push(hole);
  // lightening holes for larger gears (spoked look)
  if(r>0.85 && !pointed){
    const n=5, hr=r*0.20;
    for(let i=0;i<n;i++){
      const a=i/n*Math.PI*2, h=new THREE.Path();
      h.absarc(Math.cos(a)*r*0.58, Math.sin(a)*r*0.58, hr, 0, Math.PI*2, true);
      shape.holes.push(h);
    }
  }
  const geo = new THREE.ExtrudeGeometry(shape,{depth:thickness,bevelEnabled:true,bevelThickness:0.015,bevelSize:0.015,bevelSegments:1});
  geo.translate(0,0,-thickness/2);
  return {geo, r};
}
function makeGear(N, module_, thickness, mat, pointed=false){
  const {geo,r} = gearGeometry(N,module_,thickness,pointed);
  const grp = new THREE.Group();
  grp.add(new THREE.Mesh(geo,mat));
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(Math.max(0.13,r*0.2),Math.max(0.13,r*0.2),thickness+0.22,24), darkSt);
  hub.rotation.x = Math.PI/2; grp.add(hub);
  const pin = new THREE.Mesh(new THREE.SphereGeometry(0.07,14,10), steel);
  pin.position.z = thickness/2+0.12; grp.add(pin);
  grp.userData = {N, r};
  return grp;
}

// ---------- gear train: 9 gears, true meshing ratios, alternating sign ----------
// angle[i] = -angle[i-1] * N[i-1]/N[i] + phase  (opposite rotation, exact tooth ratio)
const MODULE_ = 0.085;
const teeth = [36, 18, 30, 15, 27, 18, 33, 16, 24];
const dirs  = [0, 0.45, 1.15, 0.35, 1.25, 0.15, 0.95, 2.5, 3.6]; // centre-line directions (folded snake)
const mats  = [brass, steel, copper, brass2, brass, steel, brass2, copper, brass];
const gears = [];
{
  let pos = new THREE.Vector2(-4.15, -2.55);
  let prevR = 0;
  for(let i=0;i<teeth.length;i++){
    const g = makeGear(teeth[i], MODULE_, 0.2, mats[i]);
    const r = g.userData.r;
    if(i>0){
      const d = (prevR + r) * 0.995;
      pos = pos.clone().add(new THREE.Vector2(Math.cos(dirs[i])*d, Math.sin(dirs[i])*d));
    }
    g.position.set(pos.x, pos.y, -0.55 + (i%3)*0.16); // layered depths
    // static axle back to plate
    const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,0.9,12), steel);
    axle.rotation.x = Math.PI/2;
    axle.position.set(pos.x, pos.y, g.position.z-0.5); world.add(axle);
    world.add(g); gears.push(g); prevR = r;
  }
}
const gearPhase = gears.map((g,i)=> i===0 ? 0 : dirs[i] + Math.PI/teeth[i]);

// ---------- escape wheel + anchor + pendulum (top centre) ----------
const ESC = new THREE.Vector3(0.15, 2.05, 0.55);
const escapeWheel = makeGear(30, 0.085, 0.14, brass, true);
escapeWheel.position.copy(ESC); world.add(escapeWheel);
{ const ax=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,1.6,12),steel);
  ax.rotation.x=Math.PI/2; ax.position.set(ESC.x,ESC.y,-0.2); world.add(ax); }

// anchor pivot sits above escape wheel; pendulum hangs from the same pivot
const PIVOT = new THREE.Vector3(ESC.x, ESC.y + 1.55, 0.55);
const swing = new THREE.Group(); swing.position.copy(PIVOT); world.add(swing);
{
  // anchor: curved yoke (torus arc) + two pallet blocks dipping into the wheel
  const arc = new THREE.Mesh(new THREE.TorusGeometry(1.32, 0.075, 12, 40, Math.PI*0.85), steel);
  arc.position.set(0,-1.55,0); arc.rotation.z = Math.PI*0.5 - Math.PI*0.425 + Math.PI; // arc opening downward over wheel
  arc.rotation.z = Math.PI + (Math.PI - Math.PI*0.85)/2;
  swing.add(arc);
  const armGeo = new THREE.BoxGeometry(0.1,1.45,0.09);
  [-1,1].forEach(s=>{
    const arm = new THREE.Mesh(armGeo, steel);
    arm.position.set(s*0.85,-0.75,0); arm.rotation.z = s*0.62; swing.add(arm);
    const pallet = new THREE.Mesh(new THREE.BoxGeometry(0.16,0.3,0.16), blued);
    const a = Math.PI/2 + s*0.95; // around escape wheel rim
    pallet.position.set(Math.cos(a)*1.28, -1.55 + Math.sin(a)*1.28, 0);
    pallet.rotation.z = a + s*0.5; swing.add(pallet);
  });
  const stem = new THREE.Mesh(new THREE.BoxGeometry(0.09,0.5,0.09), steel);
  stem.position.set(0,-0.15,0); swing.add(stem);
  // pendulum rod + bob (behind gears layer visually via z of group children)
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,5.1,10), darkSt);
  rod.position.set(0,-2.55,-0.55); swing.add(rod);
  const bob = new THREE.Mesh(new THREE.CylinderGeometry(0.52,0.52,0.14,36), brass);
  bob.rotation.x = Math.PI/2; bob.position.set(0,-4.95,-0.55); swing.add(bob);
  const bobRim = new THREE.Mesh(new THREE.TorusGeometry(0.52,0.045,10,36), copper);
  bobRim.position.copy(bob.position); swing.add(bobRim);
}
{ // pivot bridge (static)
  const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.22,0.9,0.14), brass2);
  bridge.position.set(PIVOT.x, PIVOT.y+0.35, 0.35); world.add(bridge);
  const screw = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.3,16), steel);
  screw.rotation.x=Math.PI/2; screw.position.copy(PIVOT).z += 0.1; world.add(screw);
}

// ---------- dial with second + minute hands (1:60) ----------
const DIAL = new THREE.Vector3(3.55, 2.35, 0.35);
let secHand, minHand;
{
  const dial = new THREE.Group(); dial.position.copy(DIAL); world.add(dial);
  const face = new THREE.Mesh(new THREE.CylinderGeometry(1.35,1.35,0.08,48), cream);
  face.rotation.x = Math.PI/2; dial.add(face);
  const bezel = new THREE.Mesh(new THREE.TorusGeometry(1.35,0.09,14,64), brass);
  bezel.position.z = 0.05; dial.add(bezel);
  for(let i=0;i<60;i++){
    const big = i%5===0, a = i/60*Math.PI*2;
    const tick = new THREE.Mesh(new THREE.BoxGeometry(big?0.06:0.025, big?0.22:0.11, 0.03), darkSt);
    tick.position.set(Math.sin(a)*1.18, Math.cos(a)*1.18, 0.06); tick.rotation.z = -a; dial.add(tick);
  }
  function hand(len,w,tail,mat,z){
    const h = new THREE.Group(); h.position.z = z;
    const blade = new THREE.Mesh(new THREE.BoxGeometry(w,len,0.025), mat);
    blade.position.y = len/2 - tail; h.add(blade);
    const tip = new THREE.Mesh(new THREE.ConeGeometry(w*0.9,0.16,4), mat);
    tip.position.y = len - tail + 0.06; tip.rotation.y = Math.PI/4; h.add(tip);
    dial.add(h); return h;
  }
  minHand = hand(0.92, 0.09, 0.18, blued, 0.12);
  secHand = hand(1.12, 0.035, 0.30, redM, 0.18);
  const cw = new THREE.Mesh(new THREE.SphereGeometry(0.06,12,10), redM);
  cw.position.set(0,-0.3,0); secHand.add(cw);
  const centre = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.14,20), brass);
  centre.rotation.x=Math.PI/2; centre.position.z=0.16; dial.add(centre);
  const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,1.4,12), steel);
  stalk.rotation.x=Math.PI/2; stalk.position.set(DIAL.x,DIAL.y,-0.4); world.add(stalk);
}

// ---------- cam + follower + hammer + bell (bottom right) ----------
// Cam profile shared by geometry AND follower lift so contact is exact.
const CAM_R0 = 0.42, CAM_H = 0.20, CAM_LOBES = 3;
function camRadius(theta){ // smooth 3-lobe rise, sharp drop -> strike
  const ph = ((theta*CAM_LOBES)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
  const t = ph/(Math.PI*2);
  return CAM_R0 + CAM_H * Math.pow(Math.max(0,Math.sin(t*Math.PI)),1.5) * (t<0.85?1: Math.max(0,(1-t)/0.15));
}
const CAM_POS = new THREE.Vector3(3.15,-1.55,0.15);
const cam = new THREE.Group(); cam.position.copy(CAM_POS);
{
  const shape = new THREE.Shape();
  for(let i=0;i<=160;i++){
    const a=i/160*Math.PI*2, r=camRadius(a), x=Math.cos(a)*r, y=Math.sin(a)*r;
    i===0?shape.moveTo(x,y):shape.lineTo(x,y);
  }
  const geo = new THREE.ExtrudeGeometry(shape,{depth:0.16,bevelEnabled:true,bevelThickness:0.01,bevelSize:0.01,bevelSegments:1});
  geo.translate(0,0,-0.08);
  cam.add(new THREE.Mesh(geo, copper));
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.34,18), steel);
  hub.rotation.x=Math.PI/2; cam.add(hub);
  // small pinion coaxial with cam (visual link to train)
  const pin = makeGear(14, MODULE_, 0.14, brass); pin.position.z=-0.28; cam.add(pin);
  world.add(cam);
  const ax=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,1.2,12),steel);
  ax.rotation.x=Math.PI/2; ax.position.set(CAM_POS.x,CAM_POS.y,-0.5); world.add(ax);
}
// follower arm pivoting above-left of cam; roller rides cam top; hammer on same arm
const FOL_PIVOT = new THREE.Vector3(2.15,-0.55,0.15);
const follower = new THREE.Group(); follower.position.copy(FOL_PIVOT); world.add(follower);
{
  const armLen = CAM_POS.x - FOL_PIVOT.x; // roller sits over cam centre (contact at cam top)
  const arm = new THREE.Mesh(new THREE.BoxGeometry(armLen+0.5,0.09,0.09), steel);
  arm.position.set((armLen+0.5)/2 - 0.15, 0, 0); follower.add(arm);
  const drop = new THREE.Mesh(new THREE.BoxGeometry(0.08,0.5,0.08), steel);
  drop.position.set(armLen,-0.22,0); follower.add(drop);
  const roller = new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.11,0.2,20), blued);
  roller.rotation.x=Math.PI/2; roller.position.set(armLen,-0.48,0); follower.add(roller);
  follower.userData.roller = roller;
  // hammer: shaft rising from arm end + head, bell is to the right
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.045,1.05,10), darkSt);
  shaft.position.set(armLen+0.32,0.45,0); shaft.rotation.z=-0.35; follower.add(shaft);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.14,18,14), brass);
  head.position.set(armLen+0.5,0.92,0); follower.add(head);
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.14,0.5,0.14), brass2);
  post.position.set(FOL_PIVOT.x, FOL_PIVOT.y-0.2, -0.15); world.add(post);
}
// bell (lathe profile) on a stand
const bell = new THREE.Group(); bell.position.set(4.35,-0.15,0.15); world.add(bell);
{
  const pts=[];
  pts.push(new THREE.Vector2(0.02,0.62));
  pts.push(new THREE.Vector2(0.20,0.58));
  pts.push(new THREE.Vector2(0.34,0.42));
  pts.push(new THREE.Vector2(0.40,0.18));
  pts.push(new THREE.Vector2(0.48,0.02));
  pts.push(new THREE.Vector2(0.52,-0.05));
  const dome = new THREE.Mesh(new THREE.LatheGeometry(pts,36), brass);
  bell.add(dome);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.08,14,10), copper);
  knob.position.y=0.66; bell.add(knob);
  const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.09,1.5,12), darkSt);
  stand.position.y=-0.85; bell.add(stand);
}

// ---------- decorative screws on plate ----------
{
  const sg = new THREE.CylinderGeometry(0.07,0.07,0.06,6);
  [[-5,3.6],[5,3.6],[-5,-3.6],[5,-3.6],[0,3.85]].forEach(([x,y],i)=>{
    const s=new THREE.Mesh(sg, steel); s.rotation.x=Math.PI/2; s.rotation.z=i*0.7;
    s.position.set(x,y,-1.0); world.add(s);
  });
}

// ============================================================
//  ONE MASTER ANGLE drives everything.
//  M = angle of the second hand (1 rev per 60 clock-seconds).
//  Clock runs 2x real time so the ticking is lively; every
//  ratio below is still exact. Derived quantities:
//    clockSeconds s = 30*M/PI        (60 ticks per rev of M)
//    pendulum       = A*sin(30*M)    (period 2 clock-sec, tick each swing)
//    minute hand    = M/60           (true 1:60)
//    escape wheel   = stepped(M)     (one of 30 teeth per tick)
//    gear train     = chained -Ni-1/Ni ratios from M
//    cam (3 lobes)  = 20*M           (one lobe -> one strike per tick)
// ============================================================
const SPEED = Math.PI*2/30; // M rate: full second-hand rev in 30 real seconds
function snapStep(s){ // escape advance: quick jump after pallet release, tiny recoil, then dwell
  const idx = Math.floor(s), f = s - idx;
  const jump = THREE.MathUtils.smoothstep(f, 0.0, 0.16);
  const recoil = -0.06 * Math.exp(-Math.pow((f-0.30)*9,2));
  return idx + jump + recoil*jump;
}
const clock = new THREE.Clock();
let M = 0, bellRing = 0, lastTick = -1;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  M += dt * SPEED;                        // <-- the single master angle
  const s = 30*M/Math.PI;                 // clock-seconds from M

  // pendulum + anchor (same rigid group): swings, ticks each half-period
  const pend = 0.30 * Math.sin(30*M);
  swing.rotation.z = pend;

  // escape wheel: stepped advance, 30 teeth, one tooth per tick
  escapeWheel.rotation.z = -snapStep(s) * (Math.PI*2/30);

  // gear train chained from M with exact tooth ratios, alternating direction
  let ang = M * 6; // first wheel speed (arbitrary take-off ratio, still from M)
  for(let i=0;i<gears.length;i++){
    if(i>0) ang = -ang * (teeth[i-1]/teeth[i]);
    // store chain value per gear: recompute progressively
    gears[i].rotation.z = (i===0 ? M*6 : gears[i].userData.chain) ;
    if(i===0) gears[i].userData.chain = M*6;
    else gears[i].userData.chain = -gears[i-1].userData.chain * (teeth[i-1]/teeth[i]);
    gears[i].rotation.z = gears[i].userData.chain + gearPhase[i];
  }

  // dial hands: second = M (with mechanical step to match the tick), minute = M/60
  secHand.rotation.z = -snapStep(s) * (Math.PI*2/60);
  minHand.rotation.z = -M/60;

  // cam + follower + hammer: 3-lobe cam, one strike per tick, synced to escapement
  const camAng = 20*M;
  cam.rotation.z = camAng;
  const lift = camRadius(Math.PI/2 - camAng) - CAM_R0; // radius at top contact point
  follower.rotation.z = -0.06 - lift*1.15;             // arm rises, hammer cocks back... then drops
  follower.userData.roller.rotation.z = -camAng*3;

  // bell shiver on each tick (strike lands as escape tooth releases)
  const tickIdx = Math.floor(s);
  if(tickIdx !== lastTick){ lastTick = tickIdx; bellRing = 1; }
  bellRing *= Math.exp(-dt*7);
  bell.rotation.z = Math.sin(t*55) * 0.05 * bellRing;
  bell.scale.setScalar(1 + 0.012*bellRing*Math.sin(t*70));
  glow.intensity = 26 + 14*bellRing;

  // subtle camera drift, always framing the whole mechanism
  camera.position.x = Math.sin(t*0.11)*0.9;
  camera.position.y = 0.4 + Math.sin(t*0.073+1.3)*0.55;
  camera.position.z = 15 + Math.sin(t*0.05)*0.6;
  camera.lookAt(0,-0.15,0);
  world.rotation.y = Math.sin(t*0.07)*0.03;

  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
