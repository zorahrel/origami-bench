<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SDF Raymarcher</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl',{antialias:false})||canvas.getContext('experimental-webgl');
if(!gl){document.body.innerHTML='<p style="color:#fff;font:16px sans-serif;padding:20px">WebGL not supported</p>';return;}

const vs=`attribute vec2 aPos;void main(){gl_Position=vec4(aPos,0.0,1.0);}`;

const fs=`precision highp float;
uniform vec2 uRes;
uniform float uTime;

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float smin(float a,float b,float k){float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0);return mix(b,a,h)-k*h*(1.0-h);}
float sdSphere(vec3 p,float r){return length(p)-r;}
float sdTorus(vec3 p,vec2 t){vec2 q=vec2(length(p.xz)-t.x,p.y);return length(q)-t.y;}
float sdBox(vec3 p,vec3 b,float r){vec3 q=abs(p)-b;return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0)-r;}
float sdCapsule(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);return length(pa-ba*h)-r;}

float objects(vec3 p){
  float t=uTime;
  float k=0.3+0.22*sin(t*0.7);
  float s=sdSphere(p-vec3(sin(t)*1.2,1.0+0.35*sin(t*1.3),cos(t*0.8)*0.7),0.55);
  vec3 q=p-vec3(0.0,1.05,0.0);
  q.yz=rot(t*0.5)*q.yz;
  q.xy=rot(t*0.3)*q.xy;
  float to=sdTorus(q,vec2(0.95,0.17));
  vec3 bq=p-vec3(-1.3*cos(t*0.6),0.75+0.2*sin(t*0.9),1.0*sin(t*0.5));
  bq.xz=rot(t)*bq.xz;
  bq.xy=rot(t*0.7)*bq.xy;
  float bx=sdBox(bq,vec3(0.32),0.06);
  vec3 a=vec3(1.4,0.35,-0.6);
  vec3 b=vec3(1.4+0.6*sin(t*0.8),1.7,-0.6+0.6*cos(t*0.8));
  float cp=sdCapsule(p,a,b,0.2);
  float d=smin(s,to,k);
  d=smin(d,bx,k);
  d=smin(d,cp,k);
  return d;
}

vec2 map(vec3 p){
  float o=objects(p);
  float f=p.y;
  float d=smin(o,f,0.15);
  return vec2(d,o<f?1.0:0.0);
}

vec3 calcNormal(vec3 p){
  const vec2 e=vec2(1.0,-1.0)*0.0008;
  return normalize(e.xyy*map(p+e.xyy).x+e.yyx*map(p+e.yyx).x+e.yxy*map(p+e.yxy).x+e.xxx*map(p+e.xxx).x);
}

vec2 march(vec3 ro,vec3 rd,float tmax){
  float t=0.0;float m=-1.0;
  for(int i=0;i<120;i++){
    vec2 h=map(ro+rd*t);
    if(h.x<0.0008*t+0.0005){m=h.y;break;}
    t+=h.x;
    if(t>tmax){m=-1.0;break;}
  }
  if(t>tmax)m=-1.0;
  return vec2(t,m);
}

float softShadow(vec3 ro,vec3 rd,float mint,float maxt,float k){
  float res=1.0;float t=mint;
  for(int i=0;i<48;i++){
    float h=map(ro+rd*t).x;
    res=min(res,k*h/t);
    t+=clamp(h,0.02,0.25);
    if(res<0.002||t>maxt)break;
  }
  return clamp(res,0.0,1.0);
}

float calcAO(vec3 p,vec3 n){
  float occ=0.0;float sca=1.0;
  for(int i=0;i<5;i++){
    float h=0.01+0.12*float(i);
    float d=map(p+n*h).x;
    occ+=(h-d)*sca;
    sca*=0.9;
  }
  return clamp(1.0-2.5*occ,0.0,1.0);
}

vec3 sky(vec3 rd){
  vec3 c=mix(vec3(0.55,0.65,0.85),vec3(0.08,0.12,0.3),clamp(rd.y*1.4,0.0,1.0));
  vec3 sd=normalize(vec3(0.6,0.7,0.4));
  c+=vec3(1.0,0.8,0.55)*pow(max(dot(rd,sd),0.0),64.0)*2.0;
  return c;
}

vec3 albedo(vec3 p,float m){
  if(m<0.5){
    float ch=mod(floor(p.x*1.2)+floor(p.z*1.2),2.0);
    return mix(vec3(0.18),vec3(0.55),ch)*vec3(1.0,0.97,0.92);
  }
  return 0.5+0.5*cos(6.2831*(vec3(0.0,0.33,0.67)+p.y*0.35+length(p.xz)*0.25+uTime*0.08));
}

vec3 shade(vec3 p,vec3 n,vec3 rd,float m,bool full){
  vec3 lig=normalize(vec3(0.6,0.7,0.4));
  vec3 col=albedo(p,m);
  float dif=clamp(dot(n,lig),0.0,1.0);
  float sha=full?softShadow(p+n*0.01,lig,0.02,8.0,10.0):1.0;
  float ao=full?calcAO(p,n):1.0;
  vec3 hal=normalize(lig-rd);
  float spe=pow(clamp(dot(n,hal),0.0,1.0),48.0)*dif*sha;
  float amb=0.5+0.5*n.y;
  float fre=pow(1.0-clamp(dot(n,-rd),0.0,1.0),3.0);
  vec3 lin=vec3(0.0);
  lin+=dif*sha*vec3(1.3,1.1,0.9)*2.2;
  lin+=amb*ao*vec3(0.35,0.42,0.6);
  lin+=clamp(dot(n,-lig*vec3(1.0,0.0,1.0)),0.0,1.0)*ao*vec3(0.25,0.2,0.18);
  vec3 c=col*lin+spe*vec3(1.0,0.9,0.8)*1.5;
  if(m>0.5){
    vec3 glow=0.5+0.5*cos(6.2831*(vec3(0.6,0.75,0.9)+uTime*0.1));
    c+=fre*glow*1.6*ao;
  }
  return c;
}

vec3 aces(vec3 x){
  return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0);
}

void main(){
  vec2 uv=(2.0*gl_FragCoord.xy-uRes)/uRes.y;
  float t=uTime;
  float ang=t*0.22;
  vec3 ro=vec3(4.8*cos(ang),2.0+0.7*sin(t*0.31),4.8*sin(ang));
  vec3 ta=vec3(0.25*sin(t*0.4),0.9+0.15*sin(t*0.5),0.25*cos(t*0.35));
  vec3 ww=normalize(ta-ro);
  vec3 uu=normalize(cross(ww,vec3(0.0,1.0,0.0)));
  vec3 vv=cross(uu,ww);
  vec3 rd=normalize(uv.x*uu+uv.y*vv+1.8*ww);

  vec3 col=sky(rd);
  vec2 h=march(ro,rd,30.0);
  if(h.y>-0.5){
    vec3 p=ro+rd*h.x;
    vec3 n=calcNormal(p);
    col=shade(p,n,rd,h.y,true);
    float fre=pow(1.0-clamp(dot(n,-rd),0.0,1.0),5.0);
    float refl=h.y>0.5?mix(0.15,1.0,fre):mix(0.06,0.6,fre);
    vec3 rr=reflect(rd,n);
    vec3 ro2=p+n*0.02;
    vec2 h2=march(ro2,rr,15.0);
    vec3 rc=sky(rr);
    if(h2.y>-0.5){
      vec3 p2=ro2+rr*h2.x;
      vec3 n2=calcNormal(p2);
      rc=shade(p2,n2,rr,h2.y,false);
    }
    col=mix(col,rc,refl);
    col=mix(col,sky(rd)*0.9,1.0-exp(-0.0025*h.x*h.x));
  }
  col=aces(col*0.9);
  col=pow(col,vec3(1.0/2.2));
  vec2 q=gl_FragCoord.xy/uRes;
  col*=0.55+0.45*pow(16.0*q.x*q.y*(1.0-q.x)*(1.0-q.y),0.2);
  gl_FragColor=vec4(col,1.0);
}`;

function compile(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s));return null;}
  return s;
}
const prog=gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,vs));
gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){console.error(gl.getProgramInfoLog(prog));return;}
gl.useProgram(prog);

const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,'aPos');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

const uRes=gl.getUniformLocation(prog,'uRes');
const uTime=gl.getUniformLocation(prog,'uTime');

function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,1.25);
  const w=Math.floor(window.innerWidth*dpr),h=Math.floor(window.innerHeight*dpr);
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
  gl.viewport(0,0,canvas.width,canvas.height);
}
window.addEventListener('resize',resize);
resize();

const start=performance.now();
function frame(now){
  resize();
  gl.uniform2f(uRes,canvas.width,canvas.height);
  gl.uniform1f(uTime,(now-start)*0.001);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
