<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Parkour Fighter</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#10131c;font-family:system-ui,Segoe UI,Arial,sans-serif}
canvas{display:block}
#ph{position:fixed;top:22px;left:28px;color:#fff;font-size:34px;font-weight:800;letter-spacing:4px;text-shadow:0 0 12px #ff3399,0 2px 4px #000}
#sub{position:fixed;top:68px;left:30px;color:#9ab;font-size:13px;letter-spacing:3px}
#bar{position:fixed;top:90px;left:30px;width:220px;height:4px;background:#ffffff22;border-radius:2px}
#fill{height:100%;width:0;background:#ff3399;border-radius:2px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none}
</style></head><body>
<div id="ph">RUN</div><div id="sub">PARKOUR · COMBAT LOOP</div><div id="bar"><div id="fill"></div></div><div id="fade"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x10131c);S.fog=new THREE.Fog(0x10131c,12,40);
const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,100);cam.position.set(-15,3,9);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
S.add(new THREE.HemisphereLight(0x8899cc,0x221a14,0.7));
const sun=new THREE.DirectionalLight(0xfff1dd,2.3);sun.position.set(8,14,9);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera;sc.left=sc.bottom=-16;sc.right=sc.top=16;sc.near=1;sc.far=50;sun.shadow.bias=-0.0005;S.add(sun);
const pl=new THREE.PointLight(0xff3399,25,16,1.5);S.add(pl);
const pl2=new THREE.PointLight(0x33ccff,18,14,1.5);pl2.position.set(0,4,0);S.add(pl2);
function tex(n,draw,rx,ry){const c=document.createElement('canvas');c.width=c.height=n;draw(c.getContext('2d'));const t=new THREE.CanvasTexture(c);
t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t}
const floorT=tex(128,g=>{g.fillStyle='#2a2f3a';g.fillRect(0,0,128,128);g.fillStyle='#cfc9bb';g.fillRect(0,0,64,64);g.fillRect(64,64,64,64)},15,15);
const wallT=tex(256,g=>{g.fillStyle='#f2b705';g.fillRect(0,0,256,256);g.fillStyle='#181818';
for(let i=-256;i<512;i+=64){g.beginPath();g.moveTo(i,0);g.lineTo(i+32,0);g.lineTo(i+288,256);g.lineTo(i+256,256);g.fill()}},6,2.5);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({map:floorT,roughness:.85}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;S.add(floor);
const wall=new THREE.Mesh(new THREE.BoxGeometry(14,6,.4),new THREE.MeshStandardMaterial({map:wallT,roughness:.7}));
wall.position.set(0.5,3,-3.2);wall.castShadow=wall.receiveShadow=true;S.add(wall);
const pm=new THREE.MeshStandardMaterial({color:0x2b3045,roughness:.5}),em=new THREE.MeshStandardMaterial({color:0x33ccff,emissive:0x33ccff,emissiveIntensity:2});
for(const[x,z]of[[-13,-13],[13,-13],[-13,13],[13,13],[-13,0],[13,0]]){const p=new THREE.Mesh(new THREE.BoxGeometry(.8,3,.8),pm);p.position.set(x,1.5,z);p.castShadow=true;S.add(p);
const c=new THREE.Mesh(new THREE.BoxGeometry(.85,.15,.85),em);c.position.set(x,3.05,z);S.add(c)}
function mesh(geo,mat,par,x=0,y=0,z=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;par.add(m);return m}
function piv(par,x=0,y=0,z=0){const g=new THREE.Group();g.position.set(x,y,z);par.add(g);return g}
// dummy
const dg=piv(S,8.55,0,1),dm=new THREE.MeshStandardMaterial({color:0x444a55,metalness:.6,roughness:.4});
mesh(new THREE.CylinderGeometry(.35,.4,.1,20),dm,dg,.8,.05,0);mesh(new THREE.CylinderGeometry(.05,.05,2.2,10),dm,dg,.8,1.1,0);
mesh(new THREE.BoxGeometry(.85,.06,.06),dm,dg,.4,2.2,0);const bagP=piv(dg,0,2.2,0);
mesh(new THREE.CylinderGeometry(.012,.012,.4,6),dm,bagP,0,-.2,0);
const bagM=new THREE.MeshStandardMaterial({color:0x8a1e2e,roughness:.8,emissive:0xff3399,emissiveIntensity:0});
mesh(new THREE.CylinderGeometry(.24,.24,1,20),bagM,bagP,0,-.9,0);
// fighter
const mB=new THREE.MeshStandardMaterial({color:0x1d2b53,roughness:.55}),mL=new THREE.MeshStandardMaterial({color:0xff7a1a,roughness:.5}),
mS=new THREE.MeshStandardMaterial({color:0xe0b48a,roughness:.7}),mD=new THREE.MeshStandardMaterial({color:0x111111,roughness:.3});
const root=piv(S);root.rotation.order='YXZ';const flipG=piv(root),spinG=piv(flipG);
mesh(new THREE.BoxGeometry(.36,.2,.22),mB,spinG);mesh(new THREE.BoxGeometry(.38,.06,.24),mL,spinG,0,.08,0);
const torso=piv(spinG,0,.05,0);mesh(new THREE.BoxGeometry(.44,.52,.25),mB,torso,0,.32,0);mesh(new THREE.BoxGeometry(.2,.3,.02),mL,torso,0,.35,.13);
const head=piv(torso,0,.6,0);mesh(new THREE.SphereGeometry(.14,20,16),mS,head,0,.14,0);
mesh(new THREE.CylinderGeometry(.147,.147,.05,20),mL,head,0,.19,0);mesh(new THREE.BoxGeometry(.2,.05,.04),mD,head,0,.15,.12);
function limb(par,x,y,l1,r1,l2,r2,leg){const a=piv(par,x,y,0);mesh(new THREE.CapsuleGeometry(r1,l1*.75,4,10),leg?mB:mL,a,0,-l1/2,0);
const b=piv(a,0,-l1,0);mesh(new THREE.CapsuleGeometry(r2,l2*.75,4,10),leg?mB:mL,b,0,-l2/2,0);const c=piv(b,0,-l2,0);
if(leg)mesh(new THREE.BoxGeometry(.11,.08,.26),mD,c,0,-.035,.06);else mesh(new THREE.SphereGeometry(.07,12,10),mS,c);return{a,b,c}}
const LA=limb(torso,.28,.55,.3,.065,.28,.055),RA=limb(torso,-.28,.55,.3,.065,.28,.055),
LL=limb(spinG,.11,-.05,.45,.085,.45,.07,1),RL=limb(spinG,-.11,-.05,.45,.085,.45,.07,1);
const K=['tb','tw','hd','lsh','rsh','lsz','rsz','lel','rel','lh','rh','lk','rk','lhz','rhz'];
const Z=()=>Object.fromEntries(K.map(k=>[k,0]));let cur=Z();
function apply(p){torso.rotation.set(p.tb,p.tw,0);head.rotation.x=p.hd;
LA.a.rotation.set(-p.lsh,0,p.lsz);RA.a.rotation.set(-p.rsh,0,-p.rsz);LA.b.rotation.x=-p.lel;RA.b.rotation.x=-p.rel;
LL.a.rotation.set(-p.lh,0,p.lhz);RL.a.rotation.set(-p.rh,0,-p.rhz);LL.b.rotation.x=p.lk;RL.b.rotation.x=p.rk;
LL.c.rotation.x=p.lh-p.lk;RL.c.rotation.x=p.rh-p.rk}
const legH=(h,k,z)=>(.05+.45*Math.cos(h)+.45*Math.cos(h-k))*Math.cos(z)+.075;
const ground=p=>Math.max(legH(p.lh,p.lk,p.lhz),legH(p.rh,p.rk,p.rhz));
const ease=u=>u*u*(3-2*u),cl=u=>Math.min(1,Math.max(0,u)),env=(u,a)=>u<a?ease(u/a):1-ease((u-a)/(1-a));
const mix=(a,b,s)=>{const o={};for(const k of K)o[k]=a[k]+(b[k]-a[k])*s;return o};
function stance(){const p=Z();Object.assign(p,{lh:.4,rh:-.15,lk:.65,rk:.5,tb:.15,lsh:.9,lel:1.9,rsh:.6,rel:2.1,lsz:.2,rsz:.2});return p}
const crouch=()=>Object.assign(Z(),{lh:1.4,rh:1.1,lk:2.3,rk:2.1,tb:.6,hd:-.4,lsz:1.1,rsz:1.1,lsh:.3,rsh:.3,lel:.3,rel:.3,lhz:.15,rhz:.15});
function runPose(c,tb){const p=Z(),s=Math.sin(c);Object.assign(p,{lh:.9*s,rh:-.9*s,lk:.3+1.2*Math.max(0,Math.cos(c)),rk:.3+1.2*Math.max(0,-Math.cos(c)),
tb,lsh:-.9*s,rsh:.9*s,lel:1.4,rel:1.4,lsz:.15,rsz:.15});return p}
const PH=[['RUN',2.2],['WALL RUN',2],['FLIP',1.1],['LAND',.7],['PUNCH',.8],['KICK',.8],['SPIN KICK',1.2],['RESET',1.2]];
const CAM=[[-4,2.2,5.5],[-1,1.3,7.5],[2,.9,7],[3.5,1.1,4],[0,1.6,5],[-1.6,1.4,4.6],[1.5,3,5.2],[-3,2.6,6]];
const HITS=[6.24,7.12,8.41],LX=7.6,LZ=1;
const phEl=document.getElementById('ph'),fill=document.getElementById('fill'),fade=document.getElementById('fade');
let T=0,prevT=0,last=performance.now(),yaw=1.93,roll=0,bagA=0,bagV=0,flash=0,lastPh=-1,snap=true;
const camT=new THREE.Vector3(),look=new THREE.Vector3(),lookT=new THREE.Vector3();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;const t=T%10;
if(t<prevT)snap=true;for(const h of HITS)if(prevT<h&&t>=h){bagV+=4.5;flash=1}prevT=t;
let i=0,acc=0;while(t>acc+PH[i][1])acc+=PH[i++][1];const u=(t-acc)/PH[i][1];
let P,x,y=null,z,yT=Math.PI/2,rT=0,flip=0,spin=0,fo=0;
if(i===0){const a=[-11,3],c=[-7,1.5],b=[-4,-2.1],v=1-u;x=v*v*a[0]+2*u*v*c[0]+u*u*b[0];z=v*v*a[1]+2*u*v*c[1]+u*u*b[1];
yT=Math.atan2(2*v*(c[0]-a[0])+2*u*(b[0]-c[0]),2*v*(c[1]-a[1])+2*u*(b[1]-c[1]));P=runPose(t*11,.35);fo=u<.12?1-u/.12:0}
else if(i===1){x=-4+8.5*u;z=-2.1;y=1+2.2*Math.sin(u*Math.PI*.6);rT=1.1*ease(cl(u/.15))*(1-ease(cl((u-.92)/.08))*.3);P=runPose(t*13,.3);P.hd=-.2}
else if(i===2){const s=Math.sin(Math.PI*u);x=4.5+(LX-4.5)*ease(u);z=-2.1+(LZ+2.1)*ease(u);y=3.1+(.62-3.1)*u+1.5*s;flip=2*Math.PI*ease(u);
P=Z();Object.assign(P,{lh:2.1*s,rh:2.1*s,lk:2.4*s,rk:2.4*s,lsh:1.3*s,rsh:1.3*s,lel:1.6,rel:1.6,tb:.7*s,hd:.3*s,lsz:.3,rsz:.3})}
else{x=LX;z=LZ;if(i===3)P=mix(crouch(),stance(),ease(u));
else if(i===4){const p=env(u,.3);P=stance();P.rsh=.6+1.05*p;P.rel=2.1*(1-p)+.05;P.tw=.55*p;P.lsh=.9-.4*p;x+=.15*p}
else if(i===5){const p=env(u,.4);P=stance();P.rh=-.15+1.75*p;P.rk=.5*(1-p)+1.4*Math.sin(Math.PI*Math.min(u/.4,1))*(1-p);P.tb=.15-.5*p;P.lk=.35;P.lh=.15}
else if(i===6){const q=Math.max(0,Math.sin(Math.PI*cl((u-.45)/.45)));P=stance();spin=-2*Math.PI*ease(u);
P.rhz=1.45*q;P.rk=.5*(1-q);P.rh=-.15+.3*q;P.lsz=.2+1.1*q;P.rsz=.2+.9*q;P.lel*=1-q*.7;P.lk=.4;P.tb=.15-.1*q}
else{const s=ease(cl(u/.5));P=mix(stance(),Object.assign(Z(),{lsz:.12,rsz:.12,lel:.15,rel:.15}),s);P.tb+=.45*Math.sin(Math.PI*cl((u-.35)/.4));fo=u>.75?(u-.75)/.25:0}}
const k=snap?1:1-Math.exp(-dt*16);cur=mix(cur,P,k);apply(cur);
if(y===null)y=ground(cur)+(i===0?.06*Math.abs(Math.sin(t*11)):0)+(i===6?.18*Math.sin(Math.PI*u):0);
const ky=snap?1:1-Math.exp(-dt*10);let dy=yT-yaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));yaw+=dy*ky;roll+=(rT-roll)*(snap?1:1-Math.exp(-dt*12));
root.position.set(x,y,z);root.rotation.set(0,yaw,roll);flipG.rotation.x=flip;spinG.rotation.y=spin;
// bag + lights
bagV+=(-45*bagA-3*bagV)*dt;bagA+=bagV*dt;bagP.rotation.z=bagA;flash=Math.max(0,flash-dt*4);bagM.emissiveIntensity=flash*1.5;
pl.intensity=25+140*flash;pl.position.set(x+2.2*Math.cos(T*.8),3,z+2.2*Math.sin(T*.8));
// camera
const o=CAM[i];camT.set(x+o[0],Math.max(.5,y+o[1]),z+o[2]);lookT.set(x+(i>=3?.5:0),y+.2,z);
if(snap){cam.position.copy(camT);look.copy(lookT)}else{cam.position.lerp(camT,1-Math.exp(-dt*2.2));look.lerp(lookT,1-Math.exp(-dt*5))}
cam.lookAt(look);snap=false;
if(i!==lastPh){phEl.textContent=PH[i][0];lastPh=i}fill.style.width=(t*10)+'%';fade.style.opacity=fo;
R.render(S,cam)}
requestAnimationFrame(frame);
</script></body></html>
