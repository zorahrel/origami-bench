<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Wall Run // Combat Loop</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080d15; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud {
    position: fixed; z-index: 2; top: 28px; left: 30px; width: min(360px, calc(100vw - 60px));
    color: #ecf8ff; font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    text-transform: uppercase; letter-spacing: .16em; pointer-events: none;
    text-shadow: 0 2px 12px #000a;
  }
  .eyebrow { color: #68e8f0; font-size: 10px; letter-spacing: .25em; }
  .phase { margin-top: 10px; font-size: clamp(16px, 2.2vw, 22px); font-weight: 700; letter-spacing: .07em; }
  .sub { margin-top: 5px; color: #9db5c6; font-size: 10px; letter-spacing: .12em; }
  .track { width: 100%; height: 2px; margin-top: 17px; overflow: hidden; background: #ffffff27; }
  .fill { width: 0; height: 100%; background: linear-gradient(90deg, #37dce9, #ff9c56); }
  .index { margin-top: 8px; color: #91a7b5; font-size: 9px; }
  .corner {
    position: fixed; right: 28px; bottom: 24px; color: #97afbf; font: 9px ui-monospace, monospace;
    letter-spacing: .2em; text-align: right; pointer-events: none; text-shadow: 0 2px 10px #000;
  }
  .corner b { color: #62e4e8; font-weight: 500; }
</style>
</head>
<body>
<div class="hud">
  <div class="eyebrow">ARCADIA TRAINING DECK &nbsp; / &nbsp; 07</div>
  <div class="phase" id="phase">SPRINT TO WALL</div>
  <div class="sub" id="sub">MOMENTUM SEQUENCE &nbsp; · &nbsp; LOOP 10.0 SEC</div>
  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="index" id="index">01 — APPROACH</div>
</div>
<div class="corner">COMBAT DRILL <b>● LIVE</b><br>NO. 04 &nbsp; / &nbsp; AR-7</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x09111c);
scene.fog = new THREE.Fog(0x09111c, 15, 36);

const camera = new THREE.PerspectiveCamera(43, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7, 5, 10);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xa9d9ff, 0x151b29, 1.8));
const keyLight = new THREE.DirectionalLight(0xffe4c6, 3.3);
keyLight.position.set(-5, 12, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -13;
keyLight.shadow.camera.right = 13;
keyLight.shadow.camera.top = 13;
keyLight.shadow.camera.bottom = -13;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 32;
keyLight.shadow.bias = -0.00025;
keyLight.shadow.normalBias = 0.025;
keyLight.shadow.radius = 5;
scene.add(keyLight);
const cyanLight = new THREE.PointLight(0x16d9ff, 48, 19, 2);
cyanLight.position.set(-4, 4.5, 1);
scene.add(cyanLight);
const amberLight = new THREE.PointLight(0xff643d, 24, 15, 2);
amberLight.position.set(6, 3, -5);
scene.add(amberLight);

const mat = (color, roughness = 0.55, metalness = 0.2, extra = {}) =>
  new THREE.MeshStandardMaterial({ color, roughness, metalness, ...extra });
const floorMat = mat(0xffffff, 0.88, 0.12);
const checker = document.createElement('canvas');
checker.width = checker.height = 512;
const ctx = checker.getContext('2d');
for (let y = 0; y < 8; y++) {
  for (let x = 0; x < 8; x++) {
    ctx.fillStyle = (x + y) % 2 ? '#1a2734' : '#111b28';
    ctx.fillRect(x * 64, y * 64, 64, 64);
  }
}
const floorTexture = new THREE.CanvasTexture(checker);
floorTexture.wrapS = floorTexture.wrapT = THREE.RepeatWrapping;
floorTexture.repeat.set(5, 5);
floorTexture.colorSpace = THREE.SRGBColorSpace;
floorTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
floorMat.map = floorTexture;

const floor = new THREE.Mesh(new THREE.PlaneGeometry(44, 44), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.03;
floor.receiveShadow = true;
scene.add(floor);

const dark = mat(0x121e2b, 0.8, 0.25);
const trim = mat(0x263b4c, 0.5, 0.45);
const cyan = mat(0x37dce8, 0.3, 0.45, { emissive: 0x0c6672, emissiveIntensity: 1.5 });
const amber = mat(0xffa34e, 0.35, 0.3, { emissive: 0x713112, emissiveIntensity: 1.1 });
function box(parent, size, position, material, cast = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(...size), material);
  m.position.set(...position);
  m.castShadow = cast;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
function cylinder(parent, top, bottom, height, position, material, sides = 12) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(top, bottom, height, sides), material);
  m.position.set(...position);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
function sphere(parent, radius, position, material, scale = [1, 1, 1]) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(radius, 16, 12), material);
  m.position.set(...position);
  m.scale.set(...scale);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

// Arena frame, floor markings, and the tall striped wall.
const lineMat = mat(0x47dfe5, 0.35, 0.15, { emissive: 0x168f9b, emissiveIntensity: 1.8 });
for (const [x, z, sx, sz] of [
  [0, 9, 20, 0.055], [0, -7, 20, 0.055], [-10, 1, 0.055, 16], [10, 1, 0.055, 16],
  [-7, 1, 0.035, 13], [7, 1, 0.035, 13]
]) box(scene, [sx, 0.025, sz], [x, 0.01, z], lineMat, false);

box(scene, [18.5, 6.4, 0.5], [0, 3.2, -3.55], dark);
for (let i = 0; i < 31; i++) {
  const x = -8.75 + i * 0.585;
  const stripe = i % 2 === 0 ? amber : mat(0x3a3034, 0.72, 0.15);
  box(scene, [0.34, 6.05, 0.075], [x, 3.2, -3.255], stripe);
}
for (const x of [-9.15, 9.15]) {
  box(scene, [0.11, 6.4, 0.18], [x, 3.2, -3.24], lineMat);
  cylinder(scene, 0.45, 0.52, 0.35, [x, 0.17, -2.7], trim, 16);
  cylinder(scene, 0.25, 0.3, 4.8, [x, 2.65, -2.7], dark, 12);
  cylinder(scene, 0.31, 0.31, 0.08, [x, 5.1, -2.7], cyan, 16);
}
// A few low, dark arena pylons and their luminous caps.
for (const [x, z] of [[-8, 5], [8, 5], [-8, -5.8], [8, -5.8]]) {
  cylinder(scene, 0.48, 0.62, 1.0, [x, 0.5, z], dark, 12);
  cylinder(scene, 0.35, 0.35, 0.1, [x, 1.05, z], lineMat, 16);
}

// Fighter: every limb is a jointed group, built from simple meshes.
const armor = mat(0x183047, 0.42, 0.55);
const armorLite = mat(0x35556a, 0.38, 0.55);
const jointMat = mat(0x101923, 0.65, 0.25);
const visorMat = mat(0x071821, 0.2, 0.45, { emissive: 0x12bac9, emissiveIntensity: 1.3 });
const gloveMat = mat(0x243b4b, 0.4, 0.45);
const fighter = new THREE.Group();
scene.add(fighter);
const pelvis = new THREE.Group();
pelvis.position.y = 0.95;
fighter.add(pelvis);
sphere(pelvis, 0.28, [0, 0, 0], armor, [1.05, 0.66, 0.78]);
box(pelvis, [0.48, 0.12, 0.48], [0, 0.02, -0.02], armorLite);
box(pelvis, [0.15, 0.09, 0.04], [0, -0.01, -0.263], cyan, false);

const torso = new THREE.Group();
torso.position.set(0, 0.08, 0);
pelvis.add(torso);
cylinder(torso, 0.31, 0.23, 0.27, [0, 0.1, 0], armor, 12);
const chest = cylinder(torso, 0.39, 0.29, 0.62, [0, 0.51, 0], armor, 12);
chest.scale.z = 0.78;
box(torso, [0.44, 0.34, 0.09], [0, 0.48, -0.285], armorLite);
box(torso, [0.28, 0.075, 0.035], [0, 0.57, -0.341], cyan, false);
box(torso, [0.055, 0.22, 0.035], [0, 0.42, -0.344], cyan, false);
for (const side of [-1, 1]) {
  sphere(torso, 0.19, [side * 0.39, 0.71, 0], armorLite, [1.18, 0.7, 1]);
  sphere(torso, 0.12, [side * 0.43, 0.73, -0.06], side < 0 ? cyan : amber, [1, 0.45, 0.8]);
}
cylinder(torso, 0.12, 0.14, 0.18, [0, 0.88, 0], jointMat, 12);
const head = new THREE.Group();
head.position.set(0, 0.9, 0);
torso.add(head);
sphere(head, 0.225, [0, 0.19, 0], armorLite, [0.88, 1.1, 0.91]);
box(head, [0.3, 0.115, 0.055], [0, 0.2, -0.195], visorMat);
box(head, [0.32, 0.055, 0.075], [0, 0.11, -0.17], armor);
box(head, [0.07, 0.12, 0.11], [0, 0.43, 0.005], amber);

function makeArm(side) {
  const shoulder = new THREE.Group();
  shoulder.position.set(side * 0.45, 0.66, 0);
  torso.add(shoulder);
  sphere(shoulder, 0.15, [0, 0, 0], jointMat);
  cylinder(shoulder, 0.155, 0.115, 0.48, [0, -0.25, 0], armorLite, 12);
  sphere(shoulder, 0.125, [0, -0.49, 0], jointMat);
  sphere(shoulder, 0.16, [side * 0.035, -0.03, 0], side < 0 ? cyan : amber, [1.2, 0.72, 1.05]);
  const elbow = new THREE.Group();
  elbow.position.y = -0.49;
  shoulder.add(elbow);
  cylinder(elbow, 0.12, 0.105, 0.43, [0, -0.22, 0], armor, 12);
  box(elbow, [0.22, 0.3, 0.12], [0, -0.23, -0.08], armorLite);
  sphere(elbow, 0.1, [0, -0.44, 0], jointMat);
  const hand = new THREE.Group();
  hand.position.y = -0.47;
  elbow.add(hand);
  sphere(hand, 0.13, [0, -0.015, 0], gloveMat, [0.9, 1, 0.83]);
  box(hand, [0.2, 0.09, 0.2], [0, 0.015, -0.06], side < 0 ? cyan : amber);
  for (let i = -1; i <= 1; i++) {
    box(hand, [0.055, 0.12, 0.08], [i * 0.06, -0.11, -0.035], gloveMat);
  }
  return { shoulder, elbow, hand };
}
const leftArm = makeArm(-1);
const rightArm = makeArm(1);

function makeLeg(side) {
  const hip = new THREE.Group();
  hip.position.set(side * 0.21, -0.04, 0);
  pelvis.add(hip);
  sphere(hip, 0.14, [0, 0, 0], jointMat);
  cylinder(hip, 0.17, 0.135, 0.45, [0, -0.22, 0], armorLite, 12);
  box(hip, [0.23, 0.26, 0.14], [side * 0.025, -0.22, -0.09], armor);
  sphere(hip, 0.12, [0, -0.45, 0], jointMat);
  const knee = new THREE.Group();
  knee.position.y = -0.45;
  hip.add(knee);
  sphere(knee, 0.13, [0, 0, -0.025], side < 0 ? cyan : amber, [1, 0.82, 0.9]);
  cylinder(knee, 0.12, 0.095, 0.44, [0, -0.22, 0], armor, 12);
  box(knee, [0.17, 0.28, 0.1], [0, -0.22, -0.09], armorLite);
  const ankle = new THREE.Group();
  ankle.position.y = -0.44;
  knee.add(ankle);
  box(ankle, [0.22, 0.15, 0.39], [0, -0.035, -0.13], armorLite);
  box(ankle, [0.19, 0.06, 0.18], [0, 0.025, -0.25], side < 0 ? cyan : amber, false);
  return { hip, knee, ankle };
}
const leftLeg = makeLeg(-1);
const rightLeg = makeLeg(1);

// Small training impact ring, lit only on the three combo beats.
const impactMat = new THREE.MeshStandardMaterial({
  color: 0x69f4ff, emissive: 0x36dce9, emissiveIntensity: 2.2,
  transparent: true, opacity: 0, roughness: 0.25, metalness: 0.1
});
const impact = new THREE.Mesh(new THREE.TorusGeometry(0.38, 0.025, 8, 28), impactMat);
impact.position.set(5.1, 1.25, 0.22);
impact.castShadow = false;
scene.add(impact);
const impactCore = new THREE.Mesh(new THREE.IcosahedronGeometry(0.09, 1), cyan);
impactCore.castShadow = false;
scene.add(impactCore);

const phaseEl = document.getElementById('phase');
const subEl = document.getElementById('sub');
const indexEl = document.getElementById('index');
const fillEl = document.getElementById('fill');
const phases = [
  ['SPRINT TO WALL', 'MOMENTUM SEQUENCE  ·  LOOP 10.0 SEC', '01 — APPROACH'],
  ['WALL RUN', 'STRIPE LINE  ·  LATERAL TRAVERSE', '02 — VERTICAL MOMENTUM'],
  ['PUSH OFF  /  FLIP', 'CLEAR THE WALL  ·  COMPLETE ROTATION', '03 — AIRBORNE'],
  ['LAND  /  CROUCH', 'ABSORB IMPACT  ·  SET THE BASE', '04 — RECOVERY'],
  ['COMBO 1  /  JAB', 'THREE-STRIKE STRING  ·  HIT 01', '05 — COMBAT'],
  ['COMBO 2  /  KICK', 'THREE-STRIKE STRING  ·  HIT 02', '05 — COMBAT'],
  ['COMBO 3  /  SPIN KICK', 'THREE-STRIKE STRING  ·  HIT 03', '05 — COMBAT'],
  ['RESET', 'RETURN TO THE START MARK', '06 — RESET']
];
let shownPhase = -1;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const smooth = (a, b, x) => {
  const t = clamp((x - a) / (b - a));
  return t * t * (3 - 2 * t);
};
const yawQ = new THREE.Quaternion();
const rollQ = new THREE.Quaternion();
const flipQ = new THREE.Quaternion();
const xAxis = new THREE.Vector3(1, 0, 0);
const zAxis = new THREE.Vector3(0, 0, 1);
const cameraTarget = new THREE.Vector3(0, 1, 0);
const cameraDesired = new THREE.Vector3();
const lookDesired = new THREE.Vector3();

function setOrientation(yaw, roll = 0, flip = 0) {
  yawQ.setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
  rollQ.setFromAxisAngle(zAxis, roll);
  flipQ.setFromAxisAngle(xAxis, flip);
  fighter.quaternion.copy(yawQ).multiply(rollQ).multiply(flipQ);
}
function neutralPose() {
  for (const a of [leftArm, rightArm]) {
    a.shoulder.rotation.set(0, 0, 0);
    a.elbow.rotation.set(0, 0, 0);
    a.hand.rotation.set(0, 0, 0);
  }
  for (const l of [leftLeg, rightLeg]) {
    l.hip.rotation.set(0, 0, 0);
    l.knee.rotation.set(0, 0, 0);
    l.ankle.rotation.set(0, 0, 0);
  }
  torso.rotation.set(0, 0, 0);
  head.rotation.set(0, 0, 0);
}
function runPose(time, amount = 1) {
  const s = Math.sin(time * 9);
  leftArm.shoulder.rotation.x = (0.14 - s * 0.72) * amount;
  rightArm.shoulder.rotation.x = (0.14 + s * 0.72) * amount;
  leftArm.elbow.rotation.x = 0.76 * amount;
  rightArm.elbow.rotation.x = 0.76 * amount;
  leftLeg.hip.rotation.x = s * 0.58 * amount;
  rightLeg.hip.rotation.x = -s * 0.58 * amount;
  leftLeg.knee.rotation.x = (0.12 + Math.max(0, -s) * 0.72) * amount;
  rightLeg.knee.rotation.x = (0.12 + Math.max(0, s) * 0.72) * amount;
  torso.rotation.x = -0.13 * amount;
}

const clock = new THREE.Clock();
let elapsed = 0;
const tempVec = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  const t = elapsed % 10;
  neutralPose();

  let phaseIndex, yaw = 0, roll = 0, flip = 0;
  let camOffset = new THREE.Vector3(7, 4.7, 8.5);
  let lookOffset = new THREE.Vector3(0, 1.0, -1.2);

  if (t < 1.7) {
    const u = t / 1.7;
    phaseIndex = 0;
    fighter.position.set(0, 0.18, 4.8 - 7.63 * u);
    yaw = 0;
    runPose(t, 1);
    camOffset.set(7, 4.8, 8.7);
    lookOffset.set(0, 1.05, -1.8);
  } else if (t < 3.55) {
    const u = (t - 1.7) / 1.85;
    phaseIndex = 1;
    fighter.position.set(3.8 * u, 0.18 + 0.72 * smooth(0, 0.16, u), -2.83);
    yaw = -Math.PI / 2 * smooth(0, 0.15, u);
    roll = -0.5 * smooth(0, 0.12, u) - 0.055 * Math.sin(u * Math.PI * 4);
    setOrientation(yaw, roll);
    runPose(t + 0.7, 0.9);
    leftArm.shoulder.rotation.z = -0.1;
    rightArm.shoulder.rotation.z = 0.1;
    camOffset.set(-4.4, 4.7, 7.7);
    lookOffset.set(0.6, 1.15, -0.5);
  } else if (t < 5.2) {
    const u = (t - 3.55) / 1.65;
    const e = smooth(0, 1, u);
    phaseIndex = 2;
    fighter.position.set(3.8 + 1.3 * u, 0.9 + 2.0 * Math.sin(Math.PI * u) - 0.72 * u, -2.83 + 2.33 * u);
    yaw = -Math.PI / 2 - Math.PI / 2 * e;
    roll = -0.5 * (1 - e);
    flip = Math.PI * 2 * u;
    setOrientation(yaw, roll, flip);
    leftArm.shoulder.rotation.x = 0.85;
    rightArm.shoulder.rotation.x = 0.85;
    leftArm.elbow.rotation.x = 1.08;
    rightArm.elbow.rotation.x = 1.08;
    leftLeg.hip.rotation.x = 0.48;
    rightLeg.hip.rotation.x = 0.48;
    leftLeg.knee.rotation.x = 1.12;
    rightLeg.knee.rotation.x = 1.12;
    camOffset.set(5.4, 5.1, 7.4);
    lookOffset.set(0, 1.25, 0.1);
  } else if (t < 5.8) {
    const u = (t - 5.2) / 0.6;
    phaseIndex = 3;
    fighter.position.set(5.1, 0.18 + 0.04 * (1 - u), -0.5);
    yaw = -Math.PI;
    setOrientation(yaw);
    const crouch = 1 - smooth(0, 1, u);
    leftLeg.hip.rotation.x = -0.25 * crouch;
    rightLeg.hip.rotation.x = -0.25 * crouch;
    leftLeg.knee.rotation.x = 1.24 * crouch;
    rightLeg.knee.rotation.x = 1.24 * crouch;
    leftLeg.ankle.rotation.x = -0.3 * crouch;
    rightLeg.ankle.rotation.x = -0.3 * crouch;
    torso.rotation.x = -0.22 * crouch;
    leftArm.shoulder.rotation.x = 0.32 * crouch;
    rightArm.shoulder.rotation.x = 0.32 * crouch;
    leftArm.elbow.rotation.x = 0.7 * crouch;
    rightArm.elbow.rotation.x = 0.7 * crouch;
    camOffset.set(5.0, 4.5, 7.3);
    lookOffset.set(0, 1.05, 0);
  } else if (t < 8.5) {
    const u = t - 5.8;
    phaseIndex = u < 0.85 ? 4 : u < 1.75 ? 5 : 6;
    fighter.position.set(5.1, 0.18, -0.5);
    yaw = -Math.PI;
    let spin = 0;
    const punch = smooth(0.03, 0.25, u) * (1 - smooth(0.55, 0.8, u));
    const kickT = (u - 0.82) / 0.88;
    const kick = smooth(0.12, 0.38, kickT) * (1 - smooth(0.63, 0.92, kickT));
    const spinT = (u - 1.76) / 0.84;
    const spinMix = smooth(0, 0.15, spinT) * (1 - smooth(0.87, 1, spinT));
    spin = 2 * Math.PI * clamp(spinT);
    const spinKick = smooth(0.16, 0.38, spinT) * (1 - smooth(0.68, 0.88, spinT));
    yaw += spin;
    roll = 0.12 * Math.sin(spinT * Math.PI * 2) * spinMix;
    setOrientation(yaw, roll);
    // Guard, jab, round kick, then a turning finish.
    leftArm.shoulder.rotation.x = 0.42 + 0.18 * punch;
    leftArm.elbow.rotation.x = 0.82;
    rightArm.shoulder.rotation.x = 1.24 * punch + 0.22 * (1 - punch) + 0.55 * spinMix;
    rightArm.shoulder.rotation.z = -0.12 * punch;
    rightArm.elbow.rotation.x = 0.72 * (1 - punch) + 0.1 * punch + 0.38 * spinMix;
    leftLeg.hip.rotation.x = -0.28 - 1.3 * spinKick;
    leftLeg.knee.rotation.x = 0.18 + 0.18 * spinKick;
    rightLeg.hip.rotation.x = -0.18 - 1.25 * kick;
    rightLeg.knee.rotation.x = 0.28 * (1 - kick) + 0.04 * kick;
    rightLeg.ankle.rotation.x = -0.1 * kick;
    torso.rotation.y = -0.2 * punch + 0.22 * kick + 0.16 * spinMix;
    torso.rotation.x = -0.08 + 0.05 * Math.sin(u * 5);
    leftArm.shoulder.rotation.z = 0.15 * spinMix;
    const hit = Math.max(
      Math.max(0, 1 - Math.abs(u - 0.39) / 0.2),
      Math.max(0, 1 - Math.abs(u - 1.27) / 0.22),
      Math.max(0, 1 - Math.abs(u - 2.34) / 0.25)
    );
    impact.position.set(5.1, 1.2, 0.23);
    impact.scale.setScalar(0.55 + hit * 1.1);
    impactMat.opacity = hit * 0.9;
    impactCore.position.set(5.1, 1.2, 0.23);
    impactCore.scale.setScalar(0.4 + hit * 1.6);
    camOffset.set(5.3, 4.2, 7.2);
    lookOffset.set(0, 1.05, 0.1);
  } else {
    const u = (t - 8.5) / 1.5;
    const e = smooth(0, 1, u);
    phaseIndex = 7;
    fighter.position.set(5.1 * (1 - e), 0.18, -0.5 + 5.3 * e);
    const turn = smooth(0.64, 1, u);
    yaw = -Math.PI + Math.PI * turn;
    setOrientation(yaw);
    runPose(t, 0.42);
    camOffset.set(6.2, 4.7, 8.5);
    lookOffset.set(0, 1.05, 0);
  }

  if (phaseIndex !== 1 && phaseIndex !== 2 && !(t >= 5.8 && t < 8.5)) {
    setOrientation(yaw, roll, flip);
  }
  if (!(t >= 5.8 && t < 8.5)) {
    impactMat.opacity = 0;
    impact.scale.setScalar(0.1);
    impactCore.scale.setScalar(0.01);
  }
  if (phaseIndex !== shownPhase) {
    shownPhase = phaseIndex;
    phaseEl.textContent = phases[phaseIndex][0];
    subEl.textContent = phases[phaseIndex][1];
    indexEl.textContent = phases[phaseIndex][2];
  }
  fillEl.style.width = `${(t / 10) * 100}%`;

  cameraDesired.set(
    fighter.position.x + camOffset.x,
    fighter.position.y + camOffset.y,
    fighter.position.z + camOffset.z
  );
  lookDesired.set(
    fighter.position.x + lookOffset.x,
    fighter.position.y + lookOffset.y,
    fighter.position.z + lookOffset.z
  );
  const follow = 1 - Math.exp(-dt * 2.6);
  camera.position.lerp(cameraDesired, follow);
  cameraTarget.lerp(lookDesired, follow);
  camera.lookAt(cameraTarget);
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
});
</script>
</body>
</html>
