<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbiting SDF Forms</title>
<style>
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080b15; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const vertexShader = `
varying vec2 vUv;
void main() {
  vUv = uv;
  gl_Position = vec4(position.xy, 0.0, 1.0);
}
`;

const fragmentShader = `
precision highp float;

uniform vec2 uResolution;
uniform float uTime;
varying vec2 vUv;

vec2 smoothUnion(vec2 a, vec2 b, float k) {
  float h = clamp(0.5 + 0.5 * (b.x - a.x) / k, 0.0, 1.0);
  return vec2(mix(b.x, a.x, h) - k * h * (1.0 - h), mix(b.y, a.y, h));
}

float sdSphere(vec3 p, float r) {
  return length(p) - r;
}

float sdBox(vec3 p, vec3 b) {
  vec3 q = abs(p) - b;
  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
}

float sdTorus(vec3 p, vec2 t) {
  return length(vec2(length(p.xz) - t.x, p.y)) - t.y;
}

float sdCapsule(vec3 p, vec3 a, vec3 b, float r) {
  vec3 pa = p - a;
  vec3 ba = b - a;
  float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h) - r;
}

vec2 mapScene(vec3 p) {
  float t = uTime;

  vec3 sphereP = p - vec3(-1.45 + 0.07 * sin(t * 0.8), -0.67 + 0.04 * sin(t * 1.1), 0.0);
  vec2 scene = vec2(sdSphere(sphereP, 0.62), 1.0);

  vec3 torusP = p - vec3(-0.45 + 0.06 * sin(t * 0.7 + 0.6), -1.10 + 0.035 * cos(t * 0.9), 0.0);
  scene = smoothUnion(scene, vec2(sdTorus(torusP, vec2(0.48, 0.17)), 2.0), 0.28);

  vec3 boxP = p - vec3(0.55 + 0.05 * cos(t * 0.75), -0.80 + 0.04 * sin(t * 0.9 + 1.0), 0.0);
  float boxAngle = 0.12 * sin(t * 0.45);
  boxP.xz = mat2(cos(boxAngle), -sin(boxAngle), sin(boxAngle), cos(boxAngle)) * boxP.xz;
  scene = smoothUnion(scene, vec2(sdBox(boxP, vec3(0.48)), 3.0), 0.28);

  vec3 capsuleP = p - vec3(1.55 + 0.06 * sin(t * 0.65 + 1.2), -0.72 + 0.04 * cos(t * 0.8), 0.0);
  scene = smoothUnion(scene, vec2(sdCapsule(capsuleP, vec3(0.0, -0.30, 0.0), vec3(0.0, 0.30, 0.0), 0.28), 4.0), 0.28);

  float floorD = p.y + 1.30;
  if (floorD < scene.x) scene = vec2(floorD, 5.0);
  return scene;
}

vec3 getNormal(vec3 p) {
  const float e = 0.0012;
  const vec2 k = vec2(1.0, -1.0);
  return normalize(
    k.xyy * mapScene(p + k.xyy * e).x +
    k.yyx * mapScene(p + k.yyx * e).x +
    k.yxy * mapScene(p + k.yxy * e).x +
    k.xxx * mapScene(p + k.xxx * e).x
  );
}

vec2 rayMarch(vec3 ro, vec3 rd, float maxDistance, int maxSteps) {
  float distanceTravelled = 0.0;
  for (int i = 0; i < 100; i++) {
    if (i >= maxSteps) break;
    vec2 hit = mapScene(ro + rd * distanceTravelled);
    if (hit.x < 0.0012) return vec2(distanceTravelled, hit.y);
    distanceTravelled += max(hit.x, 0.001);
    if (distanceTravelled > maxDistance) break;
  }
  return vec2(-1.0, -1.0);
}

float ambientOcclusion(vec3 p, vec3 n) {
  float occlusion = 0.0;
  float weight = 1.0;
  for (int i = 1; i <= 5; i++) {
    float distanceAlongNormal = 0.11 * float(i);
    float sceneDistance = mapScene(p + n * distanceAlongNormal).x;
    occlusion += (distanceAlongNormal - sceneDistance) * weight;
    weight *= 0.68;
  }
  return clamp(1.0 - 1.7 * occlusion, 0.0, 1.0);
}

float softShadow(vec3 ro, vec3 rd, float maxDistance) {
  float result = 1.0;
  float distanceAlongRay = 0.035;
  for (int i = 0; i < 28; i++) {
    float h = mapScene(ro + rd * distanceAlongRay).x;
    if (h < 0.001) return 0.0;
    result = min(result, 12.0 * h / distanceAlongRay);
    distanceAlongRay += clamp(h, 0.025, 0.24);
    if (distanceAlongRay >= maxDistance) break;
  }
  return clamp(result, 0.0, 1.0);
}

vec3 albedo(float materialId) {
  vec3 sphereColor = vec3(0.96, 0.20, 0.16);
  vec3 torusColor = vec3(0.06, 0.72, 0.68);
  vec3 boxColor = vec3(1.00, 0.57, 0.17);
  vec3 capsuleColor = vec3(0.46, 0.30, 0.92);
  vec3 floorColor = vec3(0.075, 0.105, 0.18);

  if (materialId < 1.5) return mix(sphereColor, torusColor, smoothstep(1.0, 2.0, materialId));
  if (materialId < 2.5) return mix(torusColor, boxColor, smoothstep(2.0, 3.0, materialId));
  if (materialId < 3.5) return mix(boxColor, capsuleColor, smoothstep(3.0, 4.0, materialId));
  if (materialId < 4.5) return mix(capsuleColor, floorColor, smoothstep(4.0, 5.0, materialId));
  return floorColor;
}

float reflectivity(float materialId) {
  if (materialId < 1.5) return 0.12;
  if (materialId < 2.5) return 0.52;
  if (materialId < 3.5) return 0.28;
  if (materialId < 4.5) return 0.34;
  return 0.27;
}

vec3 skyColor(vec3 rd) {
  float horizon = smoothstep(-0.32, 0.62, rd.y);
  vec3 sky = mix(vec3(0.055, 0.075, 0.13), vec3(0.18, 0.30, 0.48), horizon);
  vec3 sunDirection = normalize(vec3(-0.45, 0.62, 0.72));
  float sun = pow(max(dot(rd, sunDirection), 0.0), 34.0);
  return sky + vec3(1.0, 0.57, 0.29) * sun * 0.45;
}

vec3 directSurfaceLight(vec3 p, vec3 n, vec3 viewDirection, float materialId, bool useShadow) {
  vec3 lightPosition = vec3(2.7 + 0.35 * sin(uTime * 0.35), 3.5, 2.4);
  vec3 toLight = lightPosition - p;
  float lightDistance = length(toLight);
  vec3 lightDirection = toLight / lightDistance;
  float shadow = useShadow ? softShadow(p + n * 0.014, lightDirection, lightDistance) : 1.0;
  float ao = ambientOcclusion(p, n);
  vec3 base = albedo(materialId);
  float diffuse = max(dot(n, lightDirection), 0.0);
  vec3 halfDirection = normalize(lightDirection + viewDirection);
  float specular = pow(max(dot(n, halfDirection), 0.0), 48.0);

  vec3 ambient = base * (vec3(0.075, 0.095, 0.14) + vec3(0.09, 0.13, 0.20) * max(n.y, 0.0)) * ao;
  vec3 keyLight = base * vec3(1.15, 0.72, 0.43) * diffuse * shadow;
  vec3 highlights = vec3(1.0, 0.76, 0.54) * specular * shadow * (0.24 + 0.42 * reflectivity(materialId));
  return ambient + keyLight + highlights;
}

vec3 toneMap(vec3 color) {
  return clamp((color * (2.51 * color + 0.03)) / (color * (2.43 * color + 0.59) + 0.14), 0.0, 1.0);
}

void main() {
  vec2 uv = gl_FragCoord.xy / uResolution * 2.0 - 1.0;
  uv.x *= uResolution.x / uResolution.y;

  float orbit = uTime * 0.18;
  vec3 target = vec3(-0.08, -0.38, 0.0);
  vec3 rayOrigin = target + vec3(sin(orbit) * 6.5, 2.08 + 0.16 * sin(orbit * 1.7), cos(orbit) * 6.5);
  vec3 forward = normalize(target - rayOrigin);
  vec3 right = normalize(cross(forward, vec3(0.0, 1.0, 0.0)));
  vec3 up = cross(right, forward);
  vec3 rayDirection = normalize(forward + 0.72 * (uv.x * right + uv.y * up));

  vec3 color = skyColor(rayDirection);
  vec2 hit = rayMarch(rayOrigin, rayDirection, 26.0, 100);

  if (hit.x > 0.0) {
    vec3 position = rayOrigin + rayDirection * hit.x;
    vec3 normal = getNormal(position);
    vec3 viewDirection = normalize(rayOrigin - position);
    vec3 baseColor = directSurfaceLight(position, normal, viewDirection, hit.y, true);

    float fresnel = pow(1.0 - max(dot(normal, viewDirection), 0.0), 5.0);
    baseColor += vec3(0.08, 0.32, 0.62) * fresnel * 0.34;

    vec3 reflectedDirection = reflect(rayDirection, normal);
    vec2 reflectedHit = rayMarch(position + normal * 0.018, reflectedDirection, 18.0, 72);
    vec3 reflectedColor = skyColor(reflectedDirection);
    if (reflectedHit.x > 0.0) {
      vec3 reflectedPosition = position + normal * 0.018 + reflectedDirection * reflectedHit.x;
      vec3 reflectedNormal = getNormal(reflectedPosition);
      reflectedColor = directSurfaceLight(reflectedPosition, reflectedNormal, -reflectedDirection, reflectedHit.y, false);
    }

    float reflectionAmount = reflectivity(hit.y) * (0.42 + 0.58 * fresnel);
    color = mix(baseColor, reflectedColor, reflectionAmount);
    color = mix(color, skyColor(rayDirection), 1.0 - exp(-0.012 * hit.x));
  }

  color = toneMap(color);
  color = pow(color, vec3(1.0 / 2.2));
  gl_FragColor = vec4(color, 1.0);
}
`;

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.4));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const uniforms = {
  uResolution: { value: new THREE.Vector2() },
  uTime: { value: 0 }
};

function resize() {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.4));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.getDrawingBufferSize(uniforms.uResolution.value);
}
window.addEventListener('resize', resize);
resize();

const material = new THREE.ShaderMaterial({
  uniforms,
  vertexShader,
  fragmentShader,
  depthTest: false,
  depthWrite: false
});
const scene = new THREE.Scene();
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
camera.position.z = 1;

renderer.setAnimationLoop((time) => {
  uniforms.uTime.value = time * 0.001;
  renderer.render(scene, camera);
});
</script>
</body>
</html>
