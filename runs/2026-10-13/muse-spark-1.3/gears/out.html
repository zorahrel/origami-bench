<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clockwork Automaton</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0e14}
canvas{display:block}
#tick{position:fixed;left:14px;bottom:12px;color:#e8c26a;font:600 13px/1.4 monospace;letter-spacing:2px;opacity:.9;user-select:none}
#title{position:fixed;left:14px;top:12px;color:#cfd6e4;font:600 12px/1.4 monospace;letter-spacing:2px;opacity:.75;user-select:none}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head>
<body>
<div id="title">CLOCKWORK AUTOMATON · ONE MASTER ANGLE</div>
<div id="tick">TICK</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b0e14);
scene.fog=new THREE.Fog(0x0b0e14,16,30);
const cam=new THREE.PerspectiveCamera(44,innerWidth/innerHeight,0.1,100);
cam.position.set(0,0.4,13.5);
const ren=new THREE.WebGLRenderer({antialias:true});
ren.setSize(innerWidth,innerHeight);
ren.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(ren.domElement);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);});
// fake environment lighting: hemi + key + warm rim + cool fill + moving glint
scene.add(new THREE.HemisphereLight(0x8fa3c7,0x1a1208,0.85));
const key=new THREE.DirectionalLight(0xfff2d8,2.0);key.position.set(5,8,7);scene.add(key);
const rim=new THREE.DirectionalLight(0x7fb4ff,1.1);rim.position.set(-6,3,-4);scene.add(rim);
const warm=new THREE.PointLight(0xff9a3c,18,20);warm.position.set(-4,-2,4);scene.add(warm);
const cool=new THREE.PointLight(0x4c7dff,16,20);cool.position.set(4,3,4);scene.add(cool);
const glint=new THREE.PointLight(0xffffff,8,15);scene.add(glint);
const brass=new THREE.MeshStandardMaterial({color:0xc9982f,metalness:0.95,roughness:0.32});
const brass2=new THREE.MeshStandardMaterial({color:0xe0b64f,metalness:0.95,roughness:0.25});
const steel=new THREE.MeshStandardMaterial({color:0xb8c0cc,metalness:0.95,roughness:0.28});
const darkSteel=new THREE.MeshStandardMaterial({color:0x5a6170,metalness:0.9,roughness:0.45});
const copper=new THREE.MeshStandardMaterial({color:0xb46a3c,metalness:0.95,roughness:0.35});
const ruby=new THREE.MeshStandardMaterial({color:0xc0182e,metalness:0.3,roughness:0.2,emissive:0x550000});
const plateMat=new THREE.MeshStandardMaterial({color:0x2a1f14,metalness:0.8,roughness:0.55});
// back plate + pillars
const plate=new THREE.Mesh(new THREE.BoxGeometry(10.5,7.6,0.3),plateMat);
plate.position.set(0,0,-0.75);scene.add(plate);
const plate2=new THREE.Mesh(new THREE.BoxGeometry(10.5,7.6,0.12),darkSteel);
plate2.position.set(0,0,-0.95);scene.add(plate2);
for(const [x,y] of [[-4.9,3.4],[4.9,3.4],[-4.9,-3.4],[4.9,-3.4]]){
  const p=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,1.6,12),brass);
  p.rotation.x=Math.PI/2;p.position.set(x,y,0);scene.add(p);
}
function gearGeo(T,mod,depth,sharp){
  const rp=T*mod/2,ro=rp+mod*(sharp?1.4:0.85),rr=rp-mod*0.7;
  const s=new THREE.Shape(),N=T*4;
  for(let i=0;i<=N;i++){
    const a=i/N*Math.PI*2,ph=i%4;
    let r=rr;
    if(!sharp){if(ph===1||ph===2)r=ro;}
    else{if(ph===2)r=ro;}
    const x=Math.cos(a)*r,y=Math.sin(a)*r;
    i?s.lineTo(x,y):s.moveTo(x,y);
  }
  s.closePath();
  const g=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:false});
  g.translate(0,0,-depth/2);return g;
}
function makeWheel(T,mod,mat,depth){
  const grp=new THREE.Group();
  const m=new THREE.Mesh(gearGeo(T,mod,depth||0.22,false),mat);
  grp.add(m);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.5,16),darkSteel);
  hub.rotation.x=Math.PI/2;grp.add(hub);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(T*mod/2*0.55,0.05,8,32),mat);
  grp.add(ring);
  for(let k=0;k<4;k++){
    const sp=new THREE.Mesh(new THREE.BoxGeometry(T*mod/2*0.9,0.09,0.06),mat);
    sp.rotation.z=k*Math.PI/4;grp.add(sp);
  }
  const arb=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,1.8,10),steel);
  arb.rotation.x=Math.PI/2;arb.position.z=-0.5;grp.add(arb);
  return grp;
}
// ---- gear train: 8 wheels, tooth counts decrease, opposite rotation ----
const teeth=[64,48,40,32,24,18,14,12],mod=0.045;
const wheels=[];const pos=[new THREE.Vector2(-3.6,2.3)];
for(let i=1;i<8;i++){
  const r0=teeth[i-1]*mod/2,r1=teeth[i]*mod/2;
  const d=i*2.35+0.4,dist=r0+r1+0.03;
  pos.push(new THREE.Vector2(pos[i-1].x+Math.cos(d)*dist,pos[i-1].y+Math.sin(d)*dist*0.8));
}
const mats=[brass,steel,brass2,copper,steel,brass,copper,steel];
for(let i=0;i<8;i++){
  const w=makeWheel(teeth[i],mod,mats[i%8],0.2);
  w.position.set(pos[i].x,pos[i].y,(i%2)*0.4);
  scene.add(w);wheels.push(w);
}
// ---- escapement: 30-tooth escape wheel + anchor + pendulum ----
const escT=30;
const esc=new THREE.Group();
esc.add(new THREE.Mesh(gearGeo(escT,0.05,0.18,true),steel));
const escHub=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,0.4,12),brass);
escHub.rotation.x=Math.PI/2;esc.add(escHub);
esc.position.set(2.9,-1.7,0.2);scene.add(esc);
const anchor=new THREE.Group();
const aMat=darkSteel;
const armL=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.14,0.14),aMat);armL.position.set(-0.6,0,0);armL.rotation.z=0.5;anchor.add(armL);
const armR=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.14,0.14),aMat);armR.position.set(0.6,0,0);armR.rotation.z=-0.5;anchor.add(armR);
const palL=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.34,0.2),ruby);palL.position.set(-0.95,-0.42,0);palL.rotation.z=0.35;anchor.add(palL);
const palR=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.34,0.2),ruby);palR.position.set(0.95,-0.42,0);palR.rotation.z=-0.35;anchor.add(palR);
const aHub=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.11,0.5,12),brass);aHub.rotation.x=Math.PI/2;anchor.add(aHub);
anchor.position.set(2.9,-0.35,0.2);scene.add(anchor);
const pend=new THREE.Group();
const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,3.4,10),brass2);rod.position.y=-1.7;pend.add(rod);
const bob=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.12,28),copper);bob.rotation.x=Math.PI/2;bob.position.y=-3.3;pend.add(bob);
const bobIn=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,0.14,28),brass2);bobIn.rotation.x=Math.PI/2;bobIn.position.y=-3.3;pend.add(bobIn);
pend.position.set(2.9,-0.35,-0.5);scene.add(pend);
// ---- dial with second + minute hands at exact 1:60 ----
const dial=new THREE.Group();dial.position.set(-1.4,0.1,2.1);scene.add(dial);
dial.add(new THREE.Mesh(new THREE.CylinderGeometry(2.15,2.15,0.12,48),plateMat)).children;
const face=new THREE.Mesh(new THREE.CylinderGeometry(2.0,2.0,0.14,48),new THREE.MeshStandardMaterial({color:0xe9dfc8,metalness:0.15,roughness:0.6}));
face.rotation.x=Math.PI/2;dial.add(face);
const rimD=new THREE.Mesh(new THREE.TorusGeometry(2.05,0.12,12,64),brass);dial.add(rimD);
for(let i=0;i<60;i++){
  const big=i%5===0;
  const tick=new THREE.Mesh(new THREE.BoxGeometry(big?0.07:0.03,big?0.28:0.14,0.02),new THREE.MeshStandardMaterial({color:0x222222,roughness:0.6}));
  const a=i/60*Math.PI*2;
  tick.position.set(Math.sin(a)*(big?1.78:1.84),Math.cos(a)*(big?1.78:1.84),0.09);
  tick.rotation.z=-a;dial.add(tick);
}
function hand(len,wid,mat,z){
  const g=new THREE.Group();
  const m=new THREE.Mesh(new THREE.BoxGeometry(wid,len,0.03),mat);
  m.position.y=len/2-0.25;g.add(m);
  const tail=new THREE.Mesh(new THREE.BoxGeometry(wid*1.4,0.3,0.03),mat);
  tail.position.y=-0.25;g.add(tail);
  g.position.z=z;dial.add(g);return g;
}
const minHand=hand(1.45,0.11,new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:0.5}),0.14);
const secHand=hand(1.7,0.05,new THREE.MeshStandardMaterial({color:0xa01818,roughness:0.4}),0.18);
const pin=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.1,16),brass);
pin.rotation.x=Math.PI/2;pin.position.z=0.2;dial.add(pin);
// ---- cam + follower + hammer + bell (striker bird alternative: hammer) ----
const camGrp=new THREE.Group();camGrp.position.set(2.9,-1.7,0.75);scene.add(camGrp);
const camDisc=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.16,24),copper);
camDisc.rotation.x=Math.PI/2;camGrp.add(camDisc);
const lobe=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.34,0.16),copper);
lobe.position.set(0,0.44,0);lobe.rotation.z=0.3;camGrp.add(lobe);
const follower=new THREE.Group();follower.position.set(1.55,-1.7,0.75);scene.add(follower);
const fArm=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.08,0.08),steel);fArm.position.x=0.55;follower.add(fArm);
const fRoll=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.12,12),ruby);fRoll.rotation.x=Math.PI/2;fRoll.position.x=-0.15;follower.add(fRoll);
const bellGrp=new THREE.Group();bellGrp.position.set(0.35,-0.75,0.9);scene.add(bellGrp);
const bell=new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.55,0.6,24,1,true),brass2);
bellGrp.add(bell);
const bellTop=new THREE.Mesh(new THREE.SphereGeometry(0.18,16,12),brass2);bellTop.position.y=0.3;bellGrp.add(bellTop);
const bellPost=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,1.0,8),darkSteel);bellPost.position.y=-0.6;bellGrp.add(bellPost);
const hammer=new THREE.Group();hammer.position.set(1.35,-0.75,0.9);scene.add(hammer);
const hArm=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.07,0.07),darkSteel);hArm.position.x=-0.45;hammer.add(hArm);
const hHead=new THREE.Mesh(new THREE.SphereGeometry(0.13,14,10),copper);hHead.position.x=-0.9;hammer.add(hHead);
const hHub=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.2,12),brass);hHub.rotation.x=Math.PI/2;hammer.add(hHub);
const flash=new THREE.PointLight(0xffd777,0,6);flash.position.set(0.35,-0.5,1.6);scene.add(flash);
const tickEl=document.getElementById('tick');
const clock=new THREE.Clock();
let M=0;
const T0=teeth[0];
const ease=t=>t*t*(3-2*t);
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  M+=dt*1.0; // THE master angle; everything below derives from M
  const sec=M; // 1 master radian == 1 second for legibility
  // gear train: ratio T0/Ti, alternating sign
  for(let i=0;i<8;i++){
    const s=(i%2===0)?1:-1;
    wheels[i].rotation.z=s*M*(T0/teeth[i])+(i%2?Math.PI/teeth[i]:0);
  }
  // pendulum 2 s period + anchor
  const pendA=0.32*Math.sin(sec*Math.PI);
  pend.rotation.z=pendA;
  anchor.rotation.z=pendA*0.75;
  // escape wheel: one tooth per second, fast snap (visible tick)
  const idx=Math.floor(sec),f=sec-idx;
  const snap=f<0.14?ease(f/0.14):1;
  esc.rotation.z=-(idx+snap)*(Math.PI*2/escT);
  const isTick=f<0.14;
  tickEl.textContent=(idx%2===0)?'TICK':'TOCK';
  tickEl.style.color=isTick?'#ffe9a8':'#8a743f';
  cool.intensity=isTick?26:16;
  // hands: second = -sec*2pi/60, minute = second/60 exactly
  const sA=-sec*Math.PI*2/60, mA=sA/60;
  secHand.rotation.z=sA;minHand.rotation.z=mA;
  // cam: 1 rev per 8 s on escape arbor; follower + hammer strike in sync
  const cyc=(sec%8)/8;
  const lift=cyc<0.8?ease(cyc/0.8):1-(cyc-0.8)/0.2;
  camGrp.rotation.z=-sec*Math.PI*2/8;
  follower.rotation.z=0.12+lift*0.28;
  const strike=(cyc>0.8&&cyc<0.9);
  hammer.rotation.z=strike?-0.5:0.25-lift*0.55;
  flash.intensity=strike?14:0;
  bellGrp.scale.setScalar(strike?1.06:1.0);
  // layered drift camera + glint orbit (fake env shimmer)
  const t=performance.now()/1000;
  cam.position.x=Math.sin(t*0.16)*0.9;
  cam.position.y=0.4+Math.sin(t*0.11)*0.45;
  cam.lookAt(-0.2,0,0.4);
  glint.position.set(Math.sin(t*0.7)*5,2.5+Math.sin(t*0.45)*2,5);
  ren.render(scene,cam);
}
animate();
</script>
</body>
</html>
