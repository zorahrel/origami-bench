<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parkour Combat Loop</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0e14}
canvas{display:block}
#phase{position:fixed;top:14px;left:50%;transform:translateX(-50%);color:#fff;font:700 22px/1 system-ui,sans-serif;letter-spacing:2px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25);padding:8px 18px;border-radius:10px;pointer-events:none}
#sub{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);color:#9fb3c8;font:12px system-ui,sans-serif;letter-spacing:1px;opacity:.8}
</style>
</head>
<body>
<div id="phase">RUN</div>
<div id="sub">10s LOOP · RUN / WALL-RUN / FLIP / CROUCH / 3-HIT COMBO</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const phaseEl=document.getElementById('phase');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b0e14);
scene.fog=new THREE.Fog(0x0b0e14,16,42);
const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);
cam.position.set(-10,3,-5);
const ren=new THREE.WebGLRenderer({antialias:true});
ren.setSize(innerWidth,innerHeight);
ren.shadowMap.enabled=true;
ren.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(ren.domElement);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);});
scene.add(new THREE.HemisphereLight(0xbfd4ff,0x223018,.7));
const sun=new THREE.DirectionalLight(0xfff2d9,2.2);
sun.position.set(6,10,4);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-12;sun.shadow.camera.right=12;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;
scene.add(sun);
const pt=new THREE.PointLight(0x00e5ff,60,20);pt.position.set(-2,3,3);scene.add(pt);
const pt2=new THREE.PointLight(0xff3d81,40,20);pt2.position.set(4,2,-2);scene.add(pt2);
function checkTex(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');g.fillStyle='#e8e8e8';g.fillRect(0,0,128,128);g.fillStyle='#222831';g.fillRect(0,0,64,64);g.fillRect(64,64,64,64);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(10,10);return t;}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({map:checkTex(),roughness:.9}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(40,40,0x00e5ff,0x334155);grid.position.y=.01;scene.add(grid);
const wallG=new THREE.Group();wallG.position.set(6,0,2);scene.add(wallG);
for(let i=0;i<10;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(.4,7,1.2),new THREE.MeshStandardMaterial({color:i%2?0xd7263d:0xf4f4f4,roughness:.6}));s.position.set(0,3.5,-5.4+i*1.2);s.castShadow=s.receiveShadow=true;wallG.add(s);}
const base=new THREE.Mesh(new THREE.BoxGeometry(.8,7.4,13),new THREE.MeshStandardMaterial({color:0x111318}));base.position.set(.45,3.7,0);wallG.add(base);
function edge(x,z,w,d){const m=new THREE.Mesh(new THREE.BoxGeometry(w,.4,d),new THREE.MeshStandardMaterial({color:0x2dd4bf}));m.position.set(x,.2,z);m.receiveShadow=true;scene.add(m);}
edge(0,8,20,.5);edge(0,-8,20,.5);edge(-10,0,.5,16);
const M={skin:0xe8b08a,shirt:0x2563eb,pants:0x1f2937,dark:0x0f172a};
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.7});
const mSkin=mat(M.skin),mShirt=mat(M.shirt),mPant=mat(M.pants),mDark=mat(M.dark);
function box(w,h,d,m){const x=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);x.castShadow=true;return x;}
const root=new THREE.Group();scene.add(root);
const lean=new THREE.Group();root.add(lean);
const flip=new THREE.Group();lean.add(flip);
const hips=new THREE.Group();hips.position.y=1.02;flip.add(hips);
const torso=box(.5,.6,.3,mShirt);torso.position.y=.36;hips.add(torso);
const belt=box(.52,.1,.32,mDark);belt.position.y=.08;hips.add(belt);
const headG=new THREE.Group();headG.position.y=.78;hips.add(headG);
const head=new THREE.Mesh(new THREE.SphereGeometry(.19,20,16),mSkin);head.castShadow=true;headG.add(head);
const band=box(.30,.08,.30,mDark);band.position.y=.06;headG.add(band);
function arm(side){const s=new THREE.Group();s.position.set(.32*side,.6,0);hips.add(s);const up=box(.13,.32,.13,mShirt);up.position.y=-.15;s.add(up);const e=new THREE.Group();e.position.y=-.32;s.add(e);const fo=box(.11,.3,.11,mSkin);fo.position.y=-.14;e.add(fo);const ha=new THREE.Mesh(new THREE.SphereGeometry(.09,12,10),mSkin);ha.position.y=-.31;ha.castShadow=true;e.add(ha);return{s,e};}
function leg(side){const h=new THREE.Group();h.position.set(.13*side,-.02,0);hips.add(h);const th=box(.16,.45,.16,mPant);th.position.y=-.22;h.add(th);const k=new THREE.Group();k.position.y=-.46;h.add(k);const sh=box(.13,.44,.13,mPant);sh.position.y=-.2;k.add(sh);const ft=box(.13,.09,.26,mDark);ft.position.set(0,-.42,.06);k.add(ft);return{h,k};}
const A_L=arm(-1),A_R=arm(1),L_L=leg(-1),L_R=leg(1);
const v3=(x,y,z)=>new THREE.Vector3(x,y,z);
const P0=v3(-6.5,0,-2),P1=v3(4.4,0,-2),P2=v3(5.1,2.6,3.4),P3=v3(.5,0,1.2);
function lerpV(a,b,t,out){return out.copy(a).lerp(b,t);}
function angLerp(a,b,t){let d=(b-a)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return a+d*t;}
const clock=new THREE.Clock();
const camPos=v3(-10,3,-6),look=v3(0,1,0),tmpV=new THREE.Vector3(),tmpL=new THREE.Vector3();
let last=0;
function pose(t,dt){
const T=t%10;let name,idx;
if(T<2){idx=0;name='RUN';}else if(T<3.8){idx=1;name='WALL-RUN';}else if(T<5.2){idx=2;name='PUSH-OFF FLIP';}else if(T<5.9){idx=3;name='CROUCH LAND';}else if(T<6.9){idx=4;name='HIT 1 · PUNCH';}else if(T<7.9){idx=5;name='HIT 2 · KICK';}else if(T<9){idx=6;name='HIT 3 · SPIN KICK';}else{idx=7;name='RESET';}
phaseEl.textContent=name+' · '+T.toFixed(1)+'s';
const run=Math.sin(t*11),run2=Math.sin(t*11+Math.PI);
hips.position.y=1.02;hips.rotation.set(0,0,0);
for(const j of [A_L.s,A_R.s,A_L.e,A_R.e,L_L.h,L_R.h,L_L.k,L_R.k])j.rotation.set(0,0,0);
for(const j of [A_L.s,A_R.s])j.rotation.z=0;
A_L.s.position.set(-.32,.6,0);A_R.s.position.set(.32,.6,0);
root.rotation.set(0,0,0);lean.rotation.set(0,0,0);flip.rotation.set(0,0,0);
let yaw=Math.PI/2,off,lookOff;
if(idx===0){const u=T/2;lerpV(P0,P1,u,root.position);root.position.y=Math.abs(Math.sin(t*11))*.06;yaw=Math.PI/2;
L_L.h.rotation.x=run*.85;L_R.h.rotation.x=run2*.85;L_L.k.rotation.x=Math.max(0,-run)*1.1+.1;L_R.k.rotation.x=Math.max(0,-run2)*1.1+.1;
A_L.s.rotation.x=run2*.7;A_R.s.rotation.x=run*.7;A_L.e.rotation.x=-.5;A_R.e.rotation.x=-.5;
hips.position.y=1.02+Math.abs(Math.sin(t*11))*.04;hips.rotation.x=.12;
off=v3(-3.5,2.2,-4.5);}
else if(idx===1){const u=(T-2)/1.8;lerpV(P1,P2,u,root.position);yaw=0.15;lean.rotation.z=-.62;lean.rotation.x=.15;
const s=Math.sin(t*13);L_L.h.rotation.x=s*.9;L_R.h.rotation.x=-s*.9;L_L.k.rotation.x=.4;L_R.k.rotation.x=.5;
A_L.s.rotation.z=1.1;A_R.s.rotation.z=-.4;A_R.s.rotation.x=-.6;A_L.e.rotation.x=-.6;
off=v3(-5.5,1.6,-1.5);}
else if(idx===2){const u=(T-3.8)/1.4;lerpV(P2,P3,u,root.position);root.position.y+=Math.sin(u*Math.PI)*1.6;yaw=angLerp(.15,-1.2,u);flip.rotation.x=-u*Math.PI*2;lean.rotation.z=-.62*(1-u);
L_L.h.rotation.x=-.4;L_R.h.rotation.x=-.7;L_L.k.rotation.x=1.4;L_R.k.rotation.x=1.6;A_L.s.rotation.z=2.4;A_R.s.rotation.z=-2.4;
off=v3(-1,1.2,-6);}
else if(idx===3){const u=(T-5.2)/.7;root.position.copy(P3);root.position.y=.05*(1-u);yaw=-1.2;
const c=Math.sin(Math.min(1,u)*Math.PI/2);hips.position.y=1.02-.45*c;
L_L.h.rotation.x=-1.5*c;L_R.h.rotation.x=-1.7*c;L_L.k.rotation.x=2.1*c;L_R.k.rotation.x=2.2*c;
A_L.s.rotation.x=-.8*c;A_R.s.rotation.x=-.8*c;A_L.e.rotation.x=-.9;hips.rotation.x=.3*c;
off=v3(-3,1.8,3.5);}
else if(idx===4){root.position.copy(P3);yaw=-1.2;const u=(T-5.9)/1;const p=Math.sin(Math.min(1,u)*Math.PI);
hips.position.y=.92;A_R.s.rotation.x=-1.6*p;A_R.e.rotation.x=-.1;A_L.s.rotation.x=.5*p;A_L.e.rotation.x=-1.2;
L_L.h.rotation.x=-.3;L_R.h.rotation.x=.3;L_L.k.rotation.x=.5;L_R.k.rotation.x=.2;hips.rotation.y=-.5*p;headG.rotation.y=-.3*p;
off=v3(-3.2,1.9,3.2);}
else if(idx===5){root.position.copy(P3);yaw=-1.2;const u=(T-6.9)/1;const p=Math.sin(Math.min(1,u)*Math.PI);
hips.position.y=.95;hips.rotation.y=.4*p;L_R.h.rotation.x=-1.7*p;L_R.k.rotation.x=.2;A_L.s.rotation.x=-.5*p;A_R.s.rotation.x=.6*p;
L_L.h.rotation.x=.1;headG.rotation.y=.2;
off=v3(2.5,1.7,3.5);}
else if(idx===6){root.position.copy(P3);const u=(T-7.9)/1.1;yaw=-1.2+u*Math.PI*2;const p=Math.sin(Math.min(1,u*1.15)*Math.PI);
hips.position.y=.98;hips.rotation.y=p;L_R.h.rotation.z=-1.3*p;L_R.h.rotation.x=-.6*p;L_R.k.rotation.x=.3;
A_L.s.rotation.z=1.4*p;A_R.s.rotation.z=-1.4*p;lean.rotation.z=.15*p;
off=v3(-3.5,2.4,2.5);}
else{const u=(T-9)/1;lerpV(P3,P0,u,root.position);root.position.y=Math.sin(u*Math.PI)*.8;yaw=angLerp(-1.2+Math.PI*2,Math.PI/2,u);
hips.position.y=1.02;const s=Math.sin(t*8);L_L.h.rotation.x=s*.4;hips.rotation.y=u*1.2;
off=v3(0,3.5,-6);}
root.rotation.y=yaw;
tmpV.copy(root.position).add(off);const k=1-Math.exp(-3.2*dt);camPos.lerp(tmpV,k);
tmpL.copy(root.position).add(v3(0,1.3,0));look.lerp(tmpL,k);
cam.position.copy(camPos);cam.lookAt(look);
pt.position.set(root.position.x+1.5,2.5+Math.sin(t*2)*.5,root.position.z+1.5);
return idx;
}
function loop(){requestAnimationFrame(loop);const dt=Math.min(.05,clock.getDelta());const t=clock.elapsedTime;pose(t,dt||.016);ren.render(scene,cam);}
loop();
</script>
</body>
</html>
