<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SDF Raymarch</title><style>*{margin:0;padding:0;box-sizing:border-box}body{overflow:hidden;background:#000}canvas{display:block;width:100vw;height:100vh}</style></head><body><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const renderer = new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

const vertexShader = `
  varying vec2 vUv;
  void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
`;

const fragmentShader = `
  varying vec2 vUv;
  uniform float uTime;
  uniform vec2 uResolution;
  uniform vec3 uCamPos;
  uniform vec3 uCamTarget;
  #define PI 3.14159265359
  #define TAU 6.28318530718
  #define MARCH_STEPS 96
  #define MARCH_DIST 100.0
  #define SURF_DIST .001

  float sdSphere(vec3 p,float r){ return length(p)-r; }
  float sdTorus(vec3 p,vec2 t){ vec2 q=vec2(length(p.xz)-t.x,p.y); return length(q)-t.y; }
  float sdBox(vec3 p,vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.); }
  float sdCapsule(vec3 p,float h,float r){ vec2 d=abs(vec2(length(p.xz),p.y))-vec2(h,r); return min(max(d.x,d.y),0.)+length(max(d,0.)); }
  float sdPlane(vec3 p,float y){ return p.y-y; }
  float smin(float a,float b,float k){ float h=max(k-abs(a-b),0.)/k; return min(a,b)-h*h*h*k/6.; }

  float map(vec3 p){
    float t=uTime;
    float d=1e5;
    // animated primitives
    vec3 s1=vec3(2.5*sin(t*.7),1.5+sin(t*.5)*.5,2.5*cos(t*.7));
    d=smin(d,sdSphere(p-s1,.8+sin(t)*.3),.5);
    vec3 s2=vec3(-2.5*cos(t*.6),1.2+cos(t*.4)*.4,-2.5*sin(t*.6));
    d=smin(d,sdTorus(p-s2,vec2(.6+.2*sin(t),.25+.1*cos(t))),.5);
    vec3 s3=vec3(0.,2.+sin(t*.8)*.6,0.);
    d=smin(d,sdBox(p-s3,vec3(.7,.7,.7)+.2*sin(vec3(t,t*1.3,t*.7))),.5);
    vec3 s4=vec3(-2.*sin(t*.5),.8+cos(t*.3)*.3,2.*cos(t*.5));
    d=smin(d,sdCapsule(p-s4,.5+.2*sin(t),.3+.1*cos(t*1.2)),.5);
    // floor
    d=smin(d,sdPlane(p,-.5),.3);
    return d;
  }

  vec3 calcNormal(vec3 p){
    vec2 e=vec2(SURF_DIST,0);
    return normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));
  }

  float softShadow(vec3 ro,vec3 rd,vec3 lightPos,float k){
    float res=1.,t=.01;
    for(int i=0;i<32;i++){
      float h=map(ro+rd*t);
      if(h<SURF_DIST) return .05;
      res=min(res,k*h/t);
      t+=h;
      if(t>20.) break;
    }
    return clamp(res,.05,1.);
  }

  float ao(vec3 p,vec3 n){
    float occ=0.,sc=1.;
    for(int i=0;i<5;i++){
      float h=.1+.15*float(i);
      float d=map(p+n*h);
      occ+=(h-d)*sc;
      sc*=.5;
    }
    return clamp(1.-occ*3.,0.,1.);
  }

  vec3 trace(vec3 ro,vec3 rd,float tMax,int bounce){
    float t=0.;
    for(int i=0;i<MARCH_STEPS;i++){
      vec3 p=ro+rd*t;
      float d=map(p);
      if(d<SURF_DIST){
        vec3 n=calcNormal(p);
        vec3 col=vec3(0.);
        vec3 lightDir=normalize(vec3(5.*sin(uTime*.3),8.,5.*cos(uTime*.3))-p);
        vec3 viewDir=-rd;
        float diff=max(dot(n,lightDir),0.);
        float sh=softShadow(p+n*SURF_DIST*2.,lightDir,vec3(0.),32.);
        float a=ao(p,n);
        // material colors based on primitive
        vec3 matCol;
        float id=0.;
        // crude id via position
        if(p.y<0.){ matCol=vec3(.15); id=1.; }
        else if(abs(p.x-s1.x)<1.&&abs(p.z-s1.z)<1.){ matCol=vec3(.9,.3,.2); id=2.; }
        else if(abs(p.x-s2.x)<1.&&abs(p.z-s2.z)<1.){ matCol=vec3(.2,.7,.9); id=3.; }
        else if(abs(p.x-s3.x)<1.&&abs(p.z-s3.z)<1.){ matCol=vec3(.9,.8,.2); id=4.; }
        else { matCol=vec3(.8,.4,.9); id=5.; }
        // ambient
        col+=matCol*.15*a;
        // diffuse
        col+=matCol*diff*sh;
        // specular
        vec3 hVec=normalize(lightDir+viewDir);
        float spec=pow(max(dot(n,hVec),0.),64.);
        col+=vec3(1.)*spec*sh*.5;
        // fresnel/rim
        float fres=pow(1.-max(dot(n,viewDir),0.),3.);
        col+=vec3(.2,.4,1.)*fres*.3;
        // reflection bounce
        if(bounce>0){
          vec3 refl=reflect(rd,n);
          vec3 rcol=trace(p+n*SURF_DIST*2.,refl,20.,bounce-1);
          col=mix(col,rcol,.3);
        }
        // fog
        col=mix(col,vec3(.02,.03,.05),1.-exp(-t*.05));
        return col;
      }
      t+=d;
      if(t>tMax) break;
    }
    return vec3(.02,.03,.05);
  }

  vec3 acesFilmic(vec3 x){
    float a=2.51,b=.03,c=2.43,d=.59,e=.14;
    return clamp((x*(a*x+b))/(x*(c*x+d)+e),0.,1.);
  }

  void main(){
    vec2 uv=(gl_FragCoord.xy-.5*uResolution)/min(uResolution.x,uResolution.y);
    vec3 ro=uCamPos;
    vec3 forward=normalize(uCamTarget-uCamPos);
    vec3 right=normalize(cross(forward,vec3(0,1,0)));
    vec3 up=cross(right,forward);
    vec3 rd=normalize(forward+uv.x*right+uv.y*up);
    vec3 col=trace(ro,rd,MARCH_DIST,1);
    col=acesFilmic(col);
    col=pow(col,vec3(1./2.2));
    gl_FragColor=vec4(col,1.);
  }
`;

// we need s1,s2,s3,s4 positions in fragment shader for coloring, so inject them
const material = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader: fragmentShader.replace('vec3 s1=vec3(2.5*sin(t*.7),1.5+sin(t*.5)*.5,2.5*cos(t*.7));',
    `vec3 s1=vec3(2.5*sin(t*.7),1.5+sin(t*.5)*.5,2.5*cos(t*.7));
    vec3 s2=vec3(-2.5*cos(t*.6),1.2+cos(t*.4)*.4,-2.5*sin(t*.6));
    vec3 s3=vec3(0.,2.+sin(t*.8)*.6,0.);
    vec3 s4=vec3(-2.*sin(t*.5),.8+cos(t*.3)*.3,2.*cos(t*.5));`),
  uniforms: {
    uTime: {value:0},
    uResolution: {value:new THREE.Vector2()},
    uCamPos: {value:new THREE.Vector3()},
    uCamTarget: {value:new THREE.Vector3()}
  }
});

const quad = new THREE.Mesh(new THREE.PlaneGeometry(2,2),material);
scene.add(quad);

function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h);
  material.uniforms.uResolution.value.set(w,h);
}
window.addEventListener('resize',resize);
resize();

let t=0;
function animate(){
  requestAnimationFrame(animate);
  t+=1/60;
  material.uniforms.uTime.value=t;
  // camera orbit
  const radius=12;
  const height=5;
  const angle=t*.3;
  const camPos=new THREE.Vector3(
    Math.sin(angle)*radius,
    height+Math.sin(t*.2)*1.5,
    Math.cos(angle)*radius
  );
  const target=new THREE.Vector3(0,1.5*Math.sin(t*.5),0);
  material.uniforms.uCamPos.value.copy(camPos);
  material.uniforms.uCamTarget.value.copy(target);
  renderer.render(scene,camera);
}
animate();
</script></body></html>
