<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>SDF Raymarch</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100vw;height:100vh}</style></head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const renderer = new THREE.WebGLRenderer({antialias:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

const uniforms = {
  uTime:{value:0},
  uRes:{value:new THREE.Vector2(1,1)}
};

const vert = `
varying vec2 vUv;
void main(){ vUv = uv; gl_Position = vec4(position.xy,0.0,1.0); }
`;

const frag = `
precision highp float;
varying vec2 vUv;
uniform float uTime;
uniform vec2 uRes;

float smin(float a, float b, float k){
  float h = max(k - abs(a-b), 0.0)/k;
  return min(a,b) - h*h*k*0.25;
}
float sdSphere(vec3 p, float r){ return length(p)-r; }
float sdTorus(vec3 p, vec2 t){ vec2 q = vec2(length(p.xz)-t.x, p.y); return length(q)-t.y; }
float sdBox(vec3 p, vec3 b){ vec3 q = abs(p)-b; return length(max(q,0.0)) + min(max(q.x,max(q.y,q.z)),0.0) - 0.05; }
float sdCapsule(vec3 p, vec3 a, vec3 b, float r){
  vec3 pa = p-a, ba = b-a;
  float h = clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);
  return length(pa-ba*h)-r;
}
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }

// returns distance in x, material id in y
vec2 map(vec3 p){
  float t = uTime;
  float k = 0.5 + 0.3*sin(t*0.7);

  vec3 ps = p - vec3(sin(t*0.9)*1.2, 1.0 + 0.3*sin(t*1.3), cos(t*0.7)*0.6);
  float d1 = sdSphere(ps, 0.55);

  vec3 pt = p - vec3(0.0, 1.0 + 0.2*sin(t*1.1), 0.0);
  pt.yz *= rot(t*0.6);
  pt.xy *= rot(t*0.4);
  float d2 = sdTorus(pt, vec2(0.9, 0.22));

  vec3 pb = p - vec3(cos(t*0.8)*1.3, 0.9 + 0.35*sin(t*0.9+1.0), sin(t*0.8)*1.3);
  pb.xz *= rot(t*0.7);
  pb.xy *= rot(t*0.5);
  float d3 = sdBox(pb, vec3(0.38));

  vec3 a = vec3(-0.9*cos(t*0.6), 0.9 + 0.6*sin(t*0.8), -0.9*sin(t*0.6));
  vec3 b = vec3(0.9*cos(t*0.6), 1.1 - 0.5*sin(t*0.8), 0.9*sin(t*0.6));
  float d4 = sdCapsule(p, a, b, 0.22);

  float obj = smin(smin(d1,d2,k), smin(d3,d4,k), k);
  float floorD = p.y;
  // blend floor softly with objects
  float d = smin(obj, floorD, 0.25);
  float mat = floorD < obj ? 1.0 : 0.0;
  return vec2(d, mat);
}

vec3 calcNormal(vec3 p){
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(
    map(p+e.xyy).x - map(p-e.xyy).x,
    map(p+e.yxy).x - map(p-e.yxy).x,
    map(p+e.yyx).x - map(p-e.yyx).x));
}

float softShadow(vec3 ro, vec3 rd){
  float res = 1.0, t = 0.04;
  for(int i=0;i<40;i++){
    float h = map(ro+rd*t).x;
    res = min(res, 10.0*h/t);
    t += clamp(h, 0.02, 0.4);
    if(res<0.001 || t>12.0) break;
  }
  res = clamp(res,0.0,1.0);
  return res*res*(3.0-2.0*res);
}

float calcAO(vec3 p, vec3 n){
  float occ = 0.0, sca = 1.0;
  for(int i=0;i<5;i++){
    float h = 0.02 + 0.12*float(i);
    float d = map(p+n*h).x;
    occ += (h-d)*sca;
    sca *= 0.85;
  }
  return clamp(1.0 - 2.2*occ, 0.0, 1.0);
}

float march(vec3 ro, vec3 rd){
  float t = 0.0;
  for(int i=0;i<110;i++){
    float d = map(ro+rd*t).x;
    if(d<0.001) return t;
    t += d;
    if(t>30.0) break;
  }
  return -1.0;
}

vec3 sky(vec3 rd){
  vec3 c = mix(vec3(0.55,0.65,0.85), vec3(0.08,0.12,0.25), clamp(rd.y*1.2+0.1,0.0,1.0));
  vec3 sunDir = normalize(vec3(0.6,0.7,0.4));
  c += vec3(1.0,0.7,0.4)*pow(max(dot(rd,sunDir),0.0), 24.0)*0.6;
  return c;
}

vec3 albedo(vec3 p, float mat){
  if(mat > 0.5){
    vec2 g = floor(p.xz*1.0);
    float chk = mod(g.x+g.y, 2.0);
    return mix(vec3(0.12,0.13,0.16), vec3(0.55,0.55,0.6), chk);
  }
  return vec3(0.9,0.35,0.25) + 0.4*vec3(sin(p.x*2.0+uTime), sin(p.y*3.0), sin(p.z*2.0+1.0))*0.5;
}

vec3 shade(vec3 p, vec3 rd, float mat, float reflW){
  vec3 n = calcNormal(p);
  vec3 L = normalize(vec3(0.6,0.7,0.4));
  vec3 col0 = albedo(p, mat);
  float dif = clamp(dot(n,L),0.0,1.0);
  float sh = softShadow(p+n*0.01, L);
  float ao = calcAO(p,n);
  float sky_l = 0.5+0.5*n.y;
  float fre = pow(clamp(1.0+dot(rd,n),0.0,1.0), 3.0);
  vec3 h = normalize(L-rd);
  float spe = pow(clamp(dot(n,h),0.0,1.0), 40.0) * dif * sh;

  vec3 c = col0 * (vec3(1.0,0.9,0.75)*dif*sh*1.6 + vec3(0.25,0.35,0.55)*sky_l*ao*0.8);
  c += spe*0.8;
  c += vec3(0.3,0.6,1.0)*fre*ao*0.6*(mat<0.5?1.0:0.3);  // rim glow
  return c;
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes) / uRes.y;
  float t = uTime;

  // orbiting camera with look-at
  float ang = t*0.25;
  vec3 ro = vec3(5.0*cos(ang), 2.4 + 0.8*sin(t*0.2), 5.0*sin(ang));
  vec3 ta = vec3(0.0, 0.9, 0.0);
  vec3 ww = normalize(ta-ro);
  vec3 uu = normalize(cross(ww, vec3(0.0,1.0,0.0)));
  vec3 vv = cross(uu, ww);
  vec3 rd = normalize(uv.x*uu + uv.y*vv + 1.6*ww);

  vec3 col = sky(rd);
  float tt = march(ro, rd);
  if(tt > 0.0){
    vec3 p = ro + rd*tt;
    float mat = map(p).y;
    vec3 n = calcNormal(p);
    col = shade(p, rd, mat, 1.0);

    // one-bounce reflection
    vec3 rr = reflect(rd, n);
    float fr = pow(clamp(1.0+dot(rd,n),0.0,1.0), 2.0);
    float rw = mix(0.15, 0.5, fr) * (mat>0.5 ? 0.6 : 1.0);
    vec3 ro2 = p + n*0.01;
    float t2 = march(ro2, rr);
    vec3 rc;
    if(t2 > 0.0){
      vec3 p2 = ro2 + rr*t2;
      float m2 = map(p2).y;
      rc = shade(p2, rr, m2, 0.0);
    } else {
      rc = sky(rr);
    }
    col = mix(col, rc, rw);

    // distance fog
    col = mix(col, sky(rd), 1.0 - exp(-0.012*tt*tt*0.1));
  }

  // tone mapping (ACES approx) + gamma
  col *= 1.1;
  col = (col*(2.51*col+0.03))/(col*(2.43*col+0.59)+0.14);
  col = pow(clamp(col,0.0,1.0), vec3(1.0/2.2));
  // vignette
  vec2 q = gl_FragCoord.xy/uRes;
  col *= 0.6 + 0.4*pow(16.0*q.x*q.y*(1.0-q.x)*(1.0-q.y), 0.2);
  gl_FragColor = vec4(col,1.0);
}
`;

const mat = new THREE.ShaderMaterial({
  vertexShader: vert,
  fragmentShader: frag,
  uniforms,
  depthTest:false,
  depthWrite:false
});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), mat));

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w,h);
  const pr = renderer.getPixelRatio();
  uniforms.uRes.value.set(w*pr, h*pr);
}
window.addEventListener('resize', resize);
resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(()=>{
  uniforms.uTime.value = clock.getElapsedTime();
  renderer.render(scene, camera);
});
</script>
</body></html>
