# name   adapter   argument          (one line = one model; add yours below)
# adapters:
#   claude <model-id>     Claude Code CLI:  claude -p --model <id>
#   codex  <model>        OpenAI Codex CLI: codex exec -m <model>
#   openai <model>        any OpenAI-compatible endpoint (BENCH_OPENAI_BASE, BENCH_OPENAI_KEY)
#   agentdir <command>    CLI agent called as `<command> -C <dir> <prompt>` that may write an .html file
#   cmd <shell command>   reads the prompt from $PROMPT_FILE, prints the HTML (or a reply containing it) to stdout
# Private extras go in models.local.conf (git-ignored).
sonnet-5.5       claude   claude-sonnet-5-5
opus-5.5         claude   claude-opus-5-5
gpt-6-luna       codex    gpt-6-luna
